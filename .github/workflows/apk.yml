name: APK Android (Sistema MR)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/apk.yml']
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: false }
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Chave de assinatura
        env:
          MR_KEYSTORE_B64: ${{ secrets.MR_KEYSTORE_B64 }}
          MR_KEYSTORE_PASS: ${{ secrets.MR_KEYSTORE_PASS }}
        run: |
          if [ -n "$MR_KEYSTORE_B64" ]; then
            echo "$MR_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/mr.jks
            echo "KS_PASS=$MR_KEYSTORE_PASS" >> $GITHUB_ENV
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore $RUNNER_TEMP/mr.jks -alias sistemamr -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass $P -keypass $P -dname "CN=RF Sistemas, O=RF Sistemas, L=Feira de Santana, ST=BA, C=BR"
            echo "KS_PASS=$P" >> $GITHUB_ENV
          fi
          echo "KS_FILE=$RUNNER_TEMP/mr.jks" >> $GITHUB_ENV
      - name: Compilar
        working-directory: android-app
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: '1.${{ github.run_number }}'
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee $RUNNER_TEMP/build.log
      - name: Publicar o APK no site
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk $RUNNER_TEMP/SistemaMR.apk
          git config user.name "RF Sistemas"; git config user.email "comercial@rflogistica.com.br"
          git fetch origin main
          git checkout -f -B publicar origin/main
          mkdir -p apk
          cp $RUNNER_TEMP/SistemaMR.apk apk/SistemaMR.apk
          echo "APK Sistema MR 1.${{ github.run_number }} gerado em $(date -u)" > apk/build-log.txt
          git add apk/SistemaMR.apk apk/build-log.txt
          git commit -m "APK Sistema MR 1.${{ github.run_number }} [skip ci]"
          git push origin publicar:main 2>&1 | tee $RUNNER_TEMP/build.log
      - name: Registrar erro da compilação
        if: failure()
        run: |
          mkdir -p apk
          { echo "Falhou em $(date -u)"; tail -n 150 $RUNNER_TEMP/build.log 2>/dev/null || echo "sem log de gradle (falhou antes)"; } > apk/build-log.txt
          git config user.name "RF Sistemas"; git config user.email "comercial@rflogistica.com.br"
          git add apk/build-log.txt; git commit -m "Log da compilação do APK [skip ci]" || exit 0
          git pull --rebase origin main; git push origin HEAD:main
