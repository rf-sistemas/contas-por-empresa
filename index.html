async function importarExtrato(){
  if(!_extrato) return;
  const empresaEnt = val('ex-empresa') || null;
  let origemId = val('ex-origem') || null;

  if(!origemId){
    const cab = _extrato.cab;
    const ehCartao = _extrato.linhas.some(l=>l.vencimento);
    const nome = [cab.banco, cab.titular].filter(Boolean).join(' — ') || (ehCartao?'Cartão':'Conta importada');
    const { data, error } = await sb.from('origens')
      .insert({ nome, tipo: ehCartao?'cartao':'conta', identificador: cab.conta||null, titular: cab.titular||null })
      .select().maybeSingle();
    if(error){
      // já existe uma origem para essa conta: usa ela em vez de reclamar
      const { data:achada } = await sb.from('origens').select('*')
        .eq('identificador', cab.conta||'').limit(1);
      let ja = (achada && achada[0]) || S.origens.find(o=>
        (o.identificador||'') === (cab.conta||'') || norm(o.nome) === norm(nome));
      if(!ja) return aviso('Não criou a origem: '+error.message,'erro');
      if(!S.origens.find(o=>o.id===ja.id)) S.origens.push(ja);
      origemId = ja.id;
      statusExtrato('Usando a conta já cadastrada: '+esc(ja.nome)+'.');
    } else {
      S.origens.push(data); origemId = data.id;
    }
  }

  marcarRepetidos(origemId);
  const obraImp = !!_exObra && origemId===_exObra;   // v124
  const novos = _extrato.linhas.filter(l=>!l.repetido)
    .map(l=>{
      const daFatura = !!l.vencimento;
      const base = { tipo:l.tipo, origem_id:origemId, valor:l.valor, data_movimento: obraImp ? (l.data_parcela||l.data) : l.data,
                     descricao:l.descricao, fornecedor:l.contraparte||null,
                     pago: !daFatura, data_pagamento: daFatura ? null : l.data,
                     vencimento: l.vencimento || null, criado_por:S.user.id };
      if(_exPessoa){ base.pessoal = true; base.pessoa_id = _exPessoa; base.empresa_id = null; return base; }   // v99
      if(obraImp){ base.empresa_id = null; base.observacao = '[Fatura '+((_extrato.fat&&_extrato.fat.bandeira)||'cartão')+' venc. '+dataBR(l.vencimento||'')+' — importada na Obra do IDAD]'; return base; }   // v124: sem sugestão, cada compra é direcionada na aba
      const sug = sugerirEmpresa({ fornecedor:l.contraparte, origem_id:origemId });
      if(l.tipo==='entrada' && empresaEnt) base.empresa_id = empresaEnt;
      else if(sug) base.empresa_id = sug;
      return base;
    });

  if(!novos.length) return aviso('Nada novo para importar.','ok');

  statusExtrato('Gravando '+novos.length+' lançamentos…');
  let gravados = 0;
  for(let i=0; i<novos.length; i+=100){
    const lote = novos.slice(i, i+100);
    const { data, error } = await sb.from('movimentos').insert(lote).select();
    if(error){ aviso('Parou no lançamento '+(i+1)+': '+error.message,'erro'); break; }
    (data||[]).forEach(m=>S.movimentos.unshift(m));
    gravados += (data||[]).length;
    statusExtrato('Gravando… '+gravados+' de '+novos.length);
  }
  if(obraImp && gravados) await obraGuardarFatura(origemId);   // v124
  const pp = _exPessoa; _extrato = null; _exPessoa = null; _exObra = null; S.modal = null;
  aviso(pp ? gravados+' lançamentos importados nas Despesas pessoais de '+pesNome(pp)+'.' : gravados+' lançamentos importados. O que ficou sem empresa está em "Apontar depois".','ok');
}

var _perm = null;   // { id, abas:[]|null, hosp:[]|null, emp:[] , listaHosp:[] }
function permResumo(p){
  if(p.papel==='mestre') return '<span style="color:var(--fraco)">tudo</span>';
  if(p.papel==='anestesista') return '<span style="color:var(--fraco)">só a escala dele</span>';
  const a = !Array.isArray(p.abas) ? (p.papel==='adm1' ? 'NAFS › Financeiro › Terceirizados' : 'todas as abas') : ehPerfilFinIdad(p.abas) ? '<b>Perfil Financeiro IDAD</b> (Hospital IDAD · Faturamento TISS · Agenda)' : permResumoAbas(p.abas);
  const h = Array.isArray(p.hospitais) && p.hospitais.length ? p.hospitais.length+' hospita'+(p.hospitais.length===1?'l':'is') : 'todos os hospitais';
  const ne = (S.permEmp||{})[p.id]; const e = ne && ne.length ? ne.length+' CNPJ'+(ne.length===1?'':'s') : 'todos os CNPJs';
  return a+'<br>'+h+'<br>'+e;
}
function permResumoAbas(a){
  const nomes = {}; CPE_ABAS.forEach(g=>g[1].forEach(x=>nomes[x[0]]=x[2]));
  const partes = a.filter(k=>nomes[k]).map(k=>nomes[k]);
  CPE_GRUPOS.forEach(g=>{ const t = []; CPE_TELAS_GRUPO.forEach(x=>{ if(a.indexOf(g[0]+':'+x[0])>=0 || (a.indexOf(g[0])>=0 && a.indexOf(x[0])>=0)){
      const subs = (x[3]||[]).filter(y=>a.indexOf(g[0]+':'+y[0])>=0).map(y=>y[2]); t.push(x[2]+(subs.length?' ('+subs.join(', ')+')':'')); } });
    if(t.length || a.indexOf(g[0])>=0) partes.push(g[2]+(t.length?' › '+t.join(', '):'')); });
  return partes.length ? partes.join(' · ') : 'nenhuma aba';
}

            hosp: Array.isArray(p.hospitais) ? p.hospitais.slice() : [], emp: ((S.permEmp||{})[id]||[]).slice(), busca:'' };

async function procLerFoto(inp){
  const arqs = Array.from((inp && inp.files) || []); if(!arqs.length) return;
  const st = t=>{ const e = document.getElementById('pr-st'); if(e) e.innerHTML = t; };
  try{
    procGuardar(); st('Preparando a foto…');
    const imagens = [];
    for(const f of arqs.slice(0,6)){
      const buf = await f.arrayBuffer(); if(!buf.byteLength) throw new Error('a foto veio vazia do seletor — tente pela Galeria');
      if(f.type==='application/pdf' || /\.pdf$/i.test(f.name||'')) (await saldoPdfImagens(buf.slice(0))).forEach(x=>imagens.push(x));
      else imagens.push({ b64: await saldoImgJpeg(new Blob([buf],{type:f.type||'image/jpeg'})), mime:'image/jpeg' });
    }
    st('Guardando a prova física…');
    for(const f of arqs.slice(0,6)) _proc.docs.push(await procSubirProva(f));   // v106: a foto lida fica como prova
    st('Lendo a lista… (uns 15 a 40 segundos)');
    const { data, error } = await sb.functions.invoke('ler-procedimentos', { body: { imagens: imagens.slice(0,6) } });
    if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || j.erro || m; }catch(e){} throw new Error(m); }
    if(data && data.error) throw new Error(data.error);
    const d = S.esc.dias.find(x=>x.id===_proc.diaId), h = hospDoLocal(d.local_id);
    const itens = (data && data.itens) || []; if(!itens.length) throw new Error('não achei nenhum procedimento na foto');
    let semP = 0;
    itens.forEach(x=>{ const s = procServico(h, x.procedimento); const v = s && s.valor!=null ? +s.valor : null; if(v==null && x.situacao!=='cancelado') semP++;
      _proc.itens.push({ paciente:x.paciente, idade:x.idade, procedimento: s ? s.nome : x.procedimento, valor:v, situacao:x.situacao, obs:x.obs||'' }); });
    const aviso2 = data.data && data.data!==String(d.data).slice(0,10) ? ' <b style="color:var(--vermelho)">Atenção: a lista é de '+dataBR(data.data)+'.</b>' : '';
    _proc.st = '<span style="color:var(--verde,#0f9d58)">✔ '+itens.length+' procedimento(s) lido(s)'+(semP?' — '+semP+' sem preço na tabela, digite o valor':'')+'. Confira e salve.</span>'+aviso2;
    procDesenhar();
  }catch(e){ st('<span style="color:var(--vermelho)">✖ '+esc(e.message||e)+'</span>'); }
  finally{ if(inp) inp.value = ''; }
}
async function procSalvar(){
  procGuardar();
  const id = _proc.diaId, itens = _proc.itens.filter(p=>p.procedimento);
  const r1 = await sb.from('esc_procedimentos').delete().eq('dia_id', id);
  if(r1.error) return aviso('Não gravou: '+r1.error.message,'erro');
  let novos = [];
  if(itens.length){
    const r2 = await sb.from('esc_procedimentos').insert(itens.map((p,i)=>({ dia_id:id, ordem:i+1, paciente:p.paciente||null, idade:p.idade, procedimento:p.procedimento,
      valor:p.valor, situacao:p.situacao==='cancelado'?'cancelado':'realizado', obs:p.obs||null }))).select();
    if(r2.error) return aviso('Não gravou: '+r2.error.message,'erro');
    novos = r2.data||[];
  }
  S.esc.proc[id] = novos.sort((a,b)=>a.ordem-b.ordem);
  const soma = itens.filter(p=>p.situacao!=='cancelado').reduce((t,p)=>t+(+p.valor||0),0);
  const campos = { proc_docs: _proc.docs||[] }; if(itens.length) campos.valor = Math.round(soma*100)/100;
  await escSalvarDia(id, campos);
  aviso(itens.length ? itens.length+' procedimento(s) gravado(s) — plantão em '+brl(soma)+'.' : 'Procedimentos apagados.','ok');
  _proc = null; escAbrirData(_escDataAberta);
}
async function escDataAnes(id, anesId){
  const d = S.esc.dias.find(x=>x.id===id); if(!d) return;
  const c = { anestesista_id: anesId || null };
  if(anesId){
    if(d.valor==null){ const v = escValorPadrao(d, anesId); if(v!=null) c.valor = v; }
    if(!d.empresa_id){ const l = escLocal(d.local_id); if(l.empresa_id) c.empresa_id = l.empresa_id; }

}

/* ---------- pagamentos no Painel ---------- */
async function escLancarPainel(){
  const vis = escLocaisVis().map(l=>l.id);
  const trab = escDoMes().filter(d=>vis.indexOf(d.local_id)>=0 && escTrabalho(d) && d.anestesista_id && escValidado(d) && (Number(d.valor)||0)>0);
  const g = {};
  trab.forEach(d=>{ const k = d.anestesista_id+'|'+(d.empresa_id||''); const x = g[k] = g[k] || { anes:d.anestesista_id, emp:d.empresa_id||null, n:0, total:0 }; x.n++; x.total += Number(d.valor)||0; });
  const ks = Object.keys(g); if(!ks.length) return alert('Nenhum dia com anestesista e valor neste mês.');
  if(ks.some(k=>!g[k].emp) && !confirm('Tem dia sem CNPJ definido — esses pagamentos vão para "Apontar depois". Continuar?')) return;
  if(!confirm('Lançar '+ks.length+' pagamento(s) de '+escMesNome(S.mes)+' ('+S.esc.hosp+') no Painel como saídas a pagar?')) return;
  let feitos=0, pulados=0;
  for(const k of ks){
    const x = g[k], a = escAnes(x.anes) || { nome:'?' };
    const desc = 'Escala '+(escGrupo()==='NAFS'?'anestesia':escGrupo().toLowerCase())+' '+escMesNome(S.mes)+' — '+S.esc.hosp+' — '+a.nome+' ('+x.n+' dia'+(x.n>1?'s':'')+')';
    if(S.movimentos.some(m=>m.categoria==='Escala anestesia' && m.descricao===desc && (m.empresa_id||null)===x.emp)){ pulados++; continue; }
    const reg = { tipo:'saida', empresa_id:x.emp, valor: Math.round(x.total*100)/100, data_movimento: escUltimoDia(S.mes),
      fornecedor: a.nome, categoria:'Escala anestesia', descricao: desc, pago:false, criado_por: S.user.id };
    const r = await sb.from('movimentos').insert(reg).select().maybeSingle();
    if(r.error) return aviso('Parou num erro: '+r.error.message,'erro');
    S.movimentos.unshift(r.data); feitos++;
  }
  aviso(feitos+' pagamento(s) lançado(s) no Painel'+(pulados?' · '+pulados+' já existia(m)':'')+'.','ok');
}

    h += '<div class="kpis" style="margin-top:12px">'+kpi('Validados no mês', meus.length)+kpi('A receber', brl(tot-pg))+kpi('Já pago', brl(pg))+'</div>'; }
  return h+(logado?'':'<div style="text-align:center;color:var(--fraco);font-size:11px;margin-top:10px">'+SISTEMA.codigo+' '+SISTEMA.versao+'</div>')+'</div>';
}

/* ===== v83 (Renato, 12/11/2026): "toda vez tenho que sair e entrar de novo" =====
   1) VERSÃO: a cada 1 min e sempre que o app volta para a frente, busca o index.html sem cache e compara o rf-versao.
      Se mudou, recarrega sozinho (com ?v= novo, que fura o cache do GitHub e do WebView). Se tiver janela aberta
      ou alguém digitando, só mostra a faixa "Nova versão" no topo, para não perder o que está sendo feito.
   2) DADOS: a cada 2 min e ao voltar para o app, busca de novo perfil/permissões, CNPJs, movimentos, escala e saldo,
      sem tela de carregando. Botão ⟳ no topo faz isso na hora. */
var _atuRodando = false, _atuUlt = 0;
function cpeOcupado(){ const a = document.activeElement; return !!S.modal || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=='button'); }
function cpeRecarregar(v){
  try{ const u = new URL(location.href); u.searchParams.set('v', v || Date.now()); location.replace(u.toString()); }catch(e){ location.reload(); }
}
async function checarVersao(){
  try{
    const r = await fetch('index.html?_='+Date.now(), { cache:'no-store' }); if(!r.ok) return;
    const m = (await r.text()).match(/name="rf-versao" content="(v\d+)"/); if(!m || m[1]===SISTEMA.versao) return;
    let ja = ''; try{ ja = sessionStorage.getItem('cpe_recarregou')||''; }catch(e){}
    if(!cpeOcupado() && ja!==m[1]){ try{ sessionStorage.setItem('cpe_recarregou', m[1]); }catch(e){} cpeRecarregar(m[1]); return; }
    if(S.novaVersao!==m[1]){ S.novaVersao = m[1]; if(!cpeOcupado()) render(); }
  }catch(e){}
}
async function atualizarSilencioso(forcar){
  if(!S.user || S.anesTok || S.carregando || _atuRodando) return;
  if(!forcar && cpeOcupado()) return;
  _atuRodando = true; _atuUlt = Date.now();
  try{
    const { data:perfil } = await sb.from('perfis').select('*').eq('id', S.user.id).maybeSingle();
    if(perfil) S.perfil = perfil;
    if(!ehAnes()){
      const [emp, ori, mov, reg] = await Promise.all([
        sb.from('empresas').select('*').order('razao_social'),
        sb.from('origens').select('*').order('nome'),
        lerTudo(()=>sb.from('movimentos').select('*').order('data_movimento',{ascending:false}).order('id')),
        sb.from('regras_fornecedor').select('*')
      ]);
      if(!emp.error) S.empresas = emp.data||[]; if(!ori.error) S.origens = ori.data||[];
      if(!mov.error) S.movimentos = mov.data||[]; if(!reg.error) S.regras = reg.data||[];
      await pesCarregar();
      if(podeUsuarios()){ const { data:ps } = await sb.from('perfis').select('*').order('papel'); if(ps) S.perfis = ps; }
    }
    if(S.esc && S.esc.carregado){ S.esc.carregado = false; S.esc.proc = {}; await escCarregar(); } /* v105: procedimentos também recarregam (antes ficavam presos na 1ª leitura) */
    if(S.saldo) S.saldo.carregado = false;
    if(S.conv && S.conv.carregado && !S.conv.carregando){ const r = await sb.from('idad_convenios').select('*').order('convenio').order('procedimento').order('vigencia_inicio'); if(!r.error) S.conv.lista = r.data||[]; }
    if(S.vini && S.vini.st && viniDono()) await viniCarregar();
    if(S.rob && S.rob.robos && viniDono()) await robCarregar();
    if(S.fich && S.fich.carregado && !S.fich.carregando){ const r = await sb.from('fichas').select('*').order('criado_em',{ascending:false}); if(!r.error) S.fich.lista = r.data||[]; }
  }catch(e){}
  _atuRodando = false;
  if(_syncDeNovo){ _syncDeNovo = false; return atualizarSilencioso(true); }
  if(!cpeOcupado()) render(); else _renderPend = true;
}
/* v104 (Renato, 17/11/2026: "vão mexer juntas e atualizar juntas e não pode dar divergência"):
   TEMPO REAL — qualquer gravação em movimentos/regras/escala/procedimentos/empresas/origens dispara um gatilho no banco
   que mexe na tabela cpe_sinal; todas as telas abertas escutam essa tabela e recarregam os dados na hora.
   Se a pessoa estiver digitando ou com uma janela aberta, os dados já chegam e a tela redesenha assim que ela terminar. */
var _syncDeNovo = false, _renderPend = false, _syncTimer = null, _syncCanal = null;
function syncLigar(){
  if(_syncCanal || !S.user || S.anesTok) return;
  _syncCanal = sb.channel('cpe-sinal').on('postgres_changes', { event:'UPDATE', schema:'public', table:'cpe_sinal' }, ()=>{
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(()=>{ if(_atuRodando) _syncDeNovo = true; else atualizarSilencioso(true); }, 700);
  }).subscribe(st=>{ if(st==='CHANNEL_ERROR' || st==='TIMED_OUT'){ try{ sb.removeChannel(_syncCanal); }catch(e){} _syncCanal = null; setTimeout(syncLigar, 5000); }
                     if(st==='SUBSCRIBED') atualizarSilencioso(true); });
}
function syncDesligar(){ if(_syncCanal){ try{ sb.removeChannel(_syncCanal); }catch(e){} _syncCanal = null; } }
setInterval(()=>{ if(_renderPend && !cpeOcupado()){ _renderPend = false; render(); } }, 1200);
setInterval(()=>{ if(S.user && !S.anesTok && !_syncCanal) syncLigar(); }, 10000);
async function atualizarAgora(){ aviso('Atualizando…','ok'); await checarVersao(); await atualizarSilencioso(true); aviso('Atualizado.','ok'); }
setInterval(()=>{ if(document.visibilityState==='visible' && S.tela==='vini' && viniDono() && !S.modal) viniCarregar(); }, 8000);   // v119: QR e conversas do Vini ao vivo
setInterval(()=>{ if(document.visibilityState!=='visible') return; checarVersao(); if(Date.now()-_atuUlt > 120000) atualizarSilencioso(); }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ checarVersao(); if(Date.now()-_atuUlt > 20000) atualizarSilencioso(); } });
window.addEventListener('focus', ()=>{ checarVersao(); });

/* Obrigatoriedade: o mesmo fornecedor (ou descrição) saindo do mesmo CNPJ em pelo menos 2 dos 3 meses anteriores = conta de todo mês. */
function finMesMais(comp, n){ const p = comp.split('-'); const d = new Date(+p[0], +p[1]-1+n, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function finChave(m){ const n = String(m.fornecedor||m.descricao||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[0-9\/\-\.]+/g,' ').replace(/\s+/g,' ').trim(); return n ? m.pessoa_id+'|'+n : ''; }
function finObrigacoes(comp){
  const ant = [finMesMais(comp,-1), finMesMais(comp,-2), finMesMais(comp,-3)];
  const sai = finMovs().filter(m=>m.tipo!=='entrada'), g = {};
  sai.forEach(m=>{ const mes = String(m.data_movimento||'').slice(0,7), k = finChave(m); if(!k) return;
    const x = g[k] = g[k] || { k, meses:{}, ult:null, mov:null };
    if(ant.indexOf(mes)>=0){ x.meses[mes] = 1; if(!x.ult || String(m.data_movimento)>String(x.ult.data_movimento)) x.ult = m; }
    if(mes===comp && (!x.mov || !x.mov.pago)) x.mov = m; });
  return Object.values(g).filter(x=>Object.keys(x.meses).length>=2 && x.ult);
}
function telaFinObr(){
  const comp = S.fin.obrMes || hojeISO().slice(0,7);
  const toda = finObrigacoes(comp), l = toda.filter(x=>finBuscaOk(x.ult));
  const falta = l.filter(x=>!x.mov), apagar = l.filter(x=>x.mov && !x.mov.pago), pagas = l.filter(x=>x.mov && x.mov.pago);
  const ordem = (a,b)=>String(a.ult.fornecedor||a.ult.descricao||'').localeCompare(String(b.ult.fornecedor||b.ult.descricao||''));
  const prevVal = x=>Number((x.mov||x.ult).valor)||0, tot = arr=>arr.reduce((s,x)=>s+prevVal(x),0);

    '<div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:var(--fraco);font-weight:700">📅 MÊS</span>'+
      '<button class="bt g mini" onclick="S.fin.obrMes=finMesMais(\''+comp+'\',-1);render()">‹</button><input type="month" value="'+comp+'" onchange="S.fin.obrMes=this.value;render()" style="width:auto;margin:0"><button class="bt g mini" onclick="S.fin.obrMes=finMesMais(\''+comp+'\',1);render()">›</button>'+

    '<div class="card"><div class="kpis">'+kpi('Contas do mês', String(l.length))+kpi('Falta lançar', brl(tot(falta)))+kpi('A pagar', brl(tot(apagar)))+kpi('Pagas', brl(tot(pagas)))+'</div>'+
    '<div style="font-size:12px;color:var(--fraco);margin-top:8px">O sistema acha sozinho: o mesmo fornecedor aparecendo em pelo menos 2 dos 3 meses anteriores entra aqui. O valor previsto é o do último mês.</div></div>';
  if(!toda.length) return h+'<div class="vazio">Ainda não há contas repetidas nos 3 meses antes de '+escMesNome(comp)+'.</div>';
  if(!l.length) return h+'<div class="vazio">Nada encontrado.</div>';
  const bloco = (tit, cor, arr)=> !arr.length ? '' : '<div class="secao" style="margin-top:6px"><b style="color:'+cor+'">'+tit+'</b><span>'+arr.length+' · '+brl(tot(arr))+'</span></div>'+
    '<div class="card" style="overflow-x:auto"><table><thead><tr><th>Fornecedor</th><th>Categoria</th><th>Cartão / conta</th><th>Último lançamento</th><th style="text-align:right">Valor</th><th></th></tr></thead><tbody>'+
    arr.sort(ordem).map(x=>{ const u = x.ult, m = x.mov;
      const acao = !m ? (podeEditar()?'<button class="bt mini" onclick="finObrLancar(\''+u.id+'\',\''+comp+'\')">+ Lançar</button>':'<span style="color:var(--vermelho);font-weight:700">Não lançada</span>')
        : m.pago ? '<span style="color:var(--verde);font-weight:700">Paga</span>'
        : (podeEditar()?'<button class="bt mini" onclick="finBaixar(\''+m.id+'\')">✔ Pago</button>':'<span style="color:#d97706;font-weight:700">A pagar</span>');
      return '<tr><td><b>'+esc(u.fornecedor||u.descricao||'—')+'</b></td><td>'+esc(u.categoria||'—')+'</td><td>'+esc(finOnde(u))+'</td>'+
        '<td style="white-space:nowrap">'+dataBR(m?m.data_movimento:u.data_movimento)+'</td><td style="text-align:right;font-weight:800;white-space:nowrap">'+brl(prevVal(x))+'</td><td style="white-space:nowrap">'+acao+'</td></tr>'; }).join('')+'</tbody></table></div>';
  return h+bloco('FALTA LANÇAR','var(--vermelho)',falta)+bloco('LANÇADAS — A PAGAR','#d97706',apagar)+bloco('PAGAS','var(--verde)',pagas);

function finObrLancar(uid, comp){
  const u = S.movimentos.find(x=>x.id===uid); if(!u) return;

  finPre({ data: comp+'-'+String(Math.min(+dia, ult)).padStart(2,'0'), valor: u.valor, empresa: '__p:'+S.pesDono, origem: u.origem_id||'', forn: u.fornecedor||'', cnpj: u.cnpj_fornecedor?mascaraCNPJ(u.cnpj_fornecedor):'', cat: u.categoria||'', desc: u.descricao||'', pago:false });
}

  S.rob.robos = r.data||[]; S.rob.pulso = p.data||[]; S.rob.exc = e.data||[]; S.rob.cfg = c.data||{}; S.rob.ia = ia.data||[]; S.rob.carregando = false; render();

async function pacDoDiaCarregar(){

  let ids = [], novos = [], ag = [];
  try{ const a = await sb.from('agenda').select('paciente_id').eq('data', hoje).neq('status','cancelado'); ids = (a.data||[]).map(x=>x.paciente_id).filter(Boolean); }catch(e){}
  try{ const ini = new Date(); ini.setHours(0,0,0,0);
    const q = await sb.from('idad_pacientes').select('*').gte('criado_em', ini.toISOString()).or('obs.is.null,obs.not.like."*Importado do Smart*"').limit(300); novos = q.data||[];
    if(q.error){ const q2 = await sb.from('idad_pacientes').select('*').gte('criado_em', ini.toISOString()).order('criado_em',{ascending:false}).limit(1000);
      novos = (q2.data||[]).filter(p=>!/^\[Importado do Smart/.test(p.obs||'')); } }catch(e){}
  ids = Array.from(new Set(ids)).filter(id=>!novos.some(p=>p.id===id));

/* v166: botão de foto na tela do Cadastro — lê o documento; se o paciente já existe abre a ficha, se não abre o cadastro novo já preenchido. */
async function pacFotoBuscar(inp){
  const st = document.getElementById('pac-fotost'), f = inp && inp.files && inp.files[0]; if(!f) return;
  const msg = h=>{ const e=document.getElementById('pac-fotost'); if(e) e.innerHTML = h; };
  try{
    msg('Lendo o documento… (uns 10 a 20 segundos)');
    const buf = await f.arrayBuffer(); if(!buf.byteLength) throw new Error('a foto veio vazia — tente de novo');
    const ehPdf = (f.type==='application/pdf') || /\.pdf$/i.test(f.name||'');
    const imagens = ehPdf ? (await saldoPdfImagens(buf.slice(0))).slice(0,2) : [{ b64: await saldoImgJpeg(new Blob([buf],{type:f.type||'image/jpeg'})), mime:'image/jpeg' }];
    const { data, error } = await sb.functions.invoke('ler-documento-paciente', { body: { imagens } });
    if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || j.erro || m; }catch(e){} throw new Error(m); }
    if(data && data.error) throw new Error(data.error);
    const c = (data && data.campos) || {};
    const achou = await pacAcharDB(c.cpf, c.carteirinha, c.nome);
    if(achou){
      try{ const q = await sb.from('idad_pacientes').select('*').eq('id', achou.id).maybeSingle(); if(q.data) pacGuardar([q.data]); }catch(e){}
      msg('<span style="color:var(--verde,#0f9d58)">✔ Paciente encontrado: '+esc(achou.nome||'')+'</span>');
      return idadPacAbrir(achou.id);
    }
    msg('<span style="color:var(--fraco)">Paciente sem cadastro — abrindo a ficha nova já preenchida. Confira e salve.</span>');
    idadPacAbrir();
    const dataOk = v=> /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : (v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/) ? v.replace(/^(\d{2})\/(\d{2})\/(\d{4})$/,'$3-$2-$1') : '');
    const preench = [];
    pacTodosCampos().forEach(([k,rot,t,ops])=>{ let v = c[k]; if(v==null || v==='') return; v = String(v).trim();
      if(t==='date'){ v = dataOk(v); if(!v) return; }
      if(t==='cpf' || t==='cep' || k==='cns'){ v = soDig(v); if(t==='cpf' && !validaCPF(v)) return; }
      if(t==='select'){ const o = (ops||[]).find(x=>norm(x)===norm(v)); if(!o) return; v = o; }
      _pacReg[k] = v; preench.push(k); });
    pacDesenhar(null);
    preench.forEach(k=>{ const e=document.getElementById('pc-'+k); if(e) e.style.background='#e6f8f1'; });
    const s2 = document.getElementById('pc-docst'); if(s2) s2.innerHTML = '<span style="color:var(--verde,#0f9d58)">✔ Paciente novo · '+preench.length+' campos lidos do documento (em verde). Confira e toque em Salvar.</span>';
  }catch(e){ msg('<span style="color:var(--vermelho)">✖ '+esc(e.message||e)+'</span>'); }
  finally{ if(inp) inp.value = ''; }
}

async function pacLerDocumento(inp){
  const st = document.getElementById('pc-docst'), arqs = Array.from((inp && inp.files) || []);
  if(!arqs.length) return;
  const msg = h=>{ if(st) st.innerHTML = h; };
  try{
    msg('Preparando a foto…');
    const imagens = [];
    for(const f of arqs.slice(0,4)){
      const buf = await f.arrayBuffer();
      if(!buf.byteLength) throw new Error('a foto veio vazia do seletor — tente pela Galeria');
      const ehPdf = (f.type==='application/pdf') || /\.pdf$/i.test(f.name||'');
      if(ehPdf) (await saldoPdfImagens(buf.slice(0))).slice(0,2).forEach(x=>imagens.push(x));
      else imagens.push({ b64: await saldoImgJpeg(new Blob([buf],{type:f.type||'image/jpeg'})), mime:'image/jpeg' });
    }
    msg('Lendo o documento… (uns 10 a 20 segundos)');
    const { data, error } = await sb.functions.invoke('ler-documento-paciente', { body: { imagens: imagens.slice(0,4) } });
    if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || j.erro || m; }catch(e){} throw new Error(m); }
    if(data && data.error) throw new Error(data.error);
    const c = (data && data.campos) || {};

    const preenchidos = [], diferentes = [];
    const dataOk = v=> /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : (v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/) ? v.replace(/^(\d{2})\/(\d{2})\/(\d{4})$/,'$3-$2-$1') : '');
    pacTodosCampos().forEach(([k,rot,t,ops])=>{
      let v = c[k]; if(v==null || v==='') return;
      v = String(v).trim();
      if(t==='date'){ v = dataOk(v); if(!v) return; }
      if(t==='cpf' || t==='cep' || k==='cns'){ v = soDig(v); if(t==='cpf' && !validaCPF(v)) return; }
      if(t==='select'){ const o = (ops||[]).find(x=>norm(x)===norm(v)); if(!o) return; v = o; }
      const atual = _pacReg[k];
      if(atual!=null && String(atual).trim()!==''){ if(norm(String(atual))!==norm(v)) diferentes.push((rot||k)+': '+v); return; }

    });
    const id = val('pc-id') || null;

    const docs = (data.documentos||[]).join(', ');

        ? '<span style="color:var(--verde,#0f9d58)">✔ Lido'+(docs?' ('+esc(docs)+')':'')+': '+preenchidos.length+' campo'+(preenchidos.length>1?'s':'')+' preenchido'+(preenchidos.length>1?'s':'')+' (em verde). Confira e toque em Salvar.</span>'
        : '<span style="color:var(--fraco)">Lido'+(docs?' ('+esc(docs)+')':'')+', mas não havia campo vazio para preencher.</span>')+
      (diferentes.length ? '<br><span style="color:var(--vermelho)">No documento está diferente do que já foi digitado (não troquei): '+esc(diferentes.join(' · '))+'</span>' : '');
    const n = document.getElementById('pc-nascimento'); if(n && n.value){ const a = idadeDe(n.value); const ie=document.getElementById('pc-idade'); if(ie) ie.value = a!=null ? a+' anos' : ''; }
    if(c.cep && !c.endereco) pacBuscaCEP(c.cep);
  }catch(e){ msg('<span style="color:var(--vermelho)">✖ '+esc(e.message||e)+'</span>'); }
  finally{ if(inp) inp.value = ''; }
}

/* ===== v158 (Renato, 24/11/2026): DESPESAS FIXAS da obra — caixa ao lado de "Cartões" na Obra do IDAD.
   Cadastro das despesas que se repetem todo mês (descrição, valor, dia de vencimento, categoria, fornecedor, início/fim).
   "Lançar no mês" cria os gastos A PAGAR na Obra (idad_obra.fixa_id + competencia AAAA-MM; índice único impede lançar duas vezes). */
function fixasMes(){ return S.idad.fixasMes || hojeISO().slice(0,7); }
function fixaVigente(x, comp){ const ini = x.inicio ? x.inicio.slice(0,7) : '0000-00', fim = x.fim ? x.fim.slice(0,7) : '9999-99'; return x.ativo && comp>=ini && comp<=fim; }
function fixasTotalMes(comp){ return (S.idad.fixas||[]).filter(x=>fixaVigente(x, comp||fixasMes())).reduce((s,x)=>s+(+x.valor||0),0); }
function telaIdadFixas(){
  if(!S.idad.carregado) idadCarregar();
  let h = '<div class="secao"><b>DESPESAS FIXAS</b><span>Obra do IDAD · gastos que se repetem todo mês</span></div>';
  if(!S.idad.carregado) return h+'<div class="vazio">Carregando…</div>';
  const comp = fixasMes(), l = (S.idad.fixas||[]).slice().sort((a,b)=>(b.ativo-a.ativo)||((a.dia_venc||99)-(b.dia_venc||99))||String(a.descricao).localeCompare(String(b.descricao)));
  const vig = l.filter(x=>fixaVigente(x, comp)), lanc = S.idad.obra.filter(o=>o.fixa_id && o.competencia===comp);
  const falta = vig.filter(x=>!lanc.some(o=>o.fixa_id===x.id));
  // v159 (Renato, 24/11/2026): as despesas fixas ficam em CAIXAS com nome (Wellington = caixa 1, Cartão = 2, Empréstimo = 3, Negociar = 4, A vencer = 5…)
  const cxs = S.idad.fixaCaixas||[], cxSel = S.idad.fixaCx||'';
  const cxBox = (c, i) => { const its = vig.filter(x=>x.caixa_id===c.id), tot = its.reduce((s2,x)=>s2+(+x.valor||0),0), pend = its.filter(x=>{ const o = lanc.find(y=>y.fixa_id===x.id); return !o || !o.pago; }).length, on = cxSel===c.id;
    return '<div class="kpi" style="cursor:pointer;'+(on?'border:2px solid #0a6cf0;background:#e8f1ff':'')+'" onclick="S.idad.fixaCx=(S.idad.fixaCx===\''+c.id+'\'?\'\':\''+c.id+'\');render()"><small>Caixa '+(i+1)+' · '+esc(c.nome)+'</small><b>'+brl(tot)+'</b><small style="text-transform:none;letter-spacing:0">'+its.length+' despesa'+(its.length===1?'':'s')+(pend?' · '+pend+' em aberto':'')+'</small></div>'; };
  const sem = vig.filter(x=>!x.caixa_id || !cxs.some(c=>c.id===x.caixa_id));
  h += '<div class="card"><div class="kpis">'+cxs.map(cxBox).join('')+
    (sem.length ? '<div class="kpi" style="cursor:pointer;'+(cxSel==='sem'?'border:2px solid #0a6cf0;background:#e8f1ff':'')+'" onclick="S.idad.fixaCx=(S.idad.fixaCx===\'sem\'?\'\':\'sem\');render()"><small>Sem caixa</small><b>'+brl(sem.reduce((s2,x)=>s2+(+x.valor||0),0))+'</b><small style="text-transform:none;letter-spacing:0">'+sem.length+' despesa(s)</small></div>' : '')+
    (podeEditar()?'<div class="kpi" style="cursor:pointer;border:2px dashed #9ab;display:flex;align-items:center;justify-content:center" onclick="fixaCaixaNova()"><b style="font-size:16px">+ Caixa</b></div>':'')+'</div>'+
    '<div style="margin-top:10px;color:var(--fraco);font-size:13.5px">Total fixo por mês: <b style="color:var(--texto)">'+brl(fixasTotalMes(comp))+'</b> · lançadas em '+comp.slice(5)+'/'+comp.slice(0,4)+': <b style="color:var(--texto)">'+lanc.length+' de '+vig.length+'</b> · pago no mês: <b style="color:var(--texto)">'+brl(lanc.filter(o=>o.pago).reduce((s2,o)=>s2+(+o.valor||0),0))+'</b></div></div>';
  if(cxSel && cxSel!=='sem'){ const c = cxs.find(x=>x.id===cxSel); if(c && podeEditar()) h += '<div class="card" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="flex:1">Mostrando só a caixa '+esc(c.nome)+'</b><button class="bt g mini" onclick="fixaCaixaRenomear(\''+c.id+'\')">Renomear</button><button class="bt g mini" style="color:var(--vermelho)" onclick="fixaCaixaExcluir(\''+c.id+'\')">Excluir caixa</button><button class="bt g mini" onclick="S.idad.fixaCx=\'\';render()">Ver todas</button></div>'; }
  h += '<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label style="margin:0;display:flex;gap:8px;align-items:center">Mês <input type="month" value="'+comp+'" style="width:170px;margin:0" onchange="S.idad.fixasMes=this.value;render()"></label><span style="flex:1"></span>'+
    (podeEditar() && falta.length ? '<button class="bt g" onclick="fixasLancarMes()">Lançar no mês ('+falta.length+')</button>' : '')+
    (podeEditar()?'<button class="bt" onclick="fixaAbrir()">+ Despesa fixa</button>':'')+'</div>';
  const lf = !cxSel ? l : cxSel==='sem' ? l.filter(x=>!x.caixa_id || !cxs.some(c=>c.id===x.caixa_id)) : l.filter(x=>x.caixa_id===cxSel);
  if(!l.length) return h+'<div class="vazio">Nenhuma despesa fixa cadastrada. Toque em <b>+ Despesa fixa</b> (ex.: aluguel de andaime, vigia, mão de obra mensal).</div>';
  if(l.length && !lf.length) return h+'<div class="vazio">Nenhuma despesa nesta caixa. Toque em <b>+ Despesa fixa</b>.</div>';
  return h+'<div class="card" style="overflow-x:auto"><table><thead><tr><th>Caixa</th><th>Vence</th><th>Descrição</th><th>Categoria</th><th>Fornecedor</th><th>Forma</th><th style="text-align:right">Valor/mês</th><th>'+comp.slice(5)+'/'+comp.slice(0,4)+'</th></tr></thead><tbody>'+
    lf.map(x=>{ const o = lanc.find(y=>y.fixa_id===x.id), v = fixaVigente(x, comp), cx = cxs.find(c=>c.id===x.caixa_id);
      const st = !v ? '<span style="color:var(--fraco)">'+(x.ativo?'fora do período':'inativa')+'</span>' : !o ? '<span style="color:#d97706;font-weight:700">não lançada</span>' : o.pago ? '<span style="color:var(--verde);font-weight:700">Pago</span>' : '<span style="color:#d97706;font-weight:700">A pagar</span>';
      return '<tr style="cursor:pointer'+(x.ativo?'':';opacity:.55')+'" onclick="fixaAbrir(\''+x.id+'\')"><td>'+(cx?esc(cx.nome):'<span style="color:var(--fraco)">—</span>')+'</td><td>'+(x.dia_venc?'dia '+x.dia_venc:'—')+'</td><td><b>'+esc(x.descricao)+'</b>'+(x.fim?'<br><small style="color:var(--fraco)">até '+dataBR(x.fim)+'</small>':'')+'</td><td>'+esc(x.categoria||'—')+'</td><td>'+esc(x.fornecedor||'—')+'</td><td>'+esc(x.forma_pag||'—')+'</td>'+
        '<td style="text-align:right;font-weight:800">'+brl(+x.valor)+'</td><td>'+st+'</td></tr>'; }).join('')+'</tbody></table></div>';
}

  const dl = (i, ops) => '<datalist id="'+i+'">'+ops.map(o=>'<option value="'+esc(o)+'">').join('')+'</datalist>';

    '<label>Caixa</label><select id="fx-caixa"'+ro+'><option value="">— sem caixa —</option>'+(S.idad.fixaCaixas||[]).map((c,i)=>'<option value="'+c.id+'"'+((x.caixa_id||(!id && S.idad.fixaCx))===c.id?' selected':'')+'>Caixa '+(i+1)+' · '+esc(c.nome)+'</option>').join('')+'</select>'+

      '<div><label>Categoria</label><input id="fx-cat" list="fx-cats"'+ro+' value="'+esc(x.categoria||'')+'">'+dl('fx-cats', OBRA_CATS)+'</div></div>'+
    '<div class="lin"><div><label>Fornecedor</label><input id="fx-forn"'+ro+' value="'+esc(x.fornecedor||'')+'"></div>'+
      '<div><label>Forma de pagamento</label><input id="fx-forma" list="fx-formas"'+ro+' value="'+esc(x.forma_pag||'')+'">'+dl('fx-formas',['Pix','Boleto','Cartão de crédito','Transferência','Dinheiro','Débito automático'])+'</div></div>'+
    '<div class="lin"><div><label>Começa em</label><input id="fx-ini" type="date"'+ro+' value="'+(x.inicio||'')+'"></div><div><label>Termina em (opcional)</label><input id="fx-fim" type="date"'+ro+' value="'+(x.fim||'')+'"></div>'+
      '<label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;cursor:pointer;padding-top:22px"><input type="checkbox" id="fx-ativo" style="width:auto"'+ro+(x.ativo?' checked':'')+'> Ativa</label></div>'+
    '<label>Observações</label><textarea id="fx-obs"'+ro+' rows="2">'+esc(x.obs||'')+'</textarea>'+

      '<button class="bt g" onclick="fecharModal()">'+(podeEditar()?'Cancelar':'Fechar')+'</button></div>');
}
async function fixaSalvar(){
  const id = val('fx-id'), g = k => val(k).trim()||null;
  const reg = { descricao:g('fx-desc'), valor:Number(val('fx-valor')), dia_venc: val('fx-dia') ? Number(val('fx-dia')) : null, categoria:g('fx-cat'), fornecedor:g('fx-forn'), forma_pag:g('fx-forma'),
    inicio:g('fx-ini'), fim:g('fx-fim'), ativo:document.getElementById('fx-ativo').checked, obs:g('fx-obs'), caixa_id: val('fx-caixa')||null };
  if(!reg.descricao) return aviso('Informe a descrição.','erro');
  if(!(reg.valor>0)) return aviso('Informe o valor por mês.','erro');
  if(reg.dia_venc!=null && !(reg.dia_venc>=1 && reg.dia_venc<=31)) return aviso('Dia do vencimento entre 1 e 31.','erro');
  const r = id ? await sb.from('idad_obra_fixas').update(reg).eq('id',id).select().maybeSingle() : await sb.from('idad_obra_fixas').insert(reg).select().maybeSingle();
  if(r.error) return aviso('Não gravou: '+r.error.message,'erro');
  if(id){ const i = S.idad.fixas.findIndex(o=>o.id===id); S.idad.fixas[i] = r.data; } else S.idad.fixas.push(r.data);
  S.modal = null; aviso('Despesa fixa salva.','ok');
}
async function fixaExcluir(id){ if(!confirm('Excluir esta despesa fixa? Os gastos já lançados na obra continuam lá.')) return;
  const r = await sb.from('idad_obra_fixas').delete().eq('id',id); if(r.error) return aviso('Não excluiu: '+r.error.message,'erro');
  S.idad.fixas = S.idad.fixas.filter(o=>o.id!==id); S.idad.obra.forEach(o=>{ if(o.fixa_id===id) o.fixa_id = null; }); S.modal = null; aviso('Despesa fixa excluída.','ok'); }
async function fixaCaixaNova(){ const n = prompt('Nome da nova caixa:'); if(!n || !n.trim()) return;
  const ordem = (S.idad.fixaCaixas||[]).reduce((m,c)=>Math.max(m, c.ordem||0), 0) + 1;
  const r = await sb.from('idad_fixa_caixas').insert({ nome:n.trim(), ordem }).select().maybeSingle(); if(r.error) return aviso('Não criou: '+r.error.message,'erro');
  (S.idad.fixaCaixas = S.idad.fixaCaixas||[]).push(r.data); S.idad.fixaCx = r.data.id; aviso('Caixa '+r.data.nome+' criada.','ok'); render(); }
async function fixaCaixaRenomear(id){ const c = S.idad.fixaCaixas.find(x=>x.id===id); const n = prompt('Novo nome da caixa:', c.nome); if(!n || !n.trim()) return;
  const r = await sb.from('idad_fixa_caixas').update({ nome:n.trim() }).eq('id',id); if(r.error) return aviso('Não renomeou: '+r.error.message,'erro'); c.nome = n.trim(); render(); }
async function fixaCaixaExcluir(id){ const c = S.idad.fixaCaixas.find(x=>x.id===id), n = (S.idad.fixas||[]).filter(x=>x.caixa_id===id).length;
  if(!confirm('Excluir a caixa '+c.nome+'?'+(n?' As '+n+' despesa(s) dela ficam "sem caixa" (não são apagadas).':''))) return;
  const r = await sb.from('idad_fixa_caixas').delete().eq('id',id); if(r.error) return aviso('Não excluiu: '+r.error.message,'erro');
  S.idad.fixaCaixas = S.idad.fixaCaixas.filter(x=>x.id!==id); S.idad.fixas.forEach(x=>{ if(x.caixa_id===id) x.caixa_id = null; }); S.idad.fixaCx = ''; render(); }
async function fixasLancarMes(){
  const comp = fixasMes(), [a, m] = comp.split('-').map(Number), ult = new Date(a, m, 0).getDate();
  const falta = (S.idad.fixas||[]).filter(x=>fixaVigente(x, comp) && !S.idad.obra.some(o=>o.fixa_id===x.id && o.competencia===comp));
  if(!falta.length) return aviso('Todas as despesas fixas deste mês já foram lançadas.');
  if(!confirm('Lançar '+falta.length+' despesa(s) fixa(s) em '+comp.slice(5)+'/'+comp.slice(0,4)+' como A PAGAR na Obra do IDAD? Total: '+brl(falta.reduce((s,x)=>s+(+x.valor||0),0)))) return;
  const regs = falta.map(x=>({ data: comp+'-'+String(Math.min(x.dia_venc||1, ult)).padStart(2,'0'), descricao: x.descricao+' ('+comp.slice(5)+'/'+comp.slice(0,4)+')', valor:+x.valor,
    categoria:x.categoria||null, fornecedor:x.fornecedor||null, forma_pag:x.forma_pag||null, pago:false, obs:'Despesa fixa', fixa_id:x.id, competencia:comp }));
  const r = await sb.from('idad_obra').insert(regs).select();
  if(r.error) return aviso('Não lançou: '+r.error.message,'erro');
  S.idad.obra = (r.data||[]).concat(S.idad.obra).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  aviso('✔ '+r.data.length+' despesa(s) fixa(s) lançada(s) na obra.','ok'); render();
}

async function obraSalvar(){
  const id = val('ob-id'), g = k => val(k).trim()||null;
  const reg = { descricao:g('ob-desc'), data:g('ob-data')||hojeISO(), valor:Number(val('ob-valor')), categoria:g('ob-cat'), etapa:g('ob-etapa'), fornecedor:g('ob-forn'),
    nf:g('ob-nf'), forma_pag:g('ob-forma'), pago:document.getElementById('ob-pago').checked, pago_em:g('ob-pagoem'), pago_por:g('ob-pagopor'), obs:g('ob-obs') };
  if(!reg.descricao) return aviso('Informe a descrição.','erro');
  if(!(reg.valor>0)) return aviso('Informe o valor.','erro');
  if(reg.pago && !reg.pago_em) reg.pago_em = hojeISO();
  const r = id ? await sb.from('idad_obra').update(reg).eq('id',id).select().maybeSingle() : await sb.from('idad_obra').insert(reg).select().maybeSingle();
  if(r.error) return aviso('Não gravou: '+r.error.message,'erro');
  if(id){ const i=S.idad.obra.findIndex(o=>o.id===id); S.idad.obra[i]=r.data; } else S.idad.obra.unshift(r.data);

/* ===== v130 (Renato, 21/11/2026): CONSOLIDAÇÃO — "anexar nota e o sistema lê e casa com a dívida do cartão".
   - Botão 🧾 Anexar nota em Cartões e contas (e o Vini pelo WhatsApp): lê a nota (ler-nota) e procura a compra em TODOS os cartões.
   - Casa quando: mesmo valor (à vista) ou parcela × nº de parcelas = valor da nota (tolerância de centavos de arredondamento),
     data da compra até 5 dias da emissão, e o nome do fornecedor parecido (ajuda a desempatar).
   - Casou → todas as parcelas daquela compra ficam VERDES "Consolidada · NF nº" (movimentos.nota_id → cartao_notas).
   - Não casou → a nota fica guardada em "Notas sem compra" e o sistema tenta de novo a cada fatura nova. */
function notaTol(v){ return Math.max(0.10, Math.abs(+v||0)*0.002); }   // até 10 centavos ou 0,2% (arredondamento de parcela)
function notaNomeParecido(a,b){ const n = s=>permNorm(String(s||'')).replace(/[^A-Z0-9 ]/gi,' ').toUpperCase().split(/\s+/).filter(w=>w.length>=3 && !/^(LTDA|COM|MAT|PARC|FEIRA|SANT|SAN|DE|DA|DO)$/.test(w));
  const A = n(a), B = n(b); return A.some(w=>B.some(x=>x.indexOf(w)===0 || w.indexOf(x)===0)); }
function notaCandidatas(nota){
  const cartoes = S.origens.filter(o=>o.tipo==='cartao').map(o=>o.id), vNota = +nota.valor||0, dN = Date.parse(nota.data||'');
  const grupos = {};
  S.movimentos.filter(m=>cartoes.indexOf(m.origem_id)>=0 && !m.nota_id && m.tipo!=='entrada').forEach(m=>{
    const pn = obraParcelaNum(m.descricao), total = pn ? (+m.valor||0)*pn[1] : (+m.valor||0);
    if(Math.abs(total - vNota) > notaTol(vNota)) return;
    if(dN && Math.abs(Date.parse(m.data_movimento) - dN) > 5*864e5) return;
    const base = String(m.fornecedor||m.descricao||'').replace(/\s*PARC\w*\.?\s*\d+\s*(\/|DE)\s*\d+.*$/i,'').trim();
    const k = m.origem_id+'|'+base+'|'+(pn?pn[1]:1)+'|'+(+m.valor).toFixed(2);
    (grupos[k] = grupos[k] || { origem_id:m.origem_id, nome:base, parcelas: pn?pn[1]:1, valor:+m.valor, total, movs:[], nomeOk: notaNomeParecido(base, nota.emitente) }).movs.push(m);
  });
  return Object.values(grupos).sort((a,b)=>(b.nomeOk-a.nomeOk) || (Math.abs(a.total-vNota)-Math.abs(b.total-vNota)));
}

    (c.parcelas>1 ? c.parcelas+'× '+brl(c.valor)+' = '+brl(c.total) : brl(c.total))+(Math.abs(c.total-nota.valor)>=0.005?' (diferença de '+brl(Math.abs(c.total-nota.valor))+' de arredondamento)':'')+'. Consolidada.</small></div>';
}

function ifinFiltrados(){

/* ===== v117 (Renato, 19/11/2026): CONCILIAÇÃO DO IDAD — base organizada para o confronto de contas (e para o robô auditor depois).
   Regra: os DOCUMENTOS-FONTE ficam guardados como vieram e não se mexe neles (lote imutável, com nome do arquivo, quem importou e quando):
     • Relatório de caixa da recepção (Pixeon) — cada atendimento com profissional, convênio, forma, PARTE DO MÉDICO e PARTE DO IDAD
     • Vendas no cartão (Stone) — bruto, taxa e líquido de cada venda

S.iconc = { mes:(()=>{ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })(), lotes:null, linhas:null, just:null, carregando:false, aba:'dia' };

  '<path d="M6 27l7-13 7 13a7 4 0 0 1-14 0z" fill="url(#gCon)" opacity=".55"/><path d="M28 27l7-13 7 13a7 4 0 0 1-14 0z" fill="url(#gCon)" opacity=".55"/>'+
  '<rect x="15" y="37" width="18" height="4" rx="2" fill="url(#gCon)"/></svg>'; }
const ICONC_FONTE = { pixeon:['Relatório de caixa da recepção','Pixeon · PDF'], stone:['Vendas no cartão','Stone · Excel/PDF'], bb:['Extrato bancário','Banco do Brasil'] };
async function iconcCarregar(){

    sb.from('idad_conc_justificativas').select('*').eq('empresa_id', e.id) ]);

function iconcResumo(){ return 'confronto do caixa, cartão e banco com o relatório da recepção'; }
const r2 = v => Math.round((+v||0)*100)/100;
function iconcDias(){

    if(x.fonte==='pixeon'){ d.n++; if(x.forma==='cartao') d.cartRec += (+x.parte_medico||0)+(+x.parte_idad||0); else d.rec += (+x.parte_idad||0); }

async function iconcPdfLinhas(buf){
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise, out = [];
  for(let p=1; p<=pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent(), L = [];
    tc.items.forEach(it=>{ if(!it.str || !it.str.trim()) return; const y = it.transform[5], x = it.transform[4];
      let l = L.find(z=>Math.abs(z.y-y)<2.5); if(!l) L.push(l = { y, it:[] }); l.it.push({ x, s:it.str }); });
    L.sort((a,b)=>b.y-a.y).forEach(l=>out.push(l.it.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')));
  }
  return out;
}
function iconcNum(s){ const neg = /^\(/.test(s); const v = Number(String(s).replace(/[()]/g,'').replace(/\./g,'').replace(',','.')); return neg ? -v : v; }
/* Relatório Pixeon "GER - Repasse de Caixa Geral": devolve {linhas, totalMed, totalIdad, totMedRel, totIdadRel, ini, fim} */
function iconcPixeon(linhasTxt){
  const recs = []; let forma = null, aux = null, cur = null, totRel = null, per = null;
  linhasTxt.forEach(ln=>{
    let m;
    if((m = ln.match(/OS - Data\/Hora:\s*(\d\d)\/(\d\d)\/(\d{4})\s*a\s*(\d\d)\/(\d\d)\/(\d{4})/))) per = [m[3]+'-'+m[2]+'-'+m[1], m[6]+'-'+m[5]+'-'+m[4]];
    if((m = ln.match(/Forma_Pag:\s*(\S+)/))){ forma = /cart/i.test(m[1]) ? 'cartao' : 'especie'; return; }
    if((m = ln.match(/Auxiliar:\s*(.+?)\s+Setor/))){ if(cur){ recs.push(cur); cur = null; } aux = m[1].trim(); return; }
    if(/^\s*Total:/.test(ln)){ const n = ln.match(/-?[\d\.]+,\d\d/g); if(n && n.length>=3) totRel = n.map(iconcNum); return; }
    if(/^\s*(Pixeon|CLINICA|GER -|OS -|Dt\. OS|Valor_Cart|SubTotal|Movimento de Caixa)/.test(ln) || !ln.trim()) return;
    if((m = ln.match(/^\s*(\d\d)\/(\d\d)\/(\d{4})/))){ if(cur) recs.push(cur); cur = { forma, data:m[3]+'-'+m[2]+'-'+m[1], aux, txt:ln }; }
    else if(cur) cur.txt += ' '+ln;
  });
  if(cur) recs.push(cur);
  const num = '\\(?-?[\\d\\.]+,\\d\\d\\)?', pat = new RegExp('(0,00)\\s+('+num+')\\s+('+num+')\\s+([A-Z][A-Z \\.]+?)\\s*('+num+')','g');
  const out = [], falhas = [];
  recs.forEach(r=>{
    const t = r.txt.replace(/\s+/g,' '), ms = [...t.matchAll(pat)];
    if(!ms.length){ falhas.push(t); return; }
    const pm = t.match(/^\d\d\/\d\d\/\d{4}\s*(\d+)\s+([A-ZÇÃÕÉÍÓÚÂÊÔ ]+?)\s*126/);
    ms.forEach(m=>{ let c = m[4].trim(), b = null; if(/^PARTICULAR./.test(c)){ b = c.slice(10).trim(); c = 'PARTICULAR'; }
      const med = iconcNum(m[2]), idd = iconcNum(m[3]);
      out.push({ data:r.data, forma:r.forma, profissional:r.aux, convenio:c, bandeira:b, parte_medico:med, parte_idad:idd, valor_bruto:Math.round((med+idd)*100)/100,
        ref_externa:pm?pm[1]:null, paciente:pm?pm[2].trim():null }); });
  });
  // linha que o padrão não pega (convênio colado no valor, ex.: "DR SAUDE CENT MEDICO0,00")
  falhas.slice().forEach((t,i)=>{ const m = t.match(/0,00\s+([\d\.]+,\d\d)\s+([\d\.]+,\d\d)\s+([A-Z][A-Z \.]+?)(-?[\d\.]+,\d\d)\s*$/);
    if(m){ const r = recs.find(x=>x.txt.replace(/\s+/g,' ')===t), med = iconcNum(m[1]), idd = iconcNum(m[2]);
      out.push({ data:r.data, forma:r.forma, profissional:r.aux, convenio:m[3].trim(), bandeira:null, parte_medico:med, parte_idad:idd, valor_bruto:Math.round((med+idd)*100)/100, ref_externa:null, paciente:null });
      falhas[i] = null; } });
  const r2 = v=>Math.round(v*100)/100;
  return { linhas:out, falhas:falhas.filter(Boolean), ini:per&&per[0], fim:per&&per[1],
    totalMed:r2(out.reduce((a,x)=>a+x.parte_medico,0)), totalIdad:r2(out.reduce((a,x)=>a+x.parte_idad,0)),
    totMedRel: totRel ? totRel[1] : null, totIdadRel: totRel ? totRel[2] : null };
}
/* Vendas Stone (Excel/CSV): cabeçalho com STONE ID, DATA DA VENDA, BANDEIRA, N (parcelas), VALOR BRUTO, VALOR LIQUIDO, DOCUMENTO */
function iconcStone(aoa){
  const norm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
  const hi = aoa.findIndex(r=>r.some(c=>/STONE ?ID/.test(norm(c))) && r.some(c=>/VALOR BRUTO/.test(norm(c))));
  if(hi<0) return { erro:'Não achei o cabeçalho da Stone (colunas STONE ID e VALOR BRUTO).' };
  const H = aoa[hi].map(norm), col = re => H.findIndex(h=>re.test(h));
  const c = { doc:col(/^DOCUMENTO/), data:col(/^DATA DA V/), band:col(/^BANDEIRA/), prod:col(/^PRODUTO/), id:col(/^STONE ?ID/), parc:col(/^N(\.|º|O)?$|PARCELA/), bruto:col(/^VALOR BRUTO/), liq:col(/^VALOR LIQ/) };
  const dt = v => { if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d = new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
    const m = String(v).match(/(\d\d)\/(\d\d)\/(\d{4})/); return m ? m[3]+'-'+m[2]+'-'+m[1] : null; };
  const nv = v => typeof v==='number' ? v : iconcNum(String(v).trim());
  const out = []; let docs = {};
  aoa.slice(hi+1).forEach(r=>{ if(!r || r[c.id]==null || r[c.id]==='') return; const d = dt(r[c.data]); if(!d) return;
    if(c.doc>=0) docs[String(r[c.doc]).replace(/\D/g,'')] = 1;
    out.push({ data:d, ref_externa:String(r[c.id]).trim(), bandeira:c.band>=0?String(r[c.band]).trim():null, forma:'cartao', item:c.prod>=0?String(r[c.prod]).trim():null,
      parcelas:c.parc>=0?(parseInt(r[c.parc])||1):1, valor_bruto:Math.round(nv(r[c.bruto])*100)/100, valor_liquido:Math.round(nv(r[c.liq])*100)/100 }); });
  return { linhas:out, docs:Object.keys(docs) };
}

async function fichFotos(inp){
  const arqs = Array.from((inp && inp.files) || []); if(!arqs.length) return;
  const st = t=>{ S.fich.st = t; const e = document.getElementById('fi-st'); if(e) e.innerHTML = t; };
  const paginas = [], med = fichMedSel();
  try{
    st('Preparando as fotos…');
    for(const f of arqs.slice(0,30)){
      const buf = await f.arrayBuffer(); if(!buf.byteLength) throw new Error('a foto veio vazia do seletor — tente pela Galeria');
      if(f.type==='application/pdf' || /\.pdf$/i.test(f.name||'')) (await saldoPdfImagens(buf.slice(0))).forEach(x=>paginas.push(x));
      else paginas.push({ b64: await saldoImgJpeg(new Blob([buf],{type:f.type||'image/jpeg'})), mime:'image/jpeg' });
    }
    let ok = 0, falhas = [];
    for(let i=0; i<paginas.length; i++){
      st('Lendo a ficha '+(i+1)+' de '+paginas.length+'… (uns 10 a 30 segundos cada)');
      try{
        const { data, error } = await sb.functions.invoke('ler-ficha', { body: { imagem: paginas[i] } });
        if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || m; }catch(e){} throw new Error(m); }
        if(data && data.error) throw new Error(data.error);
        const bin = atob(paginas[i].b64), u8 = new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u8[k] = bin.charCodeAt(k);
        const path = 'fichario/'+Date.now()+'-'+i+'.jpg';
        const up = await sb.storage.from('notas').upload(path, new Blob([u8],{type:'image/jpeg'}), { contentType:'image/jpeg', upsert:false });
        if(up.error) throw new Error('a foto não subiu: '+up.error.message);
        const reg = Object.assign({}, data.ficha, { foto_path: path, duvidas: data.duvidas||[] });
        if(!reg.medico_crm){ reg.medico_nome = med.nome; reg.medico_crm = med.crm; }
        const r = await sb.from('fichas').insert(reg).select().maybeSingle();
        if(r.error) throw new Error(r.error.message);
        S.fich.lista.unshift(r.data); ok++; fichLista();
      }catch(e){ falhas.push('foto '+(i+1)+': '+(e.message||e)); }
    }
    st(ok ? '<span style="color:var(--verde,#0f9d58)">✔ '+ok+' ficha'+(ok===1?'':'s')+' lida'+(ok===1?'':'s')+' e guardada'+(ok===1?'':'s')+'. Confira os campos marcados em amarelo.</span>'+(falhas.length?' <span style="color:var(--vermelho)">✖ '+esc(falhas.join(' · '))+'</span>':'')
             : '<span style="color:var(--vermelho)">✖ '+esc(falhas.join(' · '))+'</span>');
  }catch(e){ st('<span style="color:var(--vermelho)">✖ '+esc(e.message||e)+'</span>'); }
  finally{ if(inp) inp.value = ''; }
}

  const vazio = { convenio:null, procedimento:null, especialidade:null, conv_id:null, valor_total:null, valor_medico:null, valor_hospital:null };
  if(!document.getElementById('fe-conv') || !c) return { campos: vazio };
  if(!pk) return { erro:'Escolha o procedimento do convênio (ou deixe "sem convênio").' };
  const p = pk.split('|'), base = Object.assign({}, vazio, { convenio:c, procedimento:p[0], especialidade:p[1]||null });
  if(c==='Particular'){ const v = val('fe-valor')==='' ? null : Math.round(Number(val('fe-valor'))*100)/100;
    if(v!=null && !(v>=0)) return { erro:'Valor particular inválido.' }; base.valor_total = v; return { campos: base }; }
  const a = convAchar(c, p[0], p[1]||null, data);
  if(a){ const x = a.r; base.conv_id = x.id; base.valor_total = x.valor_total; base.valor_medico = x.situacao==='ativo' ? x.valor_medico : null; base.valor_hospital = x.situacao==='ativo' ? x.valor_hospital : null; }
  return { campos: base };
}

async function relAssistenteGerar(tipo){
  const w = relW(), per = relPeriodo();
  if(w.qual==='pag'){ S.relSaldo = { de: per.de, ate: per.ate, quem: w.quem, interno: !!w.interno }; return relSaldoGerar(tipo, true); }
  const mesAnt = S.mes, prodAnt = Object.assign({}, S.prod);
  S.mes = w.mes; S.prod.anes = w.quem; S.prod.hosp = '';
  try{ await relProdGerar(tipo); } finally { S.mes = mesAnt; S.prod = prodAnt; }
}

function relSaldoFiltro(){

  const linhas = c.lista.filter(m=>(!f.de || String(m.data)>=f.de) && (!f.ate || String(m.data)<=f.ate) &&

async function relSaldoGerar(tipo, pronto){
  if(!pronto) S.relSaldo = { de: val('rs-de'), ate: val('rs-ate'), quem: val('rs-quem').trim() };
  const { c, linhas } = relSaldoFiltro(); if(!linhas.length) return aviso('Nada nesse filtro.','erro');
  const saidas = linhas.filter(m=>m.tipo==='saida'), soma = l=>l.reduce((s,m)=>s+Math.abs(+m.valor||0),0);
  const per = (S.relSaldo.de?dataBR(S.relSaldo.de):(c.inicio?dataBR(c.inicio):'início'))+' a '+(S.relSaldo.ate?dataBR(S.relSaldo.ate):dataBR(hojeISO()));
  const nome = 'Saldo terceirizado '+escGrupo()+' - '+per.replace(/\//g,'-')+(S.relSaldo.quem?' - '+S.relSaldo.quem:'');
  const quem = m => m.tipo==='saida' ? (m.recebedor||'') : (m.pagador||m.recebedor||'');
  aviso('Preparando o '+(tipo==='pdf'?'PDF':'Excel')+'…','ok');
  try{
    if(tipo==='xlsx'){
      await fichXlsxLib();
      if(!S.relSaldo.interno){
        const rp = [['Data','Hora','Recebedor','Documento','Descrição','ID da transação','Valor pago']].concat(saidas.map(m=>[relSerie(m.data), m.hora||'', m.recebedor||'', m.recebedor_doc||'', m.descricao||'', m.id_transacao||'', Math.abs(+m.valor||0)]));
        rp.push([]); rp.push(['','','Total pago','','','',soma(saidas)]);
        const wp = XLSX.utils.aoa_to_sheet(rp);
        for(let r=1;r<rp.length;r++){ const a = wp['A'+(r+1)]; if(a && a.t==='n') a.z='dd/mm/yyyy'; const g = wp['G'+(r+1)]; if(g && g.t==='n') g.z='"R$" #,##0.00'; }
        wp['!cols'] = [11,7,30,20,36,36,14].map(w=>({wch:w}));
        const wbp = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wbp, wp, 'Pagamentos');
        return await relEntregar(nome.replace('Saldo terceirizado','Pagamentos'), new Blob([XLSX.write(wbp,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'xlsx', saidas.length+' pagamento(s)');
      }
      const rows = [['Data','Hora','Tipo','Quem (recebedor/pagador)','Documento','Descrição','ID da transação','Valor','Saldo após']]
        .concat(linhas.map(m=>[relSerie(m.data), m.hora||'', SALDO_TIPO[m.tipo]||m.tipo, quem(m), (m.tipo==='saida'?m.recebedor_doc:m.pagador_doc)||'', m.descricao||'', m.id_transacao||'', saldoSinal(m), m._saldo]));
      rows.push([]); if(S.relSaldo.quem) rows.push(['','','','Total pago a '+S.relSaldo.quem+' no período','','','',-soma(saidas)]); else { rows.push(['','','','Valor de partida','','','',c.partida]); rows.push(['','','','Aportes e entradas','','','',c.mais]);
      rows.push(['','','','Saídas no período ('+saidas.length+')','','','',-soma(saidas)]); rows.push(['','','','SALDO ATUAL','','','',c.saldo]); }
      const ws = XLSX.utils.aoa_to_sheet(rows);
      for(let r=1;r<rows.length;r++){ const a = ws['A'+(r+1)]; if(a && a.t==='n') a.z='dd/mm/yyyy'; ['H','I'].forEach(k=>{ const x = ws[k+(r+1)]; if(x && x.t==='n') x.z='"R$" #,##0.00;[Red]-"R$" #,##0.00'; }); }
      ws['!cols'] = [11,7,9,34,22,36,36,14,14].map(w=>({wch:w})); ws['!autofilter'] = { ref:'A1:I'+(linhas.length+1) };
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Saldo');
      await relEntregar(nome, new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'xlsx', linhas.length+' movimento(s)');
    } else {
      await relPdfLib();
      const doc = relPdfNovo((S.relSaldo.interno?'Saldo terceirizado · ':'Pagamentos · ')+escGrupo(), 'Período: '+per+(S.relSaldo.quem?' · Recebedor: '+S.relSaldo.quem:''), true);
      const INT = !!S.relSaldo.interno;
      if(!INT || S.relSaldo.quem) doc.autoTable({ startY: 25, theme:'plain', styles:{ fontSize:11 }, body:[['Total pago'+(S.relSaldo.quem?' a '+S.relSaldo.quem:'')+' no período ('+saidas.length+' pagamento'+(saidas.length===1?'':'s')+')', relBRL(soma(saidas))]], columnStyles:{ 1:{fontStyle:'bold', textColor:[10,108,240]} } });
      else doc.autoTable({ startY: 25, theme:'plain', styles:{ fontSize:10 }, body:[['Valor de partida', relBRL(c.partida), 'Aportes e entradas', relBRL(c.mais), 'Saídas no período ('+saidas.length+')', '- '+relBRL(soma(saidas)), 'SALDO ATUAL', relBRL(c.saldo)]],
        columnStyles:{ 1:{fontStyle:'bold'}, 3:{fontStyle:'bold'}, 5:{fontStyle:'bold', textColor:[200,40,40]}, 7:{fontStyle:'bold', textColor: c.saldo>=0?[13,140,90]:[200,40,40]} } });
      const LP = INT ? linhas : saidas;   // para o terceirizado: só os pagamentos, sem partida e sem saldo
      doc.autoTable({ startY: doc.lastAutoTable.finalY+3, head:[INT?['Data','Hora','Tipo','Quem','Descrição','ID da transação','Valor','Saldo após']:['Data','Hora','Recebedor','Descrição','ID da transação','Valor pago']],
        body: LP.map(m=>INT?[dataBR(m.data), m.hora||'', SALDO_TIPO[m.tipo]||m.tipo, quem(m), String(m.descricao||'').slice(0,60), m.id_transacao||'', (saldoSinal(m)<0?'- ':'+ ')+relBRL(Math.abs(saldoSinal(m))), relBRL(m._saldo)]
                                 :[dataBR(m.data), m.hora||'', quem(m), String(m.descricao||'').slice(0,60), m.id_transacao||'', relBRL(Math.abs(+m.valor||0))]),
        styles:{ fontSize:8.2, cellPadding:1.6 }, headStyles:{ fillColor:[10,108,240] }, alternateRowStyles:{ fillColor:[244,248,252] },
        columnStyles: INT ? { 6:{halign:'right'}, 7:{halign:'right', fontStyle:'bold'}, 5:{fontSize:6.8} } : { 5:{halign:'right', fontStyle:'bold'}, 4:{fontSize:6.8} } });
      relPdfRodape(doc);
      await relEntregar(INT?nome:nome.replace('Saldo terceirizado','Pagamentos'), doc.output('blob'), 'pdf', (INT?linhas.length+' movimento(s)':saidas.length+' pagamento(s)'));
    }
  }catch(e){ aviso('Não gerou: '+(e.message||e),'erro'); }
}

      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws2, 'Por anestesista'); XLSX.utils.book_append_sheet(wb, ws, 'Atendimentos');
      await relEntregar(nome, new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'xlsx', lista.length+' atendimento(s)');

/* ===== v78 (12/11/2026): "🧾 Saldo e comprovantes" dentro do Financeiro (NAFS / ANESTESIA) =====

   lançamentos à mão (ajustes). Tabela fin_saldo_mov, separada por grupo. Só mestre e dono.
   Regra do saldo: vale a partir do ÚLTIMO "valor de partida" (Recomeçar saldo abre um ciclo novo).
   partida/aporte/entrada somam, saída desconta, ajuste soma ou desconta pelo sinal. */
function podeEditarSaldo(){ return podeEditar() || ehAdm1(); }   // v85: ADM_Nivel 1 com o Saldo marcado também lança

const SALDO_TIPOS = { partida:'Valor de partida', aporte:'Aporte', entrada:'Entrada', saida:'Saída', ajuste:'Ajuste manual' };
async function saldoCarregar(){
  const g = escGrupo();
  const r = await sb.from('fin_saldo_mov').select('*').eq('grupo', g).order('data').order('created_at');
  S.saldo.grupo = g; S.saldo.carregado = true;
  if(r.error){ S.saldo.movs = []; S.saldo.erro = r.error.message; return; }
  S.saldo.movs = r.data || []; S.saldo.erro = '';

function saldoPronto(){ return S.saldo.carregado && S.saldo.grupo===escGrupo(); }
function saldoSinal(m){ const v = Number(m.valor)||0; if(m.tipo==='saida') return -Math.abs(v); if(m.tipo==='ajuste') return v; return Math.abs(v); }
function saldoOrd(a,b){ return String(a.data).localeCompare(String(b.data)) || String(a.hora||'').localeCompare(String(b.hora||'')) || String(a.created_at||'').localeCompare(String(b.created_at||'')); }
/* ciclo atual = do último "partida" em diante */
function saldoCiclo(){
  const t = S.saldo.movs.slice().sort(saldoOrd);
  let i0 = -1; t.forEach((m,i)=>{ if(m.tipo==='partida') i0 = i; });
  const atual = i0>=0 ? t.slice(i0) : t, ant = i0>0 ? t.slice(0,i0) : [];
  let s = 0; const comSaldo = atual.map(m=>{ s += saldoSinal(m); return Object.assign({ _saldo:s }, m); });
  const part = atual.filter(m=>m.tipo==='partida').reduce((a,m)=>a+Math.abs(+m.valor||0),0);

  return { lista:comSaldo, ant, partida:part, mais, menos, saldo:s, inicio: atual[0] ? atual[0].data : null, nSaidas: atual.filter(m=>m.tipo==='saida').length };

/* imagem → JPEG de até 1800px (manda menos dados e lê igual) */
function saldoImgJpeg(blob){
  return new Promise((ok, nok)=>{
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = ()=>{ const k = Math.min(1, 1800/Math.max(im.width, im.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(im.width*k); cv.height = Math.round(im.height*k); const cx = cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(im,0,0,cv.width,cv.height);
      URL.revokeObjectURL(u); ok(cv.toDataURL('image/jpeg',0.85).split(',')[1]); };
    im.onerror = ()=>{ URL.revokeObjectURL(u); nok(new Error('não consegui abrir a imagem')); };
    im.src = u;
  });
}
async function saldoPdfImagens(buf){
  if(!window.pdfjsLib) throw new Error('o leitor de PDF não carregou — mande como foto ou print');
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise, out = [];
  for(let p=1; p<=Math.min(pdf.numPages, 6); p++){
    const pg = await pdf.getPage(p), vp0 = pg.getViewport({ scale:1 }), vp = pg.getViewport({ scale: Math.min(2.5, 1800/Math.max(vp0.width, vp0.height)) });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    out.push({ b64: cv.toDataURL('image/jpeg',0.85).split(',')[1], mime:'image/jpeg' });
  }
  return out;
}
async function saldoLer(){
  const inp = document.getElementById('sd-arq'), st = document.getElementById('sd-st'), bt = document.getElementById('sd-ler');
  const f = inp && inp.files && inp.files[0]; if(!f){ st.textContent = 'Escolha o arquivo.'; return; }
  try{
    if(bt) bt.disabled = true;
    st.textContent = 'Preparando o arquivo…';
    const buf = await f.arrayBuffer();
    if(!buf.byteLength) throw new Error('o arquivo veio vazio do seletor — tente escolher pela Galeria');
    _saldoArq = new File([buf], f.name || 'comprovante', { type: f.type || 'application/octet-stream' });
    const ehPdf = (f.type==='application/pdf') || /\.pdf$/i.test(f.name||'');
    const imagens = ehPdf ? await saldoPdfImagens(buf.slice(0)) : [{ b64: await saldoImgJpeg(new Blob([buf],{type:f.type||'image/jpeg'})), mime:'image/jpeg' }];
    st.textContent = 'Lendo… (uns 10 a 30 segundos)';
    const { data, error } = await sb.functions.invoke('ler-comprovante', { body: { imagens } });
    if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || j.erro || m; }catch(e){} throw new Error(m); }
    if(data && data.error) throw new Error(data.error);
    const movs = (data && data.movimentos) || [];
    if(!movs.length) throw new Error('não encontrei nenhum valor no arquivo');
    const ids = new Set(S.saldo.movs.map(x=>x.id_transacao).filter(Boolean));
    S.saldo.leitura = { documento: data.documento, banco: data.banco || '', movs: movs.map((x,i)=>{
      const dup = (x.id_transacao && ids.has(x.id_transacao)) || S.saldo.movs.some(y=>String(y.data).slice(0,10)===x.data && Math.abs(Math.abs(+y.valor)-x.valor)<0.005 && (y.tipo===x.tipo || (y.tipo==='partida'&&x.tipo==='entrada')));
      const tipo = _saldoModo==='partida' && i===0 ? 'partida' : x.tipo;
      return Object.assign({}, x, { tipo, ok: !dup, dup }); }) };
    saldoMostrarLeitura();
  }catch(e){ st.innerHTML = '<span style="color:var(--vermelho)">✖ '+esc(e.message||e)+'</span>'; if(bt) bt.disabled = false; }
}
function saldoMostrarLeitura(){
  const L = S.saldo.leitura, um = L.movs.length===1, c = saldoCiclo();
  const linha = (x,i)=>{
    const tsel = '<select onchange="S.saldo.leitura.movs['+i+'].tipo=this.value;saldoMostrarLeitura()">'+['saida','entrada','partida','aporte'].map(k=>'<option value="'+k+'"'+(x.tipo===k?' selected':'')+'>'+SALDO_TIPOS[k]+(k==='saida'?' — desconta':' — soma')+'</option>').join('')+'</select>';

/* ===== v64 (21/10/2026): caixa "🏥 Hospitais" — CADASTRO DE HOSPITAIS =====
   Pedido do Renato: cada hospital tem uma forma diferente de pagamento e de serviços.
   Tabela esc_hospitais (liga com esc_locais pelo NOME do hospital): forma de pagamento — por plantão/dia,
   por turno (Manhã/Tarde/Noite), por procedimento (lista de serviços com preço) ou valor fixo mensal —,
   prazo de pagamento, CNPJ/razão social, contato, serviços e observações.
   O valor de cada atendimento passa a sair do hospital: vale primeiro o valor do anestesista (se tiver),

const HOSP_FORMAS = { dia:'Por plantão / dia', turno:'Por turno', procedimento:'Por procedimento', mensal:'Valor fixo mensal' };
async function hospCarregar(){
  const r = await sb.from('esc_hospitais').select('*').order('nome');
  if(r.error){ S.esc.hospCad = []; S.esc.hospErro = r.error.message; return; }
  S.esc.hospCad = (r.data || []).filter(h=>veHosp(h.nome)); S.esc.hospErro = '';
}
function hospCad(nome){ const n = String(nome||'').trim().toLowerCase(); return (S.esc.hospCad||[]).find(h=>String(h.nome).trim().toLowerCase()===n) || null; }
function hospDoLocal(localId){ return hospCad(escHospNome(escLocal(localId))); }
function hospServicos(h){ return Array.isArray(h && h.servicos) ? h.servicos.filter(s=>s && s.nome) : []; }

function hospValor(h, d){
  if(!h) return null;
  const n = x => x==null || x==='' ? null : Number(x);
  if(h.forma_pagamento==='turno'){
    const t = escTurnoNorm(d && d.turno); if(!t) return n(h.valor_dia);
    let s = 0, ok = false; [['M','valor_m'],['T','valor_t'],['N','valor_n']].forEach(p=>{ if(t.indexOf(p[0])>=0 && n(h[p[1]])!=null){ s += n(h[p[1]]); ok = true; } });
    return ok ? s : n(h.valor_dia);
  }
  if(h.forma_pagamento==='procedimento'){
    const sv = hospServicos(h).find(s=>d && d.servico && s.nome===d.servico);
    return sv && n(sv.valor)!=null ? n(sv.valor) : null;
  }
  if(h.forma_pagamento==='mensal') return null;   // o contrato é do mês inteiro, não de cada atendimento
  return n(h.valor_dia);
}
function hospPrazoTxt(h){

function hospPrazoData(h, mes){

  if(h.prazo_dias){ const d = new Date(y, m, 0); d.setDate(d.getDate() + (+h.prazo_dias)); return d.toISOString().slice(0,10); }
  return null;

function hospRegraTxt(h){

  if(f==='mensal') return h.valor_mensal!=null ? brl(+h.valor_mensal)+' por mês' : '<span style="color:var(--vermelho)">valor do mês não informado</span>';
  return h.valor_dia!=null ? brl(+h.valor_dia)+' por plantão' : '<span style="color:var(--vermelho)">valor do plantão não informado</span>';
}

function tissUsarKit(id){ const f = S.tiss.form, kit = S.tiss.kits.find(k=>k.id===id); if(!kit) return;
  const novos = []; kit.itens.forEach(x=>{ const it = tissItCod(x.tabela, x.codigo); if(it && !f.desps.some(d=>d.itemId===it.id)) novos.push({ itemId:it.id, qtd:Number(x.quantidade)||1, valor:tissPreco(f.opId,it.id,f.data), red:1, auto:true }); });

function tissTotais(){ const f = S.tiss.form, s = { proc:0, taxas:0, mat:0, med:0, opme:0, gases:0, diarias:0 };
  f.procs.forEach(x=>s.proc += tissN((+x.valor||0)*(+x.qtd||0)*(+x.red||1)));
  f.desps.forEach(x=>{ const it = tissIt(x.itemId), v = tissN((+x.valor||0)*(+x.qtd||0)); const c = it && it.codigo_despesa;
    if(c==='02') s.med+=v; else if(c==='07') s.taxas+=v; else if(c==='08') s.opme+=v; else if(c==='01') s.gases+=v; else if(c==='05') s.diarias+=v; else s.mat+=v; });
  Object.keys(s).forEach(k=>s[k]=tissN(s[k])); s.total = tissN(s.proc+s.taxas+s.mat+s.med+s.opme+s.gases+s.diarias); return s; }

  const equipe = [{ cpf: prof.cpf||undefined, codigoOperadora: prof.cpf?undefined:undefined, nome: prof.nome, conselho: prof.conselho||'06', numero: prof.numero, uf: prof.uf||'29', cbo: prof.cbo }];
  const procs = f.procs.map(x=>{ const it = tissIt(x.itemId), vu = tissN(+x.valor||0), red = Number(x.red||1);
    return { data: f.data, horaInicial: hora, horaFinal: hora, tabela: it.tabela, codigo: it.codigo, descricao: it.descricao, quantidade: x.qtd||1, reducao: red,

  const sol = S.tiss.profs.find(p=>p.id===f.solProfId) || (f.solNome ? null : prof);

    return { codigoDespesa: it.codigo_despesa||'03', data: f.data, horaInicial: hora, horaFinal: hora, tabela: it.tabela, codigo: it.codigo, quantidade: x.qtd||1, unidade: it.unidade||'036',

/* v174 (Renato, 27/11/2026) — REGRA OBRIGATÓRIA: todo código na operadora tem o nome do contratado (campo 10) ligado a ele.
   O nome fica no próprio código (tiss_op_prestador.nome_contratado); sem ele, vale o nome do prestador ligado ao código. */
function tissCtNome(ct){ ct = ct || {}; return String(ct.nome_contratado || (ct.tiss_prestadores||{}).nome || '').toUpperCase(); }
async function tissCtPedirNome(ctId, redesenha){
  const ct = tissCt(ctId); if(!ct.id) return false;
  const t = prompt('O código '+(ct.codigo_operadora||ct.cnpj||'')+' ('+(ct.rotulo||'')+') está sem o NOME DO CONTRATADO (campo 10 da guia).\nDigite o nome exatamente como sai na guia da operadora:', '');
  if(t==null || !t.trim()) return false;
  const nome = t.trim().toUpperCase(), r = await sb.from('tiss_op_prestador').update({ nome_contratado:nome }).eq('id', ct.id).select('id');
  if(r.error || !(r.data||[]).length){ alert('Não gravou o nome: '+(r.error ? r.error.message : 'sem permissão para alterar o convênio.')); return false; }
  ct.nome_contratado = nome; if(redesenha && typeof tissGuiaModal==='function') tissGuiaModal(); return true;
}
function tissValidar(f){
  if(!f.opId || !f.ctId) return 'Escolha o convênio.';
  if(!String(f.paciente||'').trim()) return 'Informe o paciente.';
  if(!soDig(f.carteira)) return 'Informe o número da carteirinha.';
  if(!f.data) return 'Informe a data.';
  if(!f.profId) return 'Escolha o médico executante.';
  if(!f.procs.length || f.procs.some(x=>!x.itemId)) return 'Informe o procedimento.';
  if([...f.procs, ...f.desps].some(x=>!x.itemId || x.valor==null || !(x.qtd>0))) return 'Há item sem código, quantidade ou valor.';
  if(f.tipo==='sadt' && !f.solProfId && !String(f.solNome||'').trim()) return 'Informe o médico solicitante.';
  return null;
}

      guias: [ f.tipo==='consulta' ? TISS.guiaConsulta(modelo) : f.tipo==='sadt' ? TISS.guiaSADT(modelo) : TISS.guiaHonorarios(modelo) ] }); // testa a montagem antes de gravar
    const reg = { tipo: f.tipo, operadora_id: f.opId, contrato_id: f.ctId, prestador_id: tissCt(f.ctId).prestador_id || null, paciente_id: f.pacienteId || null, paciente_nome: String(f.paciente).trim(),
      carteira: f.carteira, numero_guia_prestador: num, data_atendimento: f.data, profissional_id: f.profId, valor_total: tissTotais().total,

async function tissGerarLote(ctId, tipo){
  const ct = tissCt(ctId), op = tissOp(ct.operadora_id), pr = ct.tiss_prestadores || {};

function rxExtenso(v){
  const u = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999 = n => { if(n===0) return ''; if(n===100) return 'cem'; const p = []; if(n>=100){ p.push(c[Math.floor(n/100)]); n%=100; } if(n>=20){ p.push(d[Math.floor(n/10)]); n%=10; } if(n>0) p.push(u[n]); return p.join(' e '); };
  const tot = Math.round(v*100), int = Math.floor(tot/100), cent = tot%100;
  const gs = [[Math.floor(int/1e6), n=> n===1?'um milhão':ate999(n)+' milhões'], [Math.floor((int%1e6)/1000), n=> n===1?'mil':ate999(n)+' mil'], [int%1000, ate999]].filter(g=>g[0]>0);
  let t = gs.length ? '' : 'zero';
  gs.forEach((g,i)=>{ if(i>0) t += (g[0]<100 || g[0]%100===0) ? ' e ' : ' '; t += g[1](g[0]); });
  if(int>0 && int%1e6===0) t += ' de'; t += int===1 ? ' real' : ' reais';
  if(cent) t += ' e '+ate999(cent)+(cent===1?' centavo':' centavos');
  return t; }

    h += '<div class="card" style="overflow-x:auto;padding:6px 10px"><table><thead><tr><th>Arquivo</th><th>Convênio</th><th>TISS</th><th>Guias</th><th>Hash do Smart</th><th>Hash do MR</th><th>Resultado</th></tr></thead><tbody>'+
      c.map(x=>'<tr><td style="font-size:12px">'+esc(x.arquivo)+'</td><td>'+esc(x.erro?'—':(S.tiss.ops.find(o=>o.ans===x.ans)||{}).nome||x.ans)+'</td><td>'+esc(x.padrao||'')+'</td><td>'+(x.guias||0)+'</td>'+

        '<td>'+(x.erro?'<span style="color:#d97706">'+esc(x.erro)+'</span>':x.identico?'<b style="color:#0e9f6e">✓ Idêntico</b>':x.hashOk?'<b style="color:#0e9f6e">✓ Hash igual</b>':'<b style="color:#dc2626">Diferente</b>')+'</td></tr>').join('')+'</tbody></table></div>';

async function tissConferir(files){
  const res = [];
  for(const f of Array.from(files||[])){
    try{ const buf = new Uint8Array(await f.arrayBuffer()); let t = ''; for(let i=0;i<buf.length;i++) t += String.fromCharCode(buf[i]);
      const p = (t.match(/<ans:Padrao>([^<]*)</)||[])[1]||'';
      if(p && p < '3') { res.push({ arquivo:f.name, padrao:p, erro:'Versão antiga do TISS (2.x), fora de uso' }); continue; }
      res.push(Object.assign({ arquivo:f.name }, TISSLer.conferir(t, DOMParser)));
    }catch(e){ res.push({ arquivo:f.name, erro: e.message||String(e) }); }
  }
  S.tiss.conf = res; render();
}

/* v142: leitura genérica de documento/carteirinha por foto (mesma IA da ficha do paciente) */
async function agLerCampos(inp){
  const arqs = Array.from((inp && inp.files)||[]); if(!arqs.length) return null;
  const imagens = [];
  for(const f of arqs.slice(0,4)){ const buf = await f.arrayBuffer(); if(!buf.byteLength) throw new Error('a foto veio vazia — tente pela Galeria');
    if(f.type==='application/pdf' || /\.pdf$/i.test(f.name||'')) (await saldoPdfImagens(buf.slice(0))).slice(0,2).forEach(x=>imagens.push(x));
    else imagens.push({ b64: await saldoImgJpeg(new Blob([buf],{type:f.type||'image/jpeg'})), mime:'image/jpeg' }); }
  const { data, error } = await sb.functions.invoke('ler-documento-paciente', { body: { imagens } });
  if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || j.erro || m; }catch(e){} throw new Error(m); }
  if(data && data.error) throw new Error(data.error);
  return (data && data.campos) || {};
}

/* dia útil: pula sábado e domingo */
function rcDiaUtil(d, n){ let x = d; if(n>0){ let k = n; while(k>0){ x = agSomaDias(x,1); const w = new Date(x+'T12:00:00').getDay(); if(w!==0 && w!==6) k--; } }
  let w = new Date(x+'T12:00:00').getDay(); while(w===0||w===6){ x = agSomaDias(x,1); w = new Date(x+'T12:00:00').getDay(); } return x; }
/* plano do dinheiro: uma linha por pagamento (ou por parcela no crédito), com taxa, valor líquido e data prevista */
function rcPlano(forma, valor, parcelas, hoje){
  const c = rcCfg(), v = rc2(valor), um = (o) => [Object.assign({ parcela:1, parcelas:1, bruto:v, taxa_pct:0, liquido:v, previsto:hoje, etapa:'caminho' }, o)];
  if(forma==='Dinheiro') return um({ previsto:null, etapa:'caixa' });
  if(forma==='Pix') return um({});
  if(forma==='Cartão de débito'){ const t = +c.taxa_debito||0; return um({ taxa_pct:t, liquido: rc2(v*(1-t/100)), previsto: rcDiaUtil(hoje, +c.prazo_debito||1) }); }
  const n = Math.max(1, Math.min(12, +parcelas||1)), t = +((c.taxas_credito||[])[n-1]||0), liqT = rc2(v*(1-t/100));
  const b = Math.floor(v/n*100)/100, l = Math.floor(liqT/n*100)/100, out = [];
  for(let i=1; i<=n; i++) out.push({ parcela:i, parcelas:n, bruto: i<n ? b : rc2(v-b*(n-1)), taxa_pct:t, liquido: i<n ? l : rc2(liqT-l*(n-1)),
    previsto: c.antecipa ? rcDiaUtil(hoje,1) : rcDiaUtil(agSomaDias(hoje, 30*i), 0), etapa:'caminho' });
  return out;
}

function rcSugestoes(){

  const out = {}, tomados = new Set();
  S.rc.lista.filter(x=>x.etapa==='caminho' && x.previsto).sort((a,b)=>String(a.previsto).localeCompare(String(b.previsto))).forEach(x=>{

function rcSituacao(g, sug){

  if(g.rows.some(x=>x.etapa==='caixa')) return ['rc-wa','● no caixa · depositar'];
  if(g.rows.some(x=>sug[x.id])) return ['rc-az','🔎 achei no extrato · confirmar'];
  const pend = g.rows.filter(x=>x.etapa!=='conta').sort((a,b)=>String(a.previsto).localeCompare(String(b.previsto))), p = pend[0];
  if(p.previsto && p.previsto < hoje) return ['rc-er','⚠ previsto '+dataBR(p.previsto)+' · não achei no extrato'];
