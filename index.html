    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+(fch?'':'<button class="bt" onclick="rcFechar()">Fechar caixa do dia</button>')+
    '<button class="bt g" onclick="rcDepositoModal()"'+(emCx>0?'':' disabled')+'>Registrar depósito no banco'+(emCx>0?' ('+brl(emCx)+' no caixa)':'')+'</button></div></div>';
  /* conferir com o banco */
  const nSug = Object.keys(sug).length, atras = L.filter(x=>x.etapa==='caminho' && x.previsto && x.previsto<hoje && !sug[x.id]);
  h += '<div class="card"><b style="display:block;margin-bottom:8px">Conferir com o banco</b><div style="display:flex;gap:8px;flex-wrap:wrap">'+
    (podeEditar()?'<button class="bt" onclick="abrirExtrato()">Importar extrato (OFX / Excel)</button>':'')+
    (podeEditar()?'<button class="bt g" onclick="irPara(\'idadconc\')">Importar relatório da maquininha</button>':'')+'</div>'+
    (nSug ? '<div class="rc-prev" style="margin-top:8px">🔎 <b>Achei '+nSug+' valor'+(nSug>1?'es':'')+' no extrato.</b><br>'+Object.keys(sug).map(id=>{ const x = L.find(r=>r.id===id), m = sug[id];
       return esc(x.paciente_nome)+' · '+esc(x.forma)+(x.parcelas>1?' '+x.parcela+'/'+x.parcelas:'')+' · '+brl(+x.liquido)+' → extrato '+dataBR(m.data_pagamento||m.data_movimento)+' <button class="bt mini" onclick="rcConfirmar(\''+id+'\',\''+m.id+'\')">✔ Confirmar</button>'; }).join('<br>')+'</div>' : '')+
    (atras.length ? '<div class="rc-alerta">⚠ <b>'+atras.length+' valor'+(atras.length>1?'es não chegaram':' não chegou')+':</b><br>'+atras.map(x=>esc(x.forma)+' de '+brl(+x.liquido)+' ('+esc(x.paciente_nome)+') previsto para '+dataBR(x.previsto)).join('<br>')+'<br>Importe o extrato mais recente ou verifique com a '+esc(rcCfg().maquininha||'maquininha')+'.</div>' : '')+
    (!nSug && !atras.length ? '<div style="font-size:12.5px;color:var(--fraco);margin-top:8px">Depois de importar o extrato do banco, o sistema procura cada valor previsto e mostra aqui para confirmar.</div>' : '')+'</div>';
  return h;
}

async function rcFechar(){
  const e = idadEmpresa(), dc = S.rc.dataCx, el = document.getElementById('rc-cont');
  const doDia = S.rc.lista.filter(x=>String(x.recebido_em).slice(0,10)===dc), sm = a => rc2(a.reduce((s,x)=>s+(+x.bruto),0));
  const sis = sm(doDia.filter(x=>x.forma==='Dinheiro')), cont = el && el.value!=='' ? rc2(el.value) : null;
  if(cont===null) return aviso('Informe quanto foi contado na gaveta (pode ser 0).','erro');
  const sem = S.rc.agPend.filter(a=>a.data===dc && agFaltaPagar(a));
  if(sem.length) return aviso('⚠ Não dá para fechar o caixa: '+sem.length+' particular'+(sem.length>1?'es':'')+' de '+dataBR(dc)+' sem pagamento ('+sem.map(a=>a.paciente_nome).join(', ')+'). Receba ou cancele antes.','erro');
  let obs = null;
  if(Math.abs(cont-sis)>=0.01){ obs = prompt('O dinheiro contado ('+brl(cont)+') não bate com o sistema ('+brl(sis)+'). Escreva o motivo da diferença:'); if(obs===null) return; }
  const f = await sb.from('idad_caixa_fech').insert({ empresa_id:e.id, data:dc, dinheiro_sis:sis, dinheiro_contado:cont, pix: sm(doDia.filter(x=>x.forma==='Pix')), maquininha: sm(doDia.filter(x=>/^Cart/.test(x.forma))), obs, fechado_por: rcQuem() }).select().maybeSingle();
  if(f.error) return aviso('Não fechou: '+f.error.message,'erro');
  const ids = doDia.filter(x=>!x.fechamento_id).map(x=>x.id);
  if(ids.length){ const u = await sb.from('idad_receb').update({ fechamento_id: f.data.id }).in('id', ids); if(!u.error) S.rc.lista.forEach(x=>{ if(ids.includes(x.id)) x.fechamento_id = f.data.id; }); }
  S.rc.fech.unshift(f.data); render(); aviso('✔ Caixa de '+dataBR(dc)+' fechado.','ok');
}
function rcDepositoModal(){
  const cx = S.rc.lista.filter(x=>x.etapa==='caixa'), tot = rc2(cx.reduce((s,x)=>s+(+x.bruto),0));
  abrirModal('<h2>Depósito do caixa no banco</h2><div style="font-size:14px;margin-bottom:10px">No caixa da recepção: <b>'+brl(tot)+'</b> ('+cx.length+' pagamento'+(cx.length===1?'':'s')+' em dinheiro)</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><label style="flex:1;min-width:140px">Valor depositado (R$)<input id="rc-dv" type="number" step="0.01" value="'+tot+'"></label>'+
    '<label style="flex:1;min-width:140px">Data do depósito<input id="rc-dd" type="date" value="'+hojeISO()+'"></label></div>'+
    '<div style="font-size:12.5px;color:var(--fraco);margin:6px 0 10px">Os pagamentos passam para "a caminho" e são conferidos quando o depósito aparecer no extrato.</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="bt g" onclick="fecharModal()">Fechar</button><button class="bt" onclick="rcDepositar()">Registrar depósito</button></div>');
}
async function rcDepositar(){
  const cx = S.rc.lista.filter(x=>x.etapa==='caixa'), tot = rc2(cx.reduce((s,x)=>s+(+x.bruto),0));
  const v = rc2(document.getElementById('rc-dv').value), d = document.getElementById('rc-dd').value || hojeISO();
  if(!(v>0)) return aviso('Informe o valor depositado.','erro');
  const quem = rcQuem(), em = new Date(d+'T12:00:00').toISOString();
  /* depósito de valor diferente: marca os pagamentos que cabem no valor, do mais antigo para o mais novo */
  let resto = v; const ids = [];
  cx.slice().sort((a,b)=>String(a.recebido_em).localeCompare(String(b.recebido_em))).forEach(x=>{ if(+x.bruto <= resto+0.005){ ids.push(x.id); resto = rc2(resto-(+x.bruto)); } });
  if(!ids.length) return aviso('O valor não cobre nenhum pagamento do caixa.','erro');
  const u = await sb.from('idad_receb').update({ etapa:'caminho', depositado_em: em, depositado_por: quem, previsto: d }).in('id', ids);
  if(u.error) return aviso('Não registrou: '+u.error.message,'erro');
  S.rc.lista.forEach(x=>{ if(ids.includes(x.id)) Object.assign(x, { etapa:'caminho', depositado_em: em, depositado_por: quem, previsto: d }); });
  S.modal = null; render();
  aviso('✔ Depósito de '+brl(v)+' registrado.'+(Math.abs(v-tot)>=0.01 ? ' Ficaram '+brl(rc2(tot-v+resto))+' no caixa.' : ''), Math.abs(v-tot)>=0.01 ? 'erro' : 'ok');
}
async function rcConfirmar(id, movId){
  const x = S.rc.lista.find(r=>r.id===id); if(!x) return;
  const m = movId ? (S.movimentos||[]).find(z=>z.id===movId) : null, dt = m ? (m.data_pagamento||m.data_movimento) : hojeISO();
  try{
    if(m){ const u = await sb.from('movimentos').update({ categoria:'Transferência · conciliado com atendimento particular', observacao: ((m.observacao||'')+' [MR: é o recebimento de '+x.paciente_nome+' · '+x.forma+(x.parcelas>1?' '+x.parcela+'/'+x.parcelas:'')+', já lançado pela recepção]').trim() }).eq('id', m.id).select().maybeSingle();
      if(u.error) throw u.error; Object.assign(m, u.data||{}); }
    if(x.movimento_id){ const u = await sb.from('movimentos').update({ pago:true, data_pagamento: dt }).eq('id', x.movimento_id); if(u.error) throw u.error;
      const mm = (S.movimentos||[]).find(z=>z.id===x.movimento_id); if(mm) Object.assign(mm, { pago:true, data_pagamento: dt }); }
    const patch = { etapa:'conta', conciliado_em: new Date(dt+'T12:00:00').toISOString(), conciliado_por: rcQuem(), conciliado_ref: m ? m.id : 'manual' };
    const r = await sb.from('idad_receb').update(patch).eq('id', id); if(r.error) throw r.error;
    Object.assign(x, patch); render(); if(S.modal && _rcDet) rcDetalhe(_rcDet);
    aviso('✔ '+brl(+x.liquido)+' conferido na conta.','ok');
  }catch(e){ aviso('Não conferiu: '+(e.message||e),'erro'); }
}
function rcChegou(id){
  const x = S.rc.lista.find(r=>r.id===id); if(!x) return;
  if(!confirm('Confirmar que '+brl(+x.liquido)+' ('+x.forma+(x.parcelas>1?' parcela '+x.parcela+'/'+x.parcelas:'')+') já está na conta do IDAD?')) return;
  rcConfirmar(id, null);
}

let _rcDet = null;
async function rcAbrirAgenda(agId){
  if(!S.rc.carregado) await rcCarregar();
  const tem = S.rc.lista.some(x=>x.agenda_id===agId);
  if(!tem){ const e = idadEmpresa(), q = e ? await sb.from('idad_receb').select('*').eq('agenda_id', agId) : { data:[] };
    if(!(q.data||[]).length) return aviso('Este pagamento foi registrado antes da v144 e não tem rastreio.','erro');
    S.rc.lista = S.rc.lista.concat(q.data); }
  rcDetalhe(agId);
}
async function rcDetalhe(key){
  _rcDet = key;
  const g = rcGrupos(S.rc.lista.filter(x=>(x.agenda_id||x.id)===key))[0]; if(!g) return;
  let a = g.agenda_id ? (S.ag.lista||[]).find(x=>x.id===g.agenda_id) : null;
  if(!a && g.agenda_id){ const q = await sb.from('agenda').select('*').eq('id', g.agenda_id).maybeSingle(); a = q.data || null; }
  const sug = rcSugestoes(), n = g.rows.length, k = g.rows.filter(x=>x.etapa==='conta'), din = g.forma==='Dinheiro', r0 = g.rows[0];
  const quando = t => t ? new Date(t).toLocaleString('pt-BR').slice(0,17) : '';
  const fch = S.rc.fech.find(f=>f.id===r0.fechamento_id), ev = [], pend = g.rows.filter(x=>x.etapa!=='conta').sort((a,b)=>String(a.previsto).localeCompare(String(b.previsto)));
  if(a) ev.push(['f', 'Agendado · '+(AG_PAG[a.pagamento]||'particular'), quando(a.criado_em)]);
  ev.push(['f', 'Atendido e pago · '+g.forma+(n>1?' '+n+'x':'')+' · '+brl(g.bruto), quando(r0.recebido_em)+(r0.recebido_por?' · '+r0.recebido_por:'')]);
  if(g.rows.some(x=>x.movimento_id)) ev.push(['f', 'Lançado no Financeiro do IDAD', din ? 'no Caixa recepção IDAD' : n>1 ? n+' parcelas a receber da '+(rcCfg().maquininha||'maquininha') : 'a receber']);
  ev.push(fch ? ['f', 'Caixa do dia fechado e conferido', quando(fch.fechado_em)+' · '+(fch.fechado_por||'')] : ['', 'Caixa do dia fechado e conferido', 'falta fechar o caixa de '+dataBR(String(r0.recebido_em).slice(0,10))]);
  if(din) ev.push(r0.depositado_em ? ['f', 'Depositado no banco', dataBR(String(r0.depositado_em).slice(0,10))+' · '+(r0.depositado_por||'')] : ['p', 'Aguardando o depósito no banco', 'o dinheiro está no caixa da recepção']);
  else ev.push(!pend.length ? ['f', g.forma==='Pix' ? 'Pix recebido' : 'Repassado pela '+(rcCfg().maquininha||'maquininha'), ''] : ['p', g.forma==='Pix' ? 'Aguardando conferir o Pix' : 'Aguardando a '+(rcCfg().maquininha||'maquininha')+' repassar', (n>1?(k.length+1)+'ª parcela':'')+' prevista para '+dataBR(pend[0].previsto)]);
  ev.push(!pend.length ? ['f', 'Conferido no extrato do banco', quando(k.map(x=>x.conciliado_em).sort().pop())+' · '+(k[k.length-1].conciliado_por||'')] : ['', 'Conferido no extrato do banco', k.length ? k.length+' de '+n+' já conferidas' : 'marca quando o valor aparecer no extrato']);
  const sit = x => x.etapa==='conta' ? '<span class="rc-ok">✔ na conta '+dataBR(String(x.conciliado_em).slice(0,10))+'</span>' : x.etapa==='caixa' ? '<span class="rc-wa">no caixa</span>' :
    sug[x.id] ? '<button class="bt mini" onclick="rcConfirmar(\''+x.id+'\',\''+sug[x.id].id+'\')">🔎 Confirmar extrato</button>' :
    '<span class="'+(x.previsto<hojeISO()?'rc-er':'rc-wa')+'">'+(x.previsto<hojeISO()?'⚠ atrasado':'a caminho')+'</span> <button class="bt g mini" onclick="rcChegou(\''+x.id+'\')">Chegou</button>';
  abrirModal('<h2>Rastreio do pagamento</h2><div style="font-size:14px;margin-bottom:10px"><b>'+esc(g.nome||'')+'</b>'+(a?' · '+AG_TIPO[a.tipo]+' · '+esc(agNome(a.profissional_id)):'')+'</div>'+
    '<div class="rc-kp" style="margin-bottom:12px"><div class="rc-k"><small>Valor cobrado</small><b>'+brl(g.bruto)+'</b></div>'+
    '<div class="rc-k"><small>Taxa da maquininha'+(+r0.taxa_pct?' ('+String(+r0.taxa_pct).replace('.',',')+'%)':'')+'</small><b>'+(g.bruto-g.liquido>0.004?'– '+brl(rc2(g.bruto-g.liquido)):'R$ 0,00')+'</b></div>'+
    '<div class="rc-k"><small>Vai cair na conta</small><b>'+brl(g.liquido)+'</b></div>'+
    '<div class="rc-k"><small>Já chegou</small><b>'+brl(rc2(k.reduce((s,x)=>s+(+x.liquido),0)))+' <span class="'+(k.length===n?'rc-ok':'rc-wa')+'" style="font-size:12px">'+k.length+' de '+n+'</span></b></div></div>'+
    '<b>Caminho do dinheiro</b><div class="rc-tl">'+ev.map(e=>'<div class="rc-ev '+e[0]+'"><b>'+esc(e[1])+'</b><small>'+esc(e[2])+'</small></div>').join('')+'</div>'+
    '<div style="overflow-x:auto"><table style="width:100%;font-size:13px;margin-top:6px"><tr><th style="text-align:left">'+(n>1?'Parcela':'Pagamento')+'</th><th style="text-align:left">Previsto</th><th style="text-align:right">Líquido</th><th style="text-align:left">Situação</th></tr>'+
    g.rows.map(x=>'<tr><td>'+(n>1?x.parcela+'/'+n:esc(x.forma))+'</td><td>'+(x.previsto?dataBR(x.previsto):'—')+'</td><td style="text-align:right">'+brl(+x.liquido)+'</td><td>'+sit(x)+'</td></tr>').join('')+'</table></div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="bt g" onclick="fecharModal()">Fechar</button></div>');
}

function rcCfgModal(){
  const c = rcCfg();
  abrirModal('<h2>Taxas e prazos da maquininha</h2>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><label style="flex:1;min-width:140px">Maquininha<input id="rc-mq" value="'+esc(c.maquininha||'')+'"></label>'+
    '<label style="flex:1;min-width:120px">Taxa débito (%)<input id="rc-td" type="number" step="0.01" value="'+c.taxa_debito+'"></label>'+
    '<label style="flex:1;min-width:120px">Débito cai em (dias úteis)<input id="rc-pd" type="number" value="'+c.prazo_debito+'"></label></div>'+
    '<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="rc-an" type="checkbox"'+(c.antecipa?' checked':'')+' style="width:auto;margin:0"> Crédito antecipado (a maquininha paga tudo no dia útil seguinte)</label>'+
    '<b style="font-size:13.5px">Taxa do crédito por número de parcelas (%)</b><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px">'+
    (c.taxas_credito||[]).map((t,i)=>'<label style="font-size:12px">'+(i+1)+'x<input class="rc-tc" type="number" step="0.01" value="'+t+'" style="margin:2px 0 0"></label>').join('')+'</div>'+
    '<div style="font-size:12px;color:var(--fraco);margin:8px 0 10px">Valores iniciais tirados das vendas Stone de outubro (1x 4,5% · 3x 6,9% · 4x 8,5% · 6x 11,8%). Confira com o contrato da maquininha.</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="bt g" onclick="fecharModal()">Fechar</button><button class="bt" onclick="rcCfgSalvar()">Salvar</button></div>');
}
async function rcCfgSalvar(){
  const e = idadEmpresa(); if(!e) return;
  const row = { empresa_id:e.id, maquininha: document.getElementById('rc-mq').value.trim()||'Stone', taxa_debito: +document.getElementById('rc-td').value||0, prazo_debito: +document.getElementById('rc-pd').value||1,
    antecipa: document.getElementById('rc-an').checked, taxas_credito: Array.from(document.querySelectorAll('.rc-tc')).map(i=>+i.value||0), atualizado_em: new Date().toISOString(), atualizado_por: rcQuem() };
  const q = await sb.from('idad_receb_config').upsert(row).select().maybeSingle();
  if(q.error) return aviso('Não salvou: '+q.error.message,'erro');
  S.rc.cfg = q.data; S.modal = null; render(); aviso('✔ Taxas salvas. Valem para os próximos pagamentos.','ok');
}

/* v145: receber direto da lista de agendados (carrega o agendamento na agenda se precisar) */
async function rcReceberAgenda(id){
  let a = (S.ag.lista||[]).find(x=>x.id===id);
  if(!a){ a = S.rc.agPend.find(x=>x.id===id); if(!a) return; S.ag.lista = (S.ag.lista||[]).concat([a]); }
  if(!S.tiss.carregado && typeof tissCarregar==='function') await tissCarregar();
  agReceber(id, a.status==='agendado' || a.status==='confirmado');
}
