    if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || j.erro || m; }catch(e){} throw new Error(m); }
    if(data && data.error) throw new Error(data.error);
    const d = S.esc.dias.find(x=>x.id===_proc.diaId), h = hospDoLocal(d.local_id);
    const itens = (data && data.itens) || []; if(!itens.length) throw new Error('não achei nenhum procedimento na foto');
    let semP = 0;
    itens.forEach(x=>{ const s = procServico(h, x.procedimento); const v = s && s.valor!=null ? +s.valor : null; if(v==null && x.situacao!=='cancelado') semP++;
      _proc.itens.push({ paciente:x.paciente, idade:x.idade, procedimento: s ? s.nome : x.procedimento, valor:v, situacao:x.situacao, obs:x.obs||'' }); });
    const aviso2 = data.data && data.data!==String(d.data).slice(0,10) ? ' <b style="color:var(--vermelho)">Atenção: a lista é de '+dataBR(data.data)+'.</b>' : '';
    _proc.st = '<span style="color:var(--verde,#0f9d58)">✔ '+itens.length+' procedimento(s) lido(s)'+(semP?' — '+semP+' sem preço na tabela, digite o valor':'')+'. Confira e salve.</span>'+aviso2;
    procDesenhar();

/* ---------- pagamentos no Painel ---------- */
async function escLancarPainel(){
  const vis = escLocaisVis().map(l=>l.id);
  const trab = escDoMes().filter(d=>vis.indexOf(d.local_id)>=0 && escTrabalho(d) && d.anestesista_id && escValidado(d) && (Number(d.valor)||0)>0);
  const g = {};
  trab.forEach(d=>{ const k = d.anestesista_id+'|'+(d.empresa_id||''); const x = g[k] = g[k] || { anes:d.anestesista_id, emp:d.empresa_id||null, n:0, total:0 }; x.n++; x.total += Number(d.valor)||0; });
  const ks = Object.keys(g); if(!ks.length) return alert('Nenhum dia com anestesista e valor neste mês.');
  if(ks.some(k=>!g[k].emp) && !confirm('Tem dia sem CNPJ definido — esses pagamentos vão para "Apontar depois". Continuar?')) return;
  if(!confirm('Lançar '+ks.length+' pagamento(s) de '+escMesNome(S.mes)+' ('+S.esc.hosp+') no Painel como saídas a pagar?')) return;
  let feitos=0, pulados=0;
  for(const k of ks){
    const x = g[k], a = escAnes(x.anes) || { nome:'?' };
    const desc = 'Escala '+(escGrupo()==='NAFS'?'anestesia':escGrupo().toLowerCase())+' '+escMesNome(S.mes)+' — '+S.esc.hosp+' — '+a.nome+' ('+x.n+' dia'+(x.n>1?'s':'')+')';
    if(S.movimentos.some(m=>m.categoria==='Escala anestesia' && m.descricao===desc && (m.empresa_id||null)===x.emp)){ pulados++; continue; }
    const reg = { tipo:'saida', empresa_id:x.emp, valor: Math.round(x.total*100)/100, data_movimento: escUltimoDia(S.mes),
      fornecedor: a.nome, categoria:'Escala anestesia', descricao: desc, pago:false, criado_por: S.user.id };
    const r = await sb.from('movimentos').insert(reg).select().maybeSingle();
    if(r.error) return aviso('Parou num erro: '+r.error.message,'erro');
    S.movimentos.unshift(r.data); feitos++;
  }
  aviso(feitos+' pagamento(s) lançado(s) no Painel'+(pulados?' · '+pulados+' já existia(m)':'')+'.','ok');
}

/* ===== v83 (Renato, 12/11/2026): "toda vez tenho que sair e entrar de novo" =====
   1) VERSÃO: a cada 1 min e sempre que o app volta para a frente, busca o index.html sem cache e compara o rf-versao.
      Se mudou, recarrega sozinho (com ?v= novo, que fura o cache do GitHub e do WebView). Se tiver janela aberta
      ou alguém digitando, só mostra a faixa "Nova versão" no topo, para não perder o que está sendo feito.
   2) DADOS: a cada 2 min e ao voltar para o app, busca de novo perfil/permissões, CNPJs, movimentos, escala e saldo,
      sem tela de carregando. Botão ⟳ no topo faz isso na hora. */
var _atuRodando = false, _atuUlt = 0;
function cpeOcupado(){ const a = document.activeElement; return !!S.modal || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=='button'); }
function cpeRecarregar(v){
  try{ const u = new URL(location.href); u.searchParams.set('v', v || Date.now()); location.replace(u.toString()); }catch(e){ location.reload(); }
}
async function checarVersao(){
  try{
    const r = await fetch('index.html?_='+Date.now(), { cache:'no-store' }); if(!r.ok) return;
    const m = (await r.text()).match(/name="rf-versao" content="(v\d+)"/); if(!m || m[1]===SISTEMA.versao) return;
    let ja = ''; try{ ja = sessionStorage.getItem('cpe_recarregou')||''; }catch(e){}
    if(!cpeOcupado() && ja!==m[1]){ try{ sessionStorage.setItem('cpe_recarregou', m[1]); }catch(e){} cpeRecarregar(m[1]); return; }
    if(S.novaVersao!==m[1]){ S.novaVersao = m[1]; if(!cpeOcupado()) render(); }
  }catch(e){}
}
async function atualizarSilencioso(forcar){
  if(!S.user || S.anesTok || S.carregando || _atuRodando) return;
  if(!forcar && cpeOcupado()) return;
  _atuRodando = true; _atuUlt = Date.now();
  try{
    const { data:perfil } = await sb.from('perfis').select('*').eq('id', S.user.id).maybeSingle();
    if(perfil) S.perfil = perfil;
    if(!ehAnes()){
      const [emp, ori, mov, reg] = await Promise.all([
        sb.from('empresas').select('*').order('razao_social'),
        sb.from('origens').select('*').order('nome'),
        lerTudo(()=>sb.from('movimentos').select('*').order('data_movimento',{ascending:false}).order('id')),
        sb.from('regras_fornecedor').select('*')
      ]);
      if(!emp.error) S.empresas = emp.data||[]; if(!ori.error) S.origens = ori.data||[];
      if(!mov.error) S.movimentos = mov.data||[]; if(!reg.error) S.regras = reg.data||[];
      await pesCarregar();
      if(podeUsuarios()){ const { data:ps } = await sb.from('perfis').select('*').order('papel'); if(ps) S.perfis = ps; }
    }
    if(S.esc && S.esc.carregado){ S.esc.carregado = false; S.esc.proc = {}; await escCarregar(); } /* v105: procedimentos também recarregam (antes ficavam presos na 1ª leitura) */
    if(S.saldo) S.saldo.carregado = false;
    if(S.conv && S.conv.carregado && !S.conv.carregando){ const r = await sb.from('idad_convenios').select('*').order('convenio').order('procedimento').order('vigencia_inicio'); if(!r.error) S.conv.lista = r.data||[]; }
    if(S.vini && S.vini.st && viniDono()) await viniCarregar();
    if(S.rob && S.rob.robos && viniDono()) await robCarregar();
    if(S.fich && S.fich.carregado && !S.fich.carregando){ const r = await sb.from('fichas').select('*').order('criado_em',{ascending:false}); if(!r.error) S.fich.lista = r.data||[]; }
  }catch(e){}
  _atuRodando = false;
  if(_syncDeNovo){ _syncDeNovo = false; return atualizarSilencioso(true); }
  if(!cpeOcupado()) render(); else _renderPend = true;
}
/* v104 (Renato, 17/11/2026: "vão mexer juntas e atualizar juntas e não pode dar divergência"):
   TEMPO REAL — qualquer gravação em movimentos/regras/escala/procedimentos/empresas/origens dispara um gatilho no banco
   que mexe na tabela cpe_sinal; todas as telas abertas escutam essa tabela e recarregam os dados na hora.
   Se a pessoa estiver digitando ou com uma janela aberta, os dados já chegam e a tela redesenha assim que ela terminar. */
var _syncDeNovo = false, _renderPend = false, _syncTimer = null, _syncCanal = null;
function syncLigar(){
  if(_syncCanal || !S.user || S.anesTok) return;
  _syncCanal = sb.channel('cpe-sinal').on('postgres_changes', { event:'UPDATE', schema:'public', table:'cpe_sinal' }, ()=>{
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(()=>{ if(_atuRodando) _syncDeNovo = true; else atualizarSilencioso(true); }, 700);
  }).subscribe(st=>{ if(st==='CHANNEL_ERROR' || st==='TIMED_OUT'){ try{ sb.removeChannel(_syncCanal); }catch(e){} _syncCanal = null; setTimeout(syncLigar, 5000); }
                     if(st==='SUBSCRIBED') atualizarSilencioso(true); });
}
function syncDesligar(){ if(_syncCanal){ try{ sb.removeChannel(_syncCanal); }catch(e){} _syncCanal = null; } }
setInterval(()=>{ if(_renderPend && !cpeOcupado()){ _renderPend = false; render(); } }, 1200);
setInterval(()=>{ if(S.user && !S.anesTok && !_syncCanal) syncLigar(); }, 10000);
async function atualizarAgora(){ aviso('Atualizando…','ok'); await checarVersao(); await atualizarSilencioso(true); aviso('Atualizado.','ok'); }
setInterval(()=>{ if(document.visibilityState==='visible' && S.tela==='vini' && viniDono() && !S.modal) viniCarregar(); }, 8000);   // v119: QR e conversas do Vini ao vivo
setInterval(()=>{ if(document.visibilityState!=='visible') return; checarVersao(); if(Date.now()-_atuUlt > 120000) atualizarSilencioso(); }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ checarVersao(); if(Date.now()-_atuUlt > 20000) atualizarSilencioso(); } });
window.addEventListener('focus', ()=>{ checarVersao(); });

   Financeiro: caixa "CNPJs" (abre as empresas) + Apontar depois, Cartões e contas, Nomes.

const CPE_TELAS = {

function cpeTrilha(){

async function navChamar(acao, corpo){
  const { data, error } = await sb.functions.invoke('mr-navegador', { body: Object.assign({ acao }, corpo||{}) });
  if(error){ let m = error.message; try{ const j = await error.context.json(); if(j && j.erro) m = j.erro; }catch(_){ } return { ok:false, erro:m }; }
  return data || { ok:false, erro:'sem resposta' };
}
async function navCarregar(){
  if(S.nav.carregando) return; S.nav.carregando = true;

  if(!r.ok){ S.nav.dados = { erro: r.erro||'falhou', sistemas:[], acessos:[] }; } else S.nav.dados = r;

      (d.renato?'<button class="bt g mini" onclick="S.nav.roteiro=S.nav.roteiro===\''+s.chave+'\'?null:\''+s.chave+'\';render()">🧭 Roteiro</button>':'')+'</div>'+

function viniFoneBR(t){ const d = soDig(t).replace(/^55/,''); return d.length>=10 ? '('+d.slice(0,2)+') '+d.slice(2,-4)+'-'+d.slice(-4) : t; }
function viniHora(t){ const d = new Date(t); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

async function viniPausar(p){ const r = await sb.from('vini_status').update({ pausado:p }).eq('id',1); if(r.error) return aviso('Não gravou: '+r.error.message,'erro'); S.vini.st.pausado = p; aviso(p?'Vini pausado — não responde nem envia até retomar.':'Vini retomado.','ok'); }
async function viniPedido(p){
  if(p==='desconectar' && !confirm('Desconectar o número do Vini? Vai precisar ler o QR de novo no celular.')) return;
  const r = await sb.from('vini_status').update({ pedido:p, pedido_em:new Date().toISOString() }).eq('id',1); if(r.error) return aviso('Não gravou: '+r.error.message,'erro');
  aviso('Pedido enviado ao motor — em até 30 segundos.','ok');
}
function viniContato(id){

    '<div style="display:flex;gap:8px;margin-top:16px"><button class="bt" onclick="viniSalvarContato(\''+(id||'')+'\')">Salvar</button><button class="bt g" onclick="fecharModal()">Cancelar</button></div>');
}
async function viniSalvarContato(id){
  const o = { nome: val('vc-nome').trim(), telefone: viniFone(val('vc-fone')), pode_lancar: document.getElementById('vc-lanca').checked, ativo: document.getElementById('vc-ativo').checked };

}
function viniMandar(fone){
  abrirModal('<h2>Mensagem pelo Vini</h2><div style="font-size:13px;color:var(--fraco)">Para '+esc(viniFoneBR(fone))+'. Sai assinada "Vini · Sistema MR".</div><textarea id="vm-txt" rows="4"></textarea>'+

async function viniEnviar(fone){
  const t = val('vm-txt').trim(); if(!t) return;

/* ===== v121 (Renato, 20/11/2026): FUNCIONÁRIOS CIBERNÉTICOS — robôs internos do MR (modelo do RF Sistema).
   Os robôs rodam sozinhos no banco (pg_cron): fiscais de cada área a cada 15 min e o Vigia a cada 5 min (função robos_rodar).
   Cada divergência vira EXCEÇÃO; quando o problema some do sistema, ela fecha sozinha. Só o Renato vê (vini_dono()).
   Tabelas: robos, robos_pulso, excecoes, robos_config, cobrancas, chamados, uso_ia. */
S.rob = { robos:null, pulso:[], exc:[], cfg:null, ia:[], f:'abertas', robo:'', carregando:false };
function icoRobos(){ return '<svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">'+icoGrad('gRob')+
  '<rect x="6" y="16" width="16" height="14" rx="4" fill="url(#gRob)" opacity=".55"/><rect x="26" y="16" width="16" height="14" rx="4" fill="url(#gRob)" opacity=".55"/>'+
  '<rect x="14" y="9" width="20" height="18" rx="5" fill="url(#gRob)"/><circle cx="20" cy="18" r="2.4" fill="#fff"/><circle cx="28" cy="18" r="2.4" fill="#fff"/>'+
  '<rect x="11" y="31" width="26" height="9" rx="3" fill="url(#gRob)"/><rect x="16" y="34" width="16" height="3" rx="1.5" fill="#fff" opacity=".8"/></svg>'; }
async function robCarregar(){
  if(S.rob.carregando) return; S.rob.carregando = true;
  const d7 = new Date(Date.now()-7*864e5).toISOString(), m1 = new Date(); m1.setDate(1); m1.setHours(0,0,0,0);
  const [r, p, e, c, ia] = await Promise.all([
    sb.from('robos').select('*').order('ordem'),
    sb.from('robos_pulso').select('*').gte('em', d7).order('em',{ascending:false}).limit(2000),
    sb.from('excecoes').select('*').or('status.neq.resolvida,resolvida_em.gte.'+d7).order('aberta_em',{ascending:false}).limit(2000),
    sb.from('robos_config').select('*').eq('id',1).maybeSingle(),
    sb.from('uso_ia').select('robo,tokens_in,tokens_out').gte('em', m1.toISOString()).limit(20000) ]);
  S.rob.robos = r.data||[]; S.rob.pulso = p.data||[]; S.rob.exc = e.data||[]; S.rob.cfg = c.data||{}; S.rob.ia = ia.data||[]; S.rob.carregando = false; render();
}
function robResumo(){ const ab = (S.rob.exc||[]).filter(x=>x.status==='aberta'); return S.rob.robos ? ab.length+' exceção(ões) aberta(s) · robôs fiscais e vigia' : 'robôs fiscais de cada área, exceções e vigia'; }
function robMinutos(t){ return t ? Math.round((Date.now()-new Date(t).getTime())/60000) : null; }
function robQuando(t){ const m = robMinutos(t); if(m==null) return 'nunca'; if(m<1) return 'agora'; if(m<60) return 'há '+m+' min'; if(m<1440) return 'há '+Math.round(m/60)+' h'; return 'há '+Math.round(m/1440)+' dia(s)'; }
function robCustoMes(robo){ const c = S.rob.cfg||{}, l = S.rob.ia.filter(x=>!robo || x.robo===robo);
  const usd = l.reduce((a,x)=>a+(+x.tokens_in||0)*(+c.preco_in_1m||0)/1e6+(+x.tokens_out||0)*(+c.preco_out_1m||0)/1e6,0); return { chamadas:l.length, brl: usd*(+c.dolar||0) }; }
function telaRobos(){
  let h = '<div class="secao"><b>FUNCIONÁRIOS CIBERNÉTICOS</b><span>robôs que fiscalizam o sistema sozinhos · só exceções</span></div>';
  if(!viniDono()) return h+'<div class="vazio">Você não tem acesso a esta aba.</div>';
  if(!S.rob.robos){ robCarregar(); return h+'<div class="vazio">Carregando…</div>'; }
  const ex = S.rob.exc, ab = ex.filter(x=>x.status==='aberta'), tr = ex.filter(x=>x.status==='tratamento'), cr = ab.filter(x=>x.critico);
  const hoje = new Date(); hoje.setHours(0,0,0,0); const resH = ex.filter(x=>x.status==='resolvida' && new Date(x.resolvida_em)>=hoje).length;
  const fiscais = S.rob.robos.filter(r=>r.id!=='vini'), ok = fiscais.filter(r=>{ const u = S.rob.pulso.find(p=>p.robo===r.id); return r.ativo && u && robMinutos(u.em) <= r.intervalo_min*3; }).length;
  const cm = robCustoMes();
  h += '<div class="card"><div class="kpis">'+kpi('Exceções abertas', '<span style="color:'+(ab.length?'#d97706':'var(--verde)')+'">'+ab.length+'</span>')+
    kpi('Prioridade (≥ '+brl(+S.rob.cfg.limite_dono||1000)+' ou crítico)', '<span style="color:'+(cr.length?'var(--vermelho)':'var(--verde)')+'">'+cr.length+'</span>')+
    kpi('Em tratamento', tr.length)+kpi('Resolvidas hoje', '<span style="color:var(--verde)">'+resH+'</span>')+
    kpi('Robôs rodando', ok+' de '+fiscais.length)+kpi('Custo de IA no mês', cm.chamadas?brl(cm.brl)+' <small style="font-size:11px;color:var(--fraco)">estimado</small>':'<span style="font-size:13px;color:var(--fraco)">medição na próxima versão do Vini</span>')+'</div>'+
    '<div style="font-size:12px;color:var(--fraco);margin-top:8px">Fluxo: dado → robô da área → divergência vira exceção → (cobrança, quando os números da equipe entrarem) → quando o problema some, a exceção fecha sozinha. O Vini recebe só as exceções.</div></div>';
  // cartões dos robôs
  h += '<div class="cc-fontes" style="margin-bottom:14px">'+S.rob.robos.map(r=>{
    const ps = S.rob.pulso.filter(p=>p.robo===r.id), u = ps[0], exr = ex.filter(x=>x.robo===r.id), abr = exr.filter(x=>x.status==='aberta').length, res7 = exr.filter(x=>x.status==='resolvida').length;
    let st, cor;
    if(r.id==='vini'){ const v = S.vini.st||{}; const vivo = v.visto_em && robMinutos(v.visto_em)<=2; st = vivo&&v.conectado ? (v.pausado?'Pausado':'Ligado') : 'Desligado'; cor = vivo&&v.conectado&&!v.pausado ? 'ok' : 'falta'; }
    else { st = !r.ativo ? 'Pausado' : !u ? 'Nunca rodou' : robMinutos(u.em) > r.intervalo_min*3 ? 'Atrasado' : 'Rodando'; cor = !r.ativo ? 'parc' : st==='Rodando' ? 'ok' : 'falta'; }
    const cia = robCustoMes(r.id);
    return '<div class="cc-fonte '+cor+'" style="flex-direction:column;gap:6px"><div style="display:flex;gap:10px;align-items:center"><div style="width:38px;height:38px">'+(r.id==='vini'?icoVini():icoRobos()).replace(/46/g,'38')+'</div>'+
      '<div style="flex:1"><b>'+esc(r.nome)+'</b><small>'+esc(r.setor)+'</small></div><b style="font-size:12px;color:'+(cor==='ok'?'var(--verde)':cor==='parc'?'#d97706':'var(--vermelho)')+'">● '+st+'</b></div>'+
      '<div style="font-size:12px;color:var(--fraco)">'+esc(r.descricao||'')+'</div>'+
      (r.id==='vini' ? '<div style="font-size:12.5px">Recebe as exceções · relatório 7h/19h: <b>'+(S.rob.cfg.relatorio_ativo?'ligado':'desligado')+'</b>'+(cia.chamadas?' · IA no mês: '+cia.chamadas+' chamadas ≈ '+brl(cia.brl):'')+'</div>'
        : '<div style="font-size:12.5px">Última rodada '+robQuando(u&&u.em)+(u?' · '+u.processados+' registros vistos · '+u.divergencias+' divergência(s)':'')+'</div>'+
          '<div style="font-size:12.5px"><b style="color:'+(abr?'#d97706':'var(--verde)')+'">'+abr+' aberta(s)</b> · '+res7+' resolvida(s) em 7 dias · '+ps.length+' rodadas em 7 dias</div>'+
          '<div><button class="bt g mini" onclick="robPausar(\''+r.id+'\','+(!r.ativo)+')">'+(r.ativo?'⏸ Pausar':'▶ Retomar')+'</button> <button class="bt g mini" onclick="S.rob.robo=\''+r.id+'\';S.rob.f=\'abertas\';render()">Ver exceções</button></div>')+
      '</div>'; }).join('')+'</div>';
  // exceções
  const F = [['abertas','Abertas ('+ab.length+')'],['criticas','Prioridade ('+cr.length+')'],['tratamento','Em tratamento ('+tr.length+')'],['resolvidas','Resolvidas 7 dias']];
  let l = S.rob.f==='abertas' ? ab : S.rob.f==='criticas' ? cr : S.rob.f==='tratamento' ? tr : ex.filter(x=>x.status==='resolvida');
  if(S.rob.robo) l = l.filter(x=>x.robo===S.rob.robo);
  l = l.slice().sort((a,b)=>(b.critico-a.critico) || (Math.abs(+b.valor||0)-Math.abs(+a.valor||0)));
  const nomeR = id => ((S.rob.robos.find(r=>r.id===id)||{}).nome||id);
  h += '<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><b style="font-size:14px;margin-right:6px">Exceções</b>'+
    F.map(f=>'<button class="bt '+(S.rob.f===f[0]?'':'g ')+'mini" onclick="S.rob.f=\''+f[0]+'\';render()">'+f[1]+'</button>').join('')+
    '<select onchange="S.rob.robo=this.value;render()" style="width:auto;margin:0 0 0 auto"><option value="">Todos os robôs</option>'+S.rob.robos.filter(r=>r.id!=='vini').map(r=>'<option value="'+r.id+'"'+(S.rob.robo===r.id?' selected':'')+'>'+esc(r.nome)+'</option>').join('')+'</select></div>'+

  else {
    const ex = t==='date' ? ' type="date"' : t==='num' ? ' type="number" step="0.01" inputmode="decimal"' :

/* v102 (Renato, 17/11/2026): botão para TIRAR FOTO DO DOCUMENTO e preencher a ficha sozinho.
   Lê RG / CNH / CPF / carteirinha do convênio / cartão SUS / comprovante de endereço (Edge Function ler-documento-paciente).
   Só preenche campo VAZIO — o que já foi digitado não é trocado. Nada é gravado até apertar Salvar. */
function icoCamDoc(){
  return '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-4px;margin-right:6px"><defs><linearGradient id="gCamD" x1="0" y1="1" x2="1" y2="0">'+
    '<stop offset="0" stop-color="#13b981"/><stop offset=".5" stop-color="#00b8d9"/><stop offset="1" stop-color="#0a6cf0"/></linearGradient></defs>'+
    '<path d="M8.5 4.5h7l1.4 2.2H20a2 2 0 0 1 2 2v9.8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.7a2 2 0 0 1 2-2h3.1z" fill="url(#gCamD)"/>'+
    '<circle cx="12" cy="13.3" r="4.2" fill="#fff"/><circle cx="12" cy="13.3" r="2.4" fill="url(#gCamD)"/></svg>';
}
function pacBarraDoc(){
  return '<div class="pxdoc" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 14px;padding:10px 12px;border:1px dashed var(--linha);border-radius:10px">'+
    '<button type="button" class="bt mini" onclick="document.getElementById(\'pc-docfoto\').click()">'+icoCamDoc()+'Tirar foto do documento</button>'+
    '<button type="button" class="bt g mini" onclick="document.getElementById(\'pc-docarq\').click()">Galeria / PDF</button>'+
    '<input type="file" id="pc-docfoto" accept="image/*" capture="environment" hidden onchange="pacLerDocumento(this)">'+
    '<input type="file" id="pc-docarq" accept="image/*,application/pdf" multiple hidden onchange="pacLerDocumento(this)">'+
    '<span id="pc-docst" style="font-size:12.5px;color:var(--fraco);flex:1;min-width:200px">RG, CNH, CPF, carteirinha do convênio, cartão SUS ou comprovante de endereço — frente e verso, uma foto de cada vez. Preenche só os campos vazios.</span></div>';
}
async function pacLerDocumento(inp){
  const st = document.getElementById('pc-docst'), arqs = Array.from((inp && inp.files) || []);
  if(!arqs.length) return;
  const msg = h=>{ if(st) st.innerHTML = h; };
  try{
    msg('Preparando a foto…');
    const imagens = [];
    for(const f of arqs.slice(0,4)){
      const buf = await f.arrayBuffer();
      if(!buf.byteLength) throw new Error('a foto veio vazia do seletor — tente pela Galeria');
      const ehPdf = (f.type==='application/pdf') || /\.pdf$/i.test(f.name||'');
      if(ehPdf) (await saldoPdfImagens(buf.slice(0))).slice(0,2).forEach(x=>imagens.push(x));
      else imagens.push({ b64: await saldoImgJpeg(new Blob([buf],{type:f.type||'image/jpeg'})), mime:'image/jpeg' });
    }
    msg('Lendo o documento… (uns 10 a 20 segundos)');
    const { data, error } = await sb.functions.invoke('ler-documento-paciente', { body: { imagens: imagens.slice(0,4) } });
    if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || j.erro || m; }catch(e){} throw new Error(m); }
    if(data && data.error) throw new Error(data.error);
    const c = (data && data.campos) || {};
    pacLerTela();                                   // guarda o que já está digitado na tela
    const preenchidos = [], diferentes = [];
    const dataOk = v=> /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : (v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/) ? v.replace(/^(\d{2})\/(\d{2})\/(\d{4})$/,'$3-$2-$1') : '');
    pacTodosCampos().forEach(([k,rot,t,ops])=>{
      let v = c[k]; if(v==null || v==='') return;
      v = String(v).trim();
      if(t==='date'){ v = dataOk(v); if(!v) return; }
      if(t==='cpf' || t==='cep' || k==='cns'){ v = soDig(v); if(t==='cpf' && !validaCPF(v)) return; }
      if(t==='select'){ const o = (ops||[]).find(x=>norm(x)===norm(v)); if(!o) return; v = o; }
      const atual = _pacReg[k];
      if(atual!=null && String(atual).trim()!==''){ if(norm(String(atual))!==norm(v)) diferentes.push((rot||k)+': '+v); return; }
      _pacReg[k] = v; preenchidos.push(k);
    });
    const id = val('pc-id') || null;
    pacDesenhar(id);
    preenchidos.forEach(k=>{ const e=document.getElementById('pc-'+k); if(e) e.style.background='#e6f8f1'; });
    const docs = (data.documentos||[]).join(', ');
    const st2 = document.getElementById('pc-docst');
    if(st2) st2.innerHTML = (preenchidos.length
        ? '<span style="color:var(--verde,#0f9d58)">✔ Lido'+(docs?' ('+esc(docs)+')':'')+': '+preenchidos.length+' campo'+(preenchidos.length>1?'s':'')+' preenchido'+(preenchidos.length>1?'s':'')+' (em verde). Confira e toque em Salvar.</span>'
        : '<span style="color:var(--fraco)">Lido'+(docs?' ('+esc(docs)+')':'')+', mas não havia campo vazio para preencher.</span>')+
      (diferentes.length ? '<br><span style="color:var(--vermelho)">No documento está diferente do que já foi digitado (não troquei): '+esc(diferentes.join(' · '))+'</span>' : '');
    const n = document.getElementById('pc-nascimento'); if(n && n.value){ const a = idadeDe(n.value); const ie=document.getElementById('pc-idade'); if(ie) ie.value = a!=null ? a+' anos' : ''; }
    if(c.cep && !c.endereco) pacBuscaCEP(c.cep);
  }catch(e){ msg('<span style="color:var(--vermelho)">✖ '+esc(e.message||e)+'</span>'); }
  finally{ if(inp) inp.value = ''; }
}
function pacLerTela(){ pacTodosCampos().forEach(([k,rot,t])=>{ const e = document.getElementById('pc-'+k); if(!e) return;
  if(t==='check') _pacReg[k] = e.checked; else { let v = String(e.value||'').trim(); if(['cpf','tel','cep'].indexOf(t)>=0) v = soDig(v); if(t==='num') v = v ? Number(v.replace(',','.')) : ''; _pacReg[k] = v==='' ? null : v; } });
  const o = document.getElementById('pc-obs'); if(o) _pacReg.obs = o.value.trim()||null; }
function pacAba(a, id){ pacLerTela(); _pacAba = _pacAba===a ? null : a; pacDesenhar(id||null); }
function pacProprio(){ const set=(k,v)=>{ const e=document.getElementById('pc-'+k); if(e) e.value=v; };
  set('titular', val('pc-nome')); set('titular_cpf', val('pc-cpf')); }
function mascaraCEP(t){ const d=soDig(t).slice(0,8); return d.length>5 ? d.slice(0,5)+'-'+d.slice(5) : d; }
async function pacBuscaCEP(c){ c = soDig(c); if(c.length!==8) return;
  try{ const r = await (await fetch('https://viacep.com.br/ws/'+c+'/json/')).json(); if(r.erro) return aviso('CEP não encontrado.','erro');
    const set = (k,v)=>{ const e=document.getElementById('pc-'+k); if(e && v && !e.value) e.value = v; };
    set('endereco', r.logradouro); set('bairro', r.bairro); set('cidade', r.localidade); const u=document.getElementById('pc-uf'); if(u && r.uf) u.value = r.uf;
    const ci=document.getElementById('pc-cidade'); if(ci && r.localidade) ci.value = r.localidade;
  }catch(e){} }
async function idadPacSalvar(){
  pacLerTela();
  const id = val('pc-id'), reg = {};
  pacTodosCampos().forEach(([k,rot,t])=>{ if(k[0]!=='_' && t!=='reg') reg[k] = _pacReg[k]===undefined ? null : _pacReg[k]; });
  reg.obs = _pacReg.obs||null;
  if(!reg.nome) return aviso('Informe o nome do paciente.','erro');
  if(reg.cpf && !validaCPF(reg.cpf)) return aviso('CPF do paciente inválido — confira os dígitos.','erro');
  if(reg.titular_cpf && !validaCPF(reg.titular_cpf)) return aviso('CPF do titular inválido.','erro');
  if(reg.cpf && S.idad.pac.some(x=>x.id!==id && soDig(x.cpf)===reg.cpf)) return aviso('Já existe paciente com este CPF.','erro');
  reg.titular_proprio = !reg.titular || (reg.titular===reg.nome);
  reg.atualizado_em = new Date().toISOString();
  const r = id ? await sb.from('idad_pacientes').update(reg).eq('id',id).select().maybeSingle()
               : await sb.from('idad_pacientes').insert(reg).select().maybeSingle();
  if(r.error) return aviso('Não gravou: '+r.error.message,'erro');
  if(id){ const i=S.idad.pac.findIndex(x=>x.id===id); if(i>=0) S.idad.pac[i]=r.data; } else S.idad.pac.push(r.data);
  S.idad.pac.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  S.modal=null; aviso(id?'Paciente atualizado.':'Paciente cadastrado — prontuário nº '+r.data.prontuario+'.','ok');
}

/* ===== v94 (Renato, 16/11/2026): FARMÁCIA e ALMOXARIFADO do Hospital IDAD — a caixa "Plantões no IDAD" virou Farmácia.
   Mesmo motor de estoque para os dois (idad_itens.setor = 'farmacia' | 'almox'); saldo = entradas − saídas (idad_movs).
   Farmácia controla lote e validade; a saída pode ir para um paciente. */
const EST_NOME = { farmacia:'Farmácia', almox:'Almoxarifado' };
function icoGrad(id){ return '<defs><linearGradient id="'+id+'" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#13b981"/><stop offset=".5" stop-color="#00b8d9"/><stop offset="1" stop-color="#0a6cf0"/></linearGradient></defs>'; }
function icoFarmacia(){ return '<svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">'+icoGrad('gFar')+
  '<rect x="13" y="5" width="22" height="7" rx="2" fill="url(#gFar)"/><rect x="10" y="12" width="28" height="31" rx="5" fill="url(#gFar)" opacity=".35"/>'+
  '<rect x="10" y="12" width="28" height="31" rx="5" fill="none" stroke="url(#gFar)" stroke-width="2.5"/><rect x="21.5" y="19" width="5" height="16" rx="1.2" fill="url(#gFar)"/><rect x="16" y="24.5" width="16" height="5" rx="1.2" fill="url(#gFar)"/></svg>'; }
function icoAlmox(){ return '<svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">'+icoGrad('gAlm')+
  '<path d="M24 5 L42 14 L24 23 L6 14 Z" fill="url(#gAlm)"/><path d="M6 14 L24 23 L24 43 L6 34 Z" fill="url(#gAlm)" opacity=".55"/><path d="M42 14 L24 23 L24 43 L42 34 Z" fill="url(#gAlm)" opacity=".8"/>'+
  '<path d="M15 9.5 L33 18.5 L33 25" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/></svg>'; }
function estItens(setor){ return S.idad.itens.filter(x=>x.setor===setor); }
function estMovs(itemId){ return S.idad.movs.filter(m=>m.item_id===itemId); }
function estSaldo(itemId){ return estMovs(itemId).reduce((a,m)=>a+(m.tipo==='entrada'?1:-1)*Number(m.qtd||0),0); }
function estLotes(itemId){ const L = {};
  estMovs(itemId).forEach(m=>{ const k = m.lote||''; if(!L[k]) L[k] = { lote:k, validade:null, saldo:0 };
    if(m.tipo==='entrada'){ L[k].saldo += +m.qtd; if(m.validade && (!L[k].validade || m.validade<L[k].validade)) L[k].validade = m.validade; } else L[k].saldo -= +m.qtd; });
  return Object.values(L).filter(l=>l.saldo>0).sort((a,b)=>String(a.validade||'9999').localeCompare(String(b.validade||'9999'))); }
function estProxVal(itemId){ const l = estLotes(itemId).find(x=>x.validade); return l ? l.validade : null; }
function diasAte(d){ return Math.round((new Date(d+'T12:00:00') - new Date(hojeISO()+'T12:00:00'))/864e5); }
function estSit(it){ const sd = estSaldo(it.id), v = it.setor==='farmacia' ? estProxVal(it.id) : null;
  if(v && diasAte(v)<0) return ['Vencido','var(--vermelho)'];
  if(sd<=0) return ['Sem estoque','var(--vermelho)'];
  if(it.estoque_min && sd<+it.estoque_min) return ['Abaixo do mínimo','#d97706'];
  if(v && diasAte(v)<=30) return ['Vence em '+diasAte(v)+' dias','#d97706'];
  return ['OK','var(--verde)']; }
function estAlertas(setor){ return estItens(setor).filter(it=>it.ativo!==false && estSit(it)[0]!=='OK').length; }
function estResumo(setor){ if(!S.idad.carregado) return 'carregando…'; const n = estItens(setor).length, a = estAlertas(setor);
  return n+' ite'+(n===1?'m':'ns')+(a?' · '+a+' alerta'+(a===1?'':'s'):'')+' · entradas, saídas e saldo'; }
function fmtQ(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2}); }
function telaIdadEst(setor){
  if(!S.idad.carregado) idadCarregar();
  const farm = setor==='farmacia';
  let h = '<div class="secao"><b>'+EST_NOME[setor].toUpperCase()+'</b><span>Hospital IDAD · '+(farm?'medicamentos, lote e validade':'materiais e insumos')+'</span></div>';

    (farm? kpi('Vencidos ou vencendo (30 dias)', String(venc)) : '')+
    kpi('Movimentos no mês', String(S.idad.movs.filter(m=>its.some(i=>i.id===m.item_id) && String(m.data).slice(0,7)===mesHoje()).length))+'</div></div>';
  h += '<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+

    (podeEditar()? '<button class="bt g" onclick="estItemAbrir(\''+setor+'\')">+ Novo item</button><button class="bt" onclick="estMovAbrir(\''+setor+'\',\'entrada\')">↓ Entrada</button><button class="bt" style="background:var(--vermelho)" onclick="estMovAbrir(\''+setor+'\',\'saida\')">↑ Saída</button>' : '')+'</div>';
  return h+'<div id="est-lista">'+estListaHtml(setor)+'</div>';
}
function estLista(setor){ const e=document.getElementById('est-lista'); if(e) e.innerHTML = estListaHtml(setor); }
function estListaHtml(setor){
  const farm = setor==='farmacia', b = permNorm(S.idad.estBusca);

    its.map(it=>{ const st = estSit(it), v = farm ? estProxVal(it.id) : null;
      return '<tr style="cursor:pointer" onclick="estItemVer(\''+it.id+'\')"><td><b>'+esc(it.nome)+'</b>'+(it.codigo?'<br><small style="color:var(--fraco)">'+esc(it.codigo)+'</small>':'')+'</td><td>'+esc(it.categoria||'—')+'</td><td>'+esc(it.unidade||'—')+'</td>'+
        '<td style="text-align:right;font-weight:800">'+fmtQ(estSaldo(it.id))+'</td><td style="text-align:right">'+fmtQ(it.estoque_min)+'</td>'+(farm?'<td>'+(v?dataBR(v):'—')+'</td>':'')+
        '<td><span style="color:'+st[1]+';font-weight:700">'+st[0]+'</span></td></tr>'; }).join('')+'</tbody></table></div>';
}
function estItemAbrir(setor, id){
  const it = id ? S.idad.itens.find(x=>x.id===id) : { setor, unidade: setor==='farmacia'?'UN':'UN', estoque_min:0 };
  const cats = {}; estItens(setor).forEach(x=>{ if(x.categoria) cats[x.categoria]=1; });
  abrirModal('<h2>'+(id?'Editar item':'Novo item')+' · '+EST_NOME[it.setor]+'</h2><input type="hidden" id="ei-id" value="'+(id||'')+'"><input type="hidden" id="ei-setor" value="'+it.setor+'">'+

async function obraSalvar(){

  if(!reg.descricao) return aviso('Informe a descrição.','erro');
  if(!(reg.valor>0)) return aviso('Informe o valor.','erro');

  const r = id ? await sb.from('idad_obra').update(reg).eq('id',id).select().maybeSingle() : await sb.from('idad_obra').insert(reg).select().maybeSingle();

async function obraExcluir(id){ if(!confirm('Excluir este gasto da obra?')) return;

  S.idad.obra = S.idad.obra.filter(o=>o.id!==id); S.modal=null; aviso('Gasto excluído.','ok'); }
/* ===== v124 (Renato/Vinicius, 21/11/2026): CARTÕES DA OBRA — uma aba por cartão dentro da Obra do IDAD.
   "São extratos de cartões diferentes; cada extrato vai para o seu cartão. Lá dentro, cada compra tem uma caixinha
   para selecionar e direcionar para quem vai aquela compra."
   - Cartões da obra = origens.obra (incluir/tirar pelo "+ Cartão"). Ordem: origens.obra_ordem.
   - Fatura importada pela aba (ou pelo Vini) cai no cartão certo; cabeçalho em cartao_faturas (total impresso, vencimento).
   - Destino de cada compra (sempre no próprio movimento, auditado):
       Obra do IDAD → movimento no CNPJ do IDAD, categoria "Obra do IDAD" + linha em idad_obra (movimento_id);
       Pessoal → Despesas pessoais da pessoa escolhida; CNPJ → movimento vai para o CNPJ; Tirar destino → volta para o "Apontar depois". */
const OBRA_CAT_MOV = 'Obra do IDAD';
function obraCartoes(){ return S.origens.filter(o=>o.obra).sort((a,b)=>(a.obra_ordem||99)-(b.obra_ordem||99) || String(a.nome).localeCompare(String(b.nome),'pt-BR')); }
function obraCartaoNome(o){ return String(o.nome||'').replace(/^Cart[ãa]o\s+/i,'').replace(/\s*\(identificar o dono\)/i,'').replace(/\s+final\s+/i,' · '); }
// v125: rótulo da aba = nome da pessoa + banco (+ final)
const CART_BANCOS = [['UNICRED','Unicred'],['OUROCARD','Banco do Brasil'],['BANCO DO BRASIL','Banco do Brasil'],['BB','Banco do Brasil'],['ITAU','Itaú'],['BRADESCO','Bradesco'],['SANTANDER','Santander'],['NUBANK','Nubank'],['INTER','Inter'],['CAIXA','Caixa'],['SICOOB','Sicoob'],['SICREDI','Sicredi'],['C6','C6 Bank'],['XP','XP'],['BTG','BTG']];
function cartaoBanco(o){ if(o.banco) return o.banco; const n = ' '+permNorm(o.nome).toUpperCase()+' '; const b = CART_BANCOS.find(k=>n.indexOf(' '+k[0]+' ')>=0); return b ? b[1] : ''; }
function cartaoPessoa(o){ if(o.titular) return String(o.titular).trim().split(/\s+/)[0]; const n = obraCartaoNome(o).split(' · ')[0].trim(); return /^final\b/i.test(n) || !n ? '' : n.split(/\s+/)[0]; }
function obraDestino(m){
  if(m.pessoal) return { k:'pes', t:'👤 Pessoal — '+pesNome(m.pessoa_id), c:'d-pes' };

  const ids = obraIdsMarcados(); if(!ids.length) return aviso('Marque as compras primeiro.','erro');
  const ms = ids.map(id=>S.movimentos.find(x=>x.id===id)).filter(Boolean);

  if(ms.length <= 5 && Math.abs(tot) < 5000 && !(dest==='tirar' && comDestino.length > 1)) return obraDirecionar(dest, alvo, dinheiro);
  const deOnde = {}; comDestino.forEach(m=>{ const k = obraDestino(m).t; deOnde[k] = (deOnde[k]||0) + 1; });

async function obraCartoesSalvar(){

/* ===== v130 (Renato, 21/11/2026): CONSOLIDAÇÃO — "anexar nota e o sistema lê e casa com a dívida do cartão".
   - Botão 🧾 Anexar nota em Cartões e compras (e o Vini pelo WhatsApp): lê a nota (ler-nota) e procura a compra em TODOS os cartões.
   - Casa quando: mesmo valor (à vista) ou parcela × nº de parcelas = valor da nota (tolerância de centavos de arredondamento),
     data da compra até 5 dias da emissão, e o nome do fornecedor parecido (ajuda a desempatar).
   - Casou → todas as parcelas daquela compra ficam VERDES "Consolidada · NF nº" (movimentos.nota_id → cartao_notas).
   - Não casou → a nota fica guardada em "Notas sem compra" e o sistema tenta de novo a cada fatura nova. */
function notaTol(v){ return Math.max(0.10, Math.abs(+v||0)*0.002); }   // até 10 centavos ou 0,2% (arredondamento de parcela)
function notaNomeParecido(a,b){ const n = s=>permNorm(String(s||'')).replace(/[^A-Z0-9 ]/gi,' ').toUpperCase().split(/\s+/).filter(w=>w.length>=3 && !/^(LTDA|COM|MAT|PARC|FEIRA|SANT|SAN|DE|DA|DO)$/.test(w));
  const A = n(a), B = n(b); return A.some(w=>B.some(x=>x.indexOf(w)===0 || w.indexOf(x)===0)); }
function notaCandidatas(nota){
  const cartoes = S.origens.filter(o=>o.tipo==='cartao').map(o=>o.id), vNota = +nota.valor||0, dN = Date.parse(nota.data||'');
  const grupos = {};
  S.movimentos.filter(m=>cartoes.indexOf(m.origem_id)>=0 && !m.nota_id && m.tipo!=='entrada').forEach(m=>{
    const pn = obraParcelaNum(m.descricao), total = pn ? (+m.valor||0)*pn[1] : (+m.valor||0);
    if(Math.abs(total - vNota) > notaTol(vNota)) return;
    if(dN && Math.abs(Date.parse(m.data_movimento) - dN) > 5*864e5) return;
    const base = String(m.fornecedor||m.descricao||'').replace(/\s*PARC\w*\.?\s*\d+\s*(\/|DE)\s*\d+.*$/i,'').trim();
    const k = m.origem_id+'|'+base+'|'+(pn?pn[1]:1)+'|'+(+m.valor).toFixed(2);
    (grupos[k] = grupos[k] || { origem_id:m.origem_id, nome:base, parcelas: pn?pn[1]:1, valor:+m.valor, total, movs:[], nomeOk: notaNomeParecido(base, nota.emitente) }).movs.push(m);
  });
  return Object.values(grupos).sort((a,b)=>(b.nomeOk-a.nomeOk) || (Math.abs(a.total-vNota)-Math.abs(b.total-vNota)));
}

    (c.parcelas>1 ? c.parcelas+'× '+brl(c.valor)+' = '+brl(c.total) : brl(c.total))+(Math.abs(c.total-nota.valor)>=0.005?' (diferença de '+brl(Math.abs(c.total-nota.valor))+' de arredondamento)':'')+'. Consolidada.</small></div>';

async function notaDescartar(nid){

  const u = await sb.from('cartao_notas').update({ status:'descartada', motivo: motivo+' — '+((S.perfil&&S.perfil.nome)||'') }).eq('id', nid).select().maybeSingle();
  if(u.error) return aviso('Não descartou: '+u.error.message,'erro');
  const n = (S.cartNotas||[]).find(x=>x.id===nid); if(n) Object.assign(n, u.data); aviso('Nota descartada (o motivo ficou registrado).','ok');
}
function notaDigitar(nid){
  abrirModal('<h2>Digitar a nota</h2><div class="lin"><div><label>Fornecedor</label><input id="nd-emi"></div><div><label>Nº da NF</label><input id="nd-num"></div></div>'+
    '<div class="lin"><div><label>Valor total da nota</label><input id="nd-val" type="number" step="0.01"></div><div><label>Data de emissão</label><input id="nd-dat" type="date"></div></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px"><button class="bt" onclick="notaDigitarSalvar(\''+nid+'\')">Salvar e casar</button><button class="bt g" onclick="fecharModal()">Cancelar</button></div>');
}
async function notaDigitarSalvar(nid){
  const v = +val('nd-val'); if(!v) return aviso('Informe o valor.','erro');
  const u = await sb.from('cartao_notas').update({ emitente: val('nd-emi')||null, numero: val('nd-num')||null, valor: v, data: val('nd-dat')||null, status:'sem_compra' }).eq('id', nid).select().maybeSingle();
  if(u.error) return aviso('Não salvou: '+u.error.message,'erro');
  const n = (S.cartNotas||[]).find(x=>x.id===nid); if(n) Object.assign(n, u.data);
  const r = await sb.rpc('cpe_casar_nota', { p_nota: nid, p_quem: (S.perfil&&S.perfil.nome)||'tela' });
  S.modal = null;
  if(r.data > 0){ const f = await sb.from('cartao_notas').select('*').eq('id', nid).maybeSingle(); if(f.data && n) Object.assign(n, f.data); await recarregarMovsNota(nid); aviso('Nota casada ✅ — compra consolidada.','ok'); }
  else aviso('Guardei. Ainda não achei a compra — ela fica em "Notas sem compra" e o robô tenta de novo.','ok');
}
async function recarregarMovsNota(nid){ const r = await sb.from('movimentos').select('*').eq('nota_id', nid); (r.data||[]).forEach(d=>{ const m = S.movimentos.find(x=>x.id===d.id); if(m) Object.assign(m,d); }); render(); }
async function autorizarSemNota(idsTxt, nome){
  const motivo = prompt('Autorizar "'+nome+'" SEM NOTA.\nMotivo (fica registrado):'); if(!motivo) return;
  const ids = idsTxt.split(',').filter(Boolean);
  const r = await sb.from('movimentos').update({ sem_nota_ok: true, sem_nota_por: S.user.id, sem_nota_em: new Date().toISOString(), sem_nota_motivo: motivo }).in('id', ids).select();
  if(r.error) return aviso('Não autorizou: '+r.error.message,'erro');
  (r.data||[]).forEach(d=>{ const m = S.movimentos.find(x=>x.id===d.id); if(m) Object.assign(m,d); });
  aviso('Autorizada sem nota — saiu da cobrança do robô.','ok');
}
var _exObra = null;   // v124: fatura importada pela aba de um cartão da obra
function obraImportarFatura(oid){ abrirExtrato(null, oid); }
async function obraGuardarFatura(origemId){   // v124: cabeçalho da fatura (total impresso + PDF) e o final do cartão novo
  try{
    const ex = _extrato || {}, fat = ex.fat || {}, venc = fat.vencimento || ((ex.linhas||[]).find(l=>l.vencimento)||{}).vencimento;
    const o = S.origens.find(x=>x.id===origemId);
    const fin = String(fat.final || (ex.cab&&ex.cab.conta) || '').replace(/\D/g,'').slice(-4);
    if(o && !o.identificador && fin){ const r = await sb.from('origens').update({ identificador: fin }).eq('id', o.id).select().maybeSingle(); if(!r.error && r.data) Object.assign(o, r.data); }
    if(!venc) return;
    let pdf = null;
    if(ex.arquivo){ const buf = await ex.arquivo.arrayBuffer(); const path = 'faturas/'+origemId+'/'+venc+'-'+Date.now()+'.pdf';
      const up = await sb.storage.from('notas').upload(path, new Blob([buf],{type:'application/pdf'}), { contentType:'application/pdf', upsert:false }); if(!up.error) pdf = path; }
    const reg = { origem_id: origemId, vencimento: venc, total: fat.total!=null ? fat.total : null, via: 'tela',
      movs_existentes: (ex.linhas||[]).filter(l=>l.repetido && l.rep_id).map(l=>l.rep_id) }; if(pdf) reg.pdf_path = pdf;
    const r = await sb.from('cartao_faturas').upsert(reg, { onConflict:'origem_id,vencimento' }).select().maybeSingle();
    if(!r.error && r.data){ S.idad.faturas = (S.idad.faturas||[]).filter(f=>!(f.origem_id===origemId && f.vencimento===venc)); S.idad.faturas.unshift(r.data); }
    S.idad.obraFat = venc; S.idad.obraFil = 'sem';
    try{ const rr = await sb.rpc('cpe_recasar_notas'); if(rr.data>0){ const f = await sb.from('cartao_notas').select('*').order('criado_em',{ascending:false}); S.cartNotas = f.data||S.cartNotas; const mv = await sb.from('movimentos').select('*').not('nota_id','is',null); (mv.data||[]).forEach(d=>{ const m = S.movimentos.find(x=>x.id===d.id); if(m) Object.assign(m,d); }); aviso(rr.data+' compra(s) da fatura casaram com notas já guardadas ✅','ok'); } }catch(e){}   // v131
  }catch(e){ console.warn('fatura', e); }
}

/* ===== v115 (Renato, 19/11/2026): FINANCEIRO DO IDAD — "esse módulo IDAD vai ser 100% auditado".
   Tela própria dentro do Hospital IDAD com tudo que entra e sai do CNPJ do IDAD (extrato BB + caixa da recepção + contas).
   - Transferência entre caixa e banco (categoria "Transferência…") NÃO conta como receita nem despesa: aparece separada.
   - Situação de cada lançamento: pago/recebido, a pagar/a receber, vencido; e "a conferir" (movimentos.conferir).
   - Conferir: marca quem conferiu e quando (movimentos.conferido_por / conferido_em).
   - AUDITORIA: todo inserir/alterar/excluir em movimentos fica gravado em cpe_auditoria (gatilho no banco, ninguém apaga),
     com o antes e o depois, quem fez e quando. Exclusão pode ser restaurada pelo histórico. */
S.ifin = { mes:'', tudo:false, sit:'todos', tipo:'', busca:'', aud:null, audCarregando:false };
const IFIN_SIT = [['todos','Todos'],['pago','Pagos / recebidos'],['aberto','A pagar / a receber'],['vencido','Vencidos'],['conferir','A conferir']];
function icoFinIdad(){ return '<svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">'+icoGrad('gFid')+
  '<rect x="5" y="9" width="38" height="30" rx="5" fill="url(#gFid)" opacity=".3"/><rect x="10" y="27" width="5" height="8" rx="1.5" fill="url(#gFid)"/>'+
  '<rect x="18" y="21" width="5" height="14" rx="1.5" fill="url(#gFid)"/><rect x="26" y="16" width="5" height="19" rx="1.5" fill="url(#gFid)"/>'+
  '<rect x="34" y="12" width="5" height="23" rx="1.5" fill="url(#gFid)"/></svg>'; }
function ifinMovs(){ const e = idadEmpresa(); return e ? S.movimentos.filter(m=>m.empresa_id===e.id && !m.pessoal) : []; }
function ifinTransf(m){ return /^transfer/i.test(m.categoria||''); }
function ifinVencido(m){ return !m.pago && m.vencimento && m.vencimento < hojeISO(); }
function ifinData(m){ return m.pago ? (m.data_pagamento||m.data_movimento) : (m.vencimento||m.data_movimento); }
function ifinResumo(){
  const l = ifinMovs(); if(!l.length) return 'entradas, saídas e contas do IDAD';
  const v = l.filter(ifinVencido).length, c = l.filter(m=>m.conferir).length;
  return l.length+' lançamentos'+(v?' · '+v+' vencido'+(v===1?'':'s'):'')+(c?' · '+c+' a conferir':'');
}
function ifinFiltrados(){
  const mes = S.ifin.mes || mesHoje(), b = permNorm(S.ifin.busca);
  return ifinMovs().filter(m=>{
    if(!S.ifin.tudo && String(ifinData(m)||'').slice(0,7)!==mes && !(S.ifin.sit==='vencido' || S.ifin.sit==='conferir')) return false;
    if(S.ifin.tipo && m.tipo!==S.ifin.tipo) return false;
    const s = S.ifin.sit;
    if(s==='pago' && !m.pago) return false; if(s==='aberto' && m.pago) return false;
    if(s==='vencido' && !ifinVencido(m)) return false; if(s==='conferir' && !m.conferir) return false;
    return !b || [m.descricao,m.fornecedor,m.categoria,m.observacao,nomeOrigem(m.origem_id)].some(x=>permNorm(x).indexOf(b)>=0) || String(m.valor).indexOf(S.ifin.busca.replace(',','.'))>=0;
  }).sort((a,b)=>String(ifinData(b)).localeCompare(String(ifinData(a))));
}
function telaIdadFin(){
  const e = idadEmpresa();
  let h = '<div class="secao"><b>FINANCEIRO DO IDAD</b><span>CNPJ 33.231.594/0001-09 · tudo que entra e sai, com auditoria</span></div>';
  if(!e) return h+'<div class="vazio">O CNPJ do IDAD não está cadastrado (ou este login não tem acesso a ele).</div>';
  const mes = S.ifin.mes || mesHoje(), todos = ifinMovs(), dm = m=>String(ifinData(m)||'').slice(0,7);
  const doMes = todos.filter(m=>S.ifin.tudo || dm(m)===mes), op = doMes.filter(m=>!ifinTransf(m));
  const soma = f => op.filter(f).reduce((a,m)=>a+(+m.valor||0),0);
  const rec = soma(m=>m.tipo==='entrada'&&m.pago), pag = soma(m=>m.tipo==='saida'&&m.pago);

  const sCx = cx ? todos.filter(m=>m.origem_id===cx.id && m.pago).reduce((a,m)=>a+(m.tipo==='entrada'?1:-1)*(+m.valor||0),0) : null;
  const tr = doMes.filter(m=>ifinTransf(m) && m.tipo==='saida').reduce((a,m)=>a+(+m.valor||0),0);
  h += '<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
    '<input type="month" value="'+mes+'" onchange="S.ifin.mes=this.value;S.ifin.tudo=false;render()" style="width:auto;margin:0"'+(S.ifin.tudo?' disabled':'')+'>'+
    '<label style="display:flex;gap:6px;align-items:center;margin:0;text-transform:none;font-size:14px;cursor:pointer"><input type="checkbox" style="width:auto" '+(S.ifin.tudo?'checked':'')+' onchange="S.ifin.tudo=this.checked;render()"> Todos os meses</label>'+
    '<div style="flex:1"></div>'+
    (podeEditar()?'<button class="bt" onclick="ifinAbrir(null,\'entrada\')">+ Entrada</button><button class="bt" onclick="ifinAbrir(null,\'saida\')">+ Saída</button>':'')+
    '<button class="bt g" onclick="irPara(\'idadconc\')">⚖ Conciliação</button><button class="bt g" onclick="ifinAuditoria()">🛡 Auditoria</button></div>';
  h += '<div class="card"><div class="kpis">'+
    kpi('Recebido', '<span style="color:var(--verde)">'+brl(rec)+'</span>')+kpi('Pago', '<span style="color:var(--vermelho)">'+brl(pag)+'</span>')+
    kpi('Resultado do caixa', brl(rec-pag))+kpi('A receber', brl(arec))+kpi('A pagar', brl(apag))+'</div>'+
    '<div class="kpis" style="margin-top:8px">'+
    kpi('Vencidos (todos os meses)', '<span style="color:'+(venc.length?'var(--vermelho)':'inherit')+'">'+venc.length+' · '+brl(venc.reduce((a,m)=>a+(+m.valor||0),0))+'</span>')+
    kpi('A conferir', '<span style="color:'+(conf.length?'#d97706':'inherit')+'">'+conf.length+'</span>')+
    (sCx!=null?kpi('Saldo do caixa da recepção · ESTIMADO', brl(sCx)+'<div style="font-size:11.5px;font-weight:400;color:#7a5a00;margin-top:3px;line-height:1.35">Calculado pelo sistema (entradas − saídas − depósitos). Falta o extrato BB de 01 a 19/10 e a contagem real do caixa.</div>'):'')+
    kpi('Transferido caixa → banco', brl(tr))+'</div>'+
    '<div style="font-size:12px;color:var(--fraco);margin-top:8px">Transferências entre caixa e banco não entram como receita nem como despesa.</div></div>';
  const cats = {}; op.filter(m=>m.tipo==='saida').forEach(m=>{ const k=m.categoria||'Sem categoria'; cats[k]=(cats[k]||0)+(+m.valor||0); });
  const tCat = Object.values(cats).reduce((a,v)=>a+v,0);
  if(tCat) h += '<div class="card"><b style="font-size:14px">Saídas por categoria</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+
    Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<span style="background:var(--campo);border:1px solid var(--linha);border-radius:20px;padding:5px 11px;font-size:12.5px"><b>'+esc(k)+'</b> '+brl(v)+' · '+Math.round(v/tCat*100)+'%</span>').join('')+'</div></div>';
  h += '<div class="card" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
    IFIN_SIT.map(s=>'<button class="bt '+(S.ifin.sit===s[0]?'':'g ')+'mini" onclick="S.ifin.sit=\''+s[0]+'\';render()">'+s[1]+(s[0]==='vencido'&&venc.length?' ('+venc.length+')':'')+(s[0]==='conferir'&&conf.length?' ('+conf.length+')':'')+'</button>').join('')+
    '<select onchange="S.ifin.tipo=this.value;render()" style="width:auto;margin:0 0 0 8px"><option value="">Entradas e saídas</option><option value="entrada"'+(S.ifin.tipo==='entrada'?' selected':'')+'>Só entradas</option><option value="saida"'+(S.ifin.tipo==='saida'?' selected':'')+'>Só saídas</option></select>'+
    '<input id="if-busca" placeholder="Buscar descrição, fornecedor, categoria ou valor" value="'+esc(S.ifin.busca)+'" oninput="S.ifin.busca=this.value;ifinLista()" style="flex:1;min-width:200px;margin:0"></div>';
  return h+'<div id="if-lista">'+ifinListaHtml()+'</div>';
}
function ifinLista(){ const e = document.getElementById('if-lista'); if(e) e.innerHTML = ifinListaHtml(); }
function ifinSituacao(m){
  if(ifinTransf(m)) return ['Transferência','var(--fraco)'];
  if(m.pago) return [m.tipo==='entrada'?'Recebido':'Pago','var(--verde)'];
  if(ifinVencido(m)) return ['Vencido '+dataBR(m.vencimento),'var(--vermelho)'];
  return [(m.tipo==='entrada'?'A receber':'A pagar')+(m.vencimento?' '+dataBR(m.vencimento):''),'#d97706'];
}
function ifinListaHtml(){
  const l = ifinFiltrados();
  if(!l.length) return '<div class="vazio">Nenhum lançamento neste filtro.</div>';
  const tot = l.filter(m=>!ifinTransf(m)).reduce((a,m)=>a+(m.tipo==='entrada'?1:-1)*(+m.valor||0),0);
  return '<div class="card" style="overflow-x:auto;padding:6px 10px"><div style="font-size:12.5px;color:var(--fraco);padding:6px 4px">'+l.length+' lançamento'+(l.length===1?'':'s')+' · saldo do filtro (sem transferências): <b style="color:var(--texto)">'+brl(tot)+'</b></div>'+
    '<table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Origem</th><th style="text-align:right">Valor</th><th>Situação</th><th></th></tr></thead><tbody>'+
    l.map(m=>{ const s = ifinSituacao(m), ent = m.tipo==='entrada';
      return '<tr style="cursor:pointer'+(ifinTransf(m)?';opacity:.65':'')+'" onclick="ifinAbrir(\''+m.id+'\')"><td style="white-space:nowrap">'+dataBR(ifinData(m))+'</td>'+
        '<td><b>'+esc(m.descricao||m.fornecedor||'—')+'</b>'+(m.fornecedor && m.fornecedor!==m.descricao?'<br><small style="color:var(--fraco)">'+esc(m.fornecedor)+'</small>':'')+
          (m.conferir?' <span style="font-size:11px;color:#7a5a00;background:#FFF4CC;border-radius:6px;padding:1px 7px;white-space:nowrap">a conferir</span>':'')+'</td>'+
        '<td>'+esc(m.categoria||'—')+'</td><td style="font-size:12.5px">'+esc(m.origem_id?nomeOrigem(m.origem_id):(m.pago?'Banco do Brasil':'—'))+'</td>'+
        '<td style="text-align:right;font-weight:800;white-space:nowrap;color:'+(ent?'var(--verde)':'var(--vermelho)')+'">'+(ent?'+ ':'− ')+brl(+m.valor)+'</td>'+
        '<td style="white-space:nowrap"><span style="font-weight:700;color:'+s[1]+'">'+s[0]+'</span></td>'+
        '<td style="white-space:nowrap" onclick="event.stopPropagation()">'+(m.conferir && podeEditar()?'<button class="bt g mini" onclick="ifinConferir(\''+m.id+'\')" title="Marcar como conferido">✓ Conferi</button> ':'')+
          '<button class="bt g mini" onclick="ifinHistorico(\''+m.id+'\')" title="Histórico de alterações">🕘</button></td></tr>'; }).join('')+
    '</tbody></table></div>';
}

async function ifinSalvar(){
  const e = idadEmpresa(), id = val('if-id'), g = k => val(k).trim()||null;
  const reg = { tipo: val('if-tipo'), empresa_id: e.id, descricao: g('if-desc'), fornecedor: g('if-forn'), categoria: g('if-cat'),
    valor: Math.round(Number(val('if-valor'))*100)/100, data_movimento: g('if-data')||hojeISO(), vencimento: g('if-venc'),
    pago: document.getElementById('if-pago').checked, data_pagamento: g('if-dpag'), origem_id: val('if-ori')||null,
    observacao: g('if-obs'), conferir: document.getElementById('if-conf').checked, pessoal:false };
  if(!reg.descricao) return aviso('Informe a descrição.','erro');
  if(!(reg.valor>0)) return aviso('Informe o valor.','erro');
  if(reg.pago && !reg.data_pagamento) reg.data_pagamento = hojeISO();
  if(!reg.pago) reg.data_pagamento = null;

/* ===== v117 (Renato, 19/11/2026): CONCILIAÇÃO DO IDAD — base organizada para o confronto de contas (e para o robô auditor depois).

async function iconcPdfLinhas(buf){
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise, out = [];
  for(let p=1; p<=pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent(), L = [];
    tc.items.forEach(it=>{ if(!it.str || !it.str.trim()) return; const y = it.transform[5], x = it.transform[4];
      let l = L.find(z=>Math.abs(z.y-y)<2.5); if(!l) L.push(l = { y, it:[] }); l.it.push({ x, s:it.str }); });
    L.sort((a,b)=>b.y-a.y).forEach(l=>out.push(l.it.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')));
  }
  return out;
}
function iconcNum(s){ const neg = /^\(/.test(s); const v = Number(String(s).replace(/[()]/g,'').replace(/\./g,'').replace(',','.')); return neg ? -v : v; }
/* Relatório Pixeon "GER - Repasse de Caixa Geral": devolve {linhas, totalMed, totalIdad, totMedRel, totIdadRel, ini, fim} */
function iconcPixeon(linhasTxt){
  const recs = []; let forma = null, aux = null, cur = null, totRel = null, per = null;
  linhasTxt.forEach(ln=>{
    let m;
    if((m = ln.match(/OS - Data\/Hora:\s*(\d\d)\/(\d\d)\/(\d{4})\s*a\s*(\d\d)\/(\d\d)\/(\d{4})/))) per = [m[3]+'-'+m[2]+'-'+m[1], m[6]+'-'+m[5]+'-'+m[4]];
    if((m = ln.match(/Forma_Pag:\s*(\S+)/))){ forma = /cart/i.test(m[1]) ? 'cartao' : 'especie'; return; }
    if((m = ln.match(/Auxiliar:\s*(.+?)\s+Setor/))){ if(cur){ recs.push(cur); cur = null; } aux = m[1].trim(); return; }
    if(/^\s*Total:/.test(ln)){ const n = ln.match(/-?[\d\.]+,\d\d/g); if(n && n.length>=3) totRel = n.map(iconcNum); return; }
    if(/^\s*(Pixeon|CLINICA|GER -|OS -|Dt\. OS|Valor_Cart|SubTotal|Movimento de Caixa)/.test(ln) || !ln.trim()) return;
    if((m = ln.match(/^\s*(\d\d)\/(\d\d)\/(\d{4})/))){ if(cur) recs.push(cur); cur = { forma, data:m[3]+'-'+m[2]+'-'+m[1], aux, txt:ln }; }
    else if(cur) cur.txt += ' '+ln;
  });
  if(cur) recs.push(cur);
  const num = '\\(?-?[\\d\\.]+,\\d\\d\\)?', pat = new RegExp('(0,00)\\s+('+num+')\\s+('+num+')\\s+([A-Z][A-Z \\.]+?)\\s*('+num+')','g');
  const out = [], falhas = [];
  recs.forEach(r=>{
    const t = r.txt.replace(/\s+/g,' '), ms = [...t.matchAll(pat)];
    if(!ms.length){ falhas.push(t); return; }
    const pm = t.match(/^\d\d\/\d\d\/\d{4}\s*(\d+)\s+([A-ZÇÃÕÉÍÓÚÂÊÔ ]+?)\s*126/);
    ms.forEach(m=>{ let c = m[4].trim(), b = null; if(/^PARTICULAR./.test(c)){ b = c.slice(10).trim(); c = 'PARTICULAR'; }
      const med = iconcNum(m[2]), idd = iconcNum(m[3]);
      out.push({ data:r.data, forma:r.forma, profissional:r.aux, convenio:c, bandeira:b, parte_medico:med, parte_idad:idd, valor_bruto:Math.round((med+idd)*100)/100,
        ref_externa:pm?pm[1]:null, paciente:pm?pm[2].trim():null }); });
  });
  // linha que o padrão não pega (convênio colado no valor, ex.: "DR SAUDE CENT MEDICO0,00")
  falhas.slice().forEach((t,i)=>{ const m = t.match(/0,00\s+([\d\.]+,\d\d)\s+([\d\.]+,\d\d)\s+([A-Z][A-Z \.]+?)(-?[\d\.]+,\d\d)\s*$/);
    if(m){ const r = recs.find(x=>x.txt.replace(/\s+/g,' ')===t), med = iconcNum(m[1]), idd = iconcNum(m[2]);
      out.push({ data:r.data, forma:r.forma, profissional:r.aux, convenio:m[3].trim(), bandeira:null, parte_medico:med, parte_idad:idd, valor_bruto:Math.round((med+idd)*100)/100, ref_externa:null, paciente:null });
      falhas[i] = null; } });
  const r2 = v=>Math.round(v*100)/100;
  return { linhas:out, falhas:falhas.filter(Boolean), ini:per&&per[0], fim:per&&per[1],
    totalMed:r2(out.reduce((a,x)=>a+x.parte_medico,0)), totalIdad:r2(out.reduce((a,x)=>a+x.parte_idad,0)),
    totMedRel: totRel ? totRel[1] : null, totIdadRel: totRel ? totRel[2] : null };
}
/* Vendas Stone (Excel/CSV): cabeçalho com STONE ID, DATA DA VENDA, BANDEIRA, N (parcelas), VALOR BRUTO, VALOR LIQUIDO, DOCUMENTO */
function iconcStone(aoa){
  const norm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
  const hi = aoa.findIndex(r=>r.some(c=>/STONE ?ID/.test(norm(c))) && r.some(c=>/VALOR BRUTO/.test(norm(c))));
  if(hi<0) return { erro:'Não achei o cabeçalho da Stone (colunas STONE ID e VALOR BRUTO).' };
  const H = aoa[hi].map(norm), col = re => H.findIndex(h=>re.test(h));
  const c = { doc:col(/^DOCUMENTO/), data:col(/^DATA DA V/), band:col(/^BANDEIRA/), prod:col(/^PRODUTO/), id:col(/^STONE ?ID/), parc:col(/^N(\.|º|O)?$|PARCELA/), bruto:col(/^VALOR BRUTO/), liq:col(/^VALOR LIQ/) };
  const dt = v => { if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d = new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
    const m = String(v).match(/(\d\d)\/(\d\d)\/(\d{4})/); return m ? m[3]+'-'+m[2]+'-'+m[1] : null; };
  const nv = v => typeof v==='number' ? v : iconcNum(String(v).trim());
  const out = []; let docs = {};
  aoa.slice(hi+1).forEach(r=>{ if(!r || r[c.id]==null || r[c.id]==='') return; const d = dt(r[c.data]); if(!d) return;
    if(c.doc>=0) docs[String(r[c.doc]).replace(/\D/g,'')] = 1;
    out.push({ data:d, ref_externa:String(r[c.id]).trim(), bandeira:c.band>=0?String(r[c.band]).trim():null, forma:'cartao', item:c.prod>=0?String(r[c.prod]).trim():null,
      parcelas:c.parc>=0?(parseInt(r[c.parc])||1):1, valor_bruto:Math.round(nv(r[c.bruto])*100)/100, valor_liquido:Math.round(nv(r[c.liq])*100)/100 }); });
  return { linhas:out, docs:Object.keys(docs) };
}

async function convCarregar(){
  if(S.conv.carregando) return; S.conv.carregando = true;
  try{ const r = await sb.from('idad_convenios').select('*').order('convenio').order('procedimento').order('vigencia_inicio');
       if(r.error) S.conv.erro = r.error.message; else { S.conv.lista = r.data||[]; S.conv.erro = null; } }catch(e){ S.conv.erro = e.message; }
  S.conv.carregando = false; S.conv.carregado = true;
  if((S.tela==='idadconv' || S.tela==='idad' || S.tela==='fichario') && !cpeOcupado()) render();
}
function convVigentes(){ const h = hojeISO(); return S.conv.lista.filter(x=>!x.vigencia_fim || x.vigencia_fim>=h); }

function convProcRot(p, e){ return p+(e?' – '+e:''); }
function convResumo(){
  if(!S.conv.carregado){ if(!S.conv.carregando) convCarregar(); return 'carregando…'; }
  const v = convVigentes(), n = convNomes().length, ad = v.filter(x=>x.situacao==='a_definir').length;
  return v.length ? n+' convênio'+(n===1?'':'s')+' · '+v.length+' valores'+(ad?' · '+ad+' a definir':'') : 'tabela de preço por convênio';
}
/* Valor em vigor na data do atendimento. Se a data for anterior à primeira tabela, usa a mais antiga (e avisa). */
function convAchar(conv, proc, esp, data){
  const n = permNorm, l = S.conv.lista.filter(x=>n(x.convenio)===n(conv) && n(x.procedimento)===n(proc) && n(x.especialidade)===n(esp));
  if(!l.length) return null;
  const d = data || hojeISO();
  const ok = l.filter(x=>x.vigencia_inicio<=d && (!x.vigencia_fim || x.vigencia_fim>=d)).sort((a,b)=>b.vigencia_inicio.localeCompare(a.vigencia_inicio));
  if(ok.length) return { r: ok[0], antes:false };
  const ant = l.slice().sort((a,b)=>a.vigencia_inicio.localeCompare(b.vigencia_inicio))[0];
  return d < ant.vigencia_inicio ? { r: ant, antes:true } : null;
}

function convProducaoHtml(){
  const mes = S.conv.mes || mesHoje(), fs = S.fich.lista.filter(f=>String(f.data_consulta||'').slice(0,7)===mes);
  const com = fs.filter(f=>f.convenio), sem = fs.length-com.length, g = {};
  com.forEach(f=>{ const k = f.convenio; g[k] = g[k] || { n:0, t:0, m:0, h:0, sv:0, div:false, p:{} }; const x = g[k];
    x.n++; x.t += +f.valor_total||0; x.m += +f.valor_medico||0; x.h += +f.valor_hospital||0; if(f.valor_total==null) x.sv++; if(f.valor_medico!=null) x.div = true;
    const pr = convProcRot(f.procedimento||'?', f.especialidade); x.p[pr] = (x.p[pr]||0)+1; });
  const tot = Object.values(g).reduce((a,x)=>({ n:a.n+x.n, t:a.t+x.t, m:a.m+x.m, h:a.h+x.h }), { n:0, t:0, m:0, h:0 });
  let h = '<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><b style="font-size:15px">Produção por convênio</b>'+

    '<span style="font-size:12.5px;color:var(--fraco)">a partir das fichas do Fichário com convênio informado</span></div>';
  if(!S.fich.carregado) return h+'<div style="color:var(--fraco)">Carregando as fichas…</div></div>';
  if(!com.length) return h+'<div style="color:var(--fraco);font-size:13.5px">Nenhuma ficha deste mês com convênio informado'+(sem?' ('+sem+' ficha'+(sem===1?'':'s')+' do mês sem convênio — informe em Fichário › Corrigir)':'')+'.</div></div>';
  h += '<div class="kpis" style="margin-bottom:10px">'+kpi('Atendimentos', String(tot.n))+kpi('Total a receber', brl(tot.t))+kpi('Parte dos médicos', brl(tot.m))+kpi('Parte do hospital', brl(tot.h))+'</div>';
  h += '<div style="overflow-x:auto"><table><thead><tr><th>Convênio</th><th>Atendimentos</th><th style="text-align:right">Total</th><th style="text-align:right">Médico</th><th style="text-align:right">Hospital</th></tr></thead><tbody>'+
    Object.entries(g).sort((a,b)=>b[1].t-a[1].t).map(([k,x])=>'<tr><td><b>'+esc(k)+'</b>'+(x.sv?'<br><small style="color:#d97706">'+x.sv+' sem valor na tabela</small>':'')+'</td>'+
      '<td>'+x.n+'<br><small style="color:var(--fraco)">'+esc(Object.entries(x.p).map(([p,n])=>n+' '+p).join(' · '))+'</small></td>'+
      '<td style="text-align:right;font-weight:800">'+brl(x.t)+'</td><td style="text-align:right">'+(x.div?brl(x.m):'—')+'</td><td style="text-align:right">'+(x.div?brl(x.h):'—')+'</td></tr>').join('')+
    '</tbody></table></div>'+(sem?'<div style="margin-top:8px;font-size:12.5px;color:#7a5a00">'+sem+' ficha'+(sem===1?'':'s')+' deste mês ainda sem convênio — informe em Fichário › Corrigir.</div>':'')+'</div>';
  return h;
}

function convCalc(){ const t = Number(val('cv-tot')), m = Number(val('cv-med')), h = document.getElementById('cv-hos');
  if(h && t>0 && val('cv-med')!=='' && m<=t) h.value = (Math.round((t-m)*100)/100).toFixed(2); }
async function convSalvar(){
  const id = val('cv-id'), g = k => val(k).trim()||null, n = k => val(k)==='' ? null : Math.round(Number(val(k))*100)/100;
  const reg = { convenio:(g('cv-conv')||'').toUpperCase()||null, procedimento:g('cv-proc'), especialidade:g('cv-esp'), valor_total:n('cv-tot'), valor_medico:n('cv-med'), valor_hospital:n('cv-hos'),
    situacao:val('cv-sit')||'ativo', codigo_tuss:g('cv-tuss'), vigencia_inicio:g('cv-ini'), obs:g('cv-obs') };
  if(!reg.convenio || !reg.procedimento) return aviso('Informe o convênio e o procedimento.','erro');
  if(!reg.vigencia_inicio) return aviso('Informe a data a partir da qual o valor vale.','erro');
  if(reg.situacao==='ativo'){
    if(!(reg.valor_total>0) || reg.valor_medico==null || reg.valor_hospital==null) return aviso('Valor ativo precisa do total, da parte do médico e da parte do hospital.','erro');
    if(Math.abs(reg.valor_medico+reg.valor_hospital-reg.valor_total) > 0.02) return aviso('Médico + hospital ('+brl(reg.valor_medico+reg.valor_hospital)+') não fecha com o total ('+brl(reg.valor_total)+').','erro');
  }
  const reaj = id && document.getElementById('cv-novavig') && document.getElementById('cv-novavig').checked;
  let r;
  if(reaj){
    const ant = S.conv.lista.find(c=>c.id===id);
    if(!ant || reg.vigencia_inicio <= ant.vigencia_inicio) return aviso('No reajuste, a nova data tem que ser depois de '+dataBR(ant?ant.vigencia_inicio:'')+'.','erro');
    const d = new Date(reg.vigencia_inicio+'T12:00:00'); d.setDate(d.getDate()-1);
    const fim = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    r = await sb.from('idad_convenios').insert(reg).select().maybeSingle();
    if(r.error) return aviso('Não gravou: '+r.error.message,'erro');
    const r2 = await sb.from('idad_convenios').update({ vigencia_fim: fim }).eq('id', id);
    if(r2.error) aviso('O valor novo foi gravado, mas o anterior não foi encerrado: '+r2.error.message,'erro');
  } else {
    r = id ? await sb.from('idad_convenios').update(reg).eq('id', id).select().maybeSingle() : await sb.from('idad_convenios').insert(reg).select().maybeSingle();
    if(r.error) return aviso(/duplicate|unique/i.test(r.error.message) ? 'Já existe esse convênio e procedimento com essa data. Abra o que já existe para alterar.' : 'Não gravou: '+r.error.message,'erro');
  }
  S.modal = null; S.conv.carregado = false; await convCarregar(); aviso(reaj ? 'Reajuste gravado — o valor anterior ficou no histórico.' : 'Valor salvo.','ok');
}
async function convExcluir(id){
  const usado = S.fich.lista.some(f=>f.conv_id===id);
  if(!confirm(usado ? 'Este valor já está em fichas lançadas (elas guardam o valor). Excluir mesmo assim da tabela?' : 'Excluir este valor da tabela?')) return;
  const r = await sb.from('idad_convenios').delete().eq('id', id); if(r.error) return aviso('Não excluiu: '+r.error.message,'erro');
  S.conv.lista = S.conv.lista.filter(c=>c.id!==id); S.modal = null; aviso('Valor excluído.','ok');
}

async function fichFotos(inp){
  const arqs = Array.from((inp && inp.files) || []); if(!arqs.length) return;
  const st = t=>{ S.fich.st = t; const e = document.getElementById('fi-st'); if(e) e.innerHTML = t; };
  const paginas = [], med = fichMedSel();
  try{
    st('Preparando as fotos…');
    for(const f of arqs.slice(0,30)){
      const buf = await f.arrayBuffer(); if(!buf.byteLength) throw new Error('a foto veio vazia do seletor — tente pela Galeria');
      if(f.type==='application/pdf' || /\.pdf$/i.test(f.name||'')) (await saldoPdfImagens(buf.slice(0))).forEach(x=>paginas.push(x));
      else paginas.push({ b64: await saldoImgJpeg(new Blob([buf],{type:f.type||'image/jpeg'})), mime:'image/jpeg' });
    }
    let ok = 0, falhas = [];
    for(let i=0; i<paginas.length; i++){
      st('Lendo a ficha '+(i+1)+' de '+paginas.length+'… (uns 10 a 30 segundos cada)');
      try{
        const { data, error } = await sb.functions.invoke('ler-ficha', { body: { imagem: paginas[i] } });
        if(error){ let m = error.message; try{ const j = await error.context.json(); m = j.error || m; }catch(e){} throw new Error(m); }
        if(data && data.error) throw new Error(data.error);
        const bin = atob(paginas[i].b64), u8 = new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u8[k] = bin.charCodeAt(k);
        const path = 'fichario/'+Date.now()+'-'+i+'.jpg';
        const up = await sb.storage.from('notas').upload(path, new Blob([u8],{type:'image/jpeg'}), { contentType:'image/jpeg', upsert:false });
        if(up.error) throw new Error('a foto não subiu: '+up.error.message);
        const reg = Object.assign({}, data.ficha, { foto_path: path, duvidas: data.duvidas||[] });
        if(!reg.medico_crm){ reg.medico_nome = med.nome; reg.medico_crm = med.crm; }
        const r = await sb.from('fichas').insert(reg).select().maybeSingle();
        if(r.error) throw new Error(r.error.message);
        S.fich.lista.unshift(r.data); ok++; fichLista();
      }catch(e){ falhas.push('foto '+(i+1)+': '+(e.message||e)); }
    }
    st(ok ? '<span style="color:var(--verde,#0f9d58)">✔ '+ok+' ficha'+(ok===1?'':'s')+' lida'+(ok===1?'':'s')+' e guardada'+(ok===1?'':'s')+'. Confira os campos marcados em amarelo.</span>'+(falhas.length?' <span style="color:var(--vermelho)">✖ '+esc(falhas.join(' · '))+'</span>':'')
             : '<span style="color:var(--vermelho)">✖ '+esc(falhas.join(' · '))+'</span>');
  }catch(e){ st('<span style="color:var(--vermelho)">✖ '+esc(e.message||e)+'</span>'); }
  finally{ if(inp) inp.value = ''; }
}

function fichConvProcs(){

function fichConvLer(data){
  const c = val('fe-conv'), pk = val('fe-proc');
  const vazio = { convenio:null, procedimento:null, especialidade:null, conv_id:null, valor_total:null, valor_medico:null, valor_hospital:null };
  if(!document.getElementById('fe-conv') || !c) return { campos: vazio };
  if(!pk) return { erro:'Escolha o procedimento do convênio (ou deixe "sem convênio").' };
  const p = pk.split('|'), base = Object.assign({}, vazio, { convenio:c, procedimento:p[0], especialidade:p[1]||null });
  if(c==='Particular'){ const v = val('fe-valor')==='' ? null : Math.round(Number(val('fe-valor'))*100)/100;
    if(v!=null && !(v>=0)) return { erro:'Valor particular inválido.' }; base.valor_total = v; return { campos: base }; }
  const a = convAchar(c, p[0], p[1]||null, data);
  if(a){ const x = a.r; base.conv_id = x.id; base.valor_total = x.valor_total; base.valor_medico = x.situacao==='ativo' ? x.valor_medico : null; base.valor_hospital = x.situacao==='ativo' ? x.valor_hospital : null; }
  return { campos: base };
}

async function fichBaixar(qual){

  const rows = [['Nº da ficha','Nome completo','Data da consulta','Data de nascimento','Idade','Sexo','CPF','CNS','Telefone','Nome da mãe','Endereço','Queixa principal','Convênio','Procedimento','Valor total','Parte do médico','Parte do hospital','Médico','CRM do médico']]

  const ws = XLSX.utils.aoa_to_sheet(rows);
  for(let r=1; r<rows.length; r++) ['C','D'].forEach(c=>{ const cel = ws[c+(r+1)]; if(cel && cel.t==='n') cel.z = 'dd/mm/yyyy'; });
  for(let r=1; r<rows.length; r++) ['O','P','Q'].forEach(c=>{ const cel = ws[c+(r+1)]; if(cel && cel.t==='n') cel.z = '"R$" #,##0.00'; });
  ws['!cols'] = [11,32,16,18,7,6,17,21,17,28,48,40,24,26,13,14,14,32,14].map(w=>({ wch:w }));
  ws['!autofilter'] = { ref: 'A1:S'+rows.length };
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Fichas');
  const nome = l.length===1 && qual!=='todas' ? 'Ficha - '+String(l[0].nome||'paciente').replace(/[\\\/:*?"<>|]/g,'') : 'Fichario - '+l.length+' ficha'+(l.length===1?'':'s')+' - '+hojeISO().split('-').reverse().join('-');
  /* v110 (Renato, 18/11/2026: "não está baixando o Excel"): no app Android e no iPhone o download direto (blob) não funciona.
     Agora o Excel sobe para o armazenamento e abre por um link de download normal — funciona no app, no celular e no computador. */
  aviso('Preparando o Excel…','ok');
  try{
    const bin = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const nomeDl = nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'')+'.xlsx';
    const arq = nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\- ]/g,'').replace(/\s+/g,'_')+'.xlsx';
    const path = 'fichario/exportacoes/'+Date.now()+'-'+arq;
    const up = await sb.storage.from('notas').upload(path, new Blob([bin],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), { upsert:false });
    if(up.error) throw new Error(up.error.message);
    const { data, error } = await sb.storage.from('notas').createSignedUrl(path, 3600, { download: nomeDl });
    if(error || !data) throw new Error(error ? error.message : 'sem link');
    S.msg = null; _fichLink = data.signedUrl;
    abrirModal('<h2 style="margin:0 0 6px">⬇ Excel pronto</h2><div style="color:var(--fraco);font-size:13.5px;margin-bottom:12px">'+esc(nome)+'.xlsx · '+l.length+' ficha'+(l.length===1?'':'s')+'</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="bt" onclick="fichAbrirLink()">⬇ Baixar o Excel</button>'+
      '<button class="bt g" onclick="fecharModal()">Fechar</button></div>'+
      '<div style="font-size:12px;color:var(--fraco);margin-top:10px">O arquivo vai para a pasta Downloads do aparelho. O link vale por 1 hora.</div>');
  }catch(e){
    try{ XLSX.writeFile(wb, nome+'.xlsx'); S.msg = null; render(); }catch(e2){ aviso('Não gerou o Excel: '+(e.message||e),'erro'); }
  }

function prodSomar(lista){

/* ===== v78 (12/11/2026): "🧾 Saldo e comprovantes" dentro do Financeiro (NAFS / ANESTESIA) =====
   Pedido do Renato: um valor de partida (ex.: transferência de R$ 30.000 recebida da NAFS) que vai sendo
   descontado pelos comprovantes e extratos (lidos por foto/PDF pela Edge Function ler-comprovante) e por
   lançamentos à mão (ajustes). Tabela fin_saldo_mov, separada por grupo. Só mestre e dono.
   Regra do saldo: vale a partir do ÚLTIMO "valor de partida" (Recomeçar saldo abre um ciclo novo).
   partida/aporte/entrada somam, saída desconta, ajuste soma ou desconta pelo sinal. */
function podeEditarSaldo(){ return podeEditar() || ehAdm1(); }   // v85: ADM_Nivel 1 com o Saldo marcado também lança
S.saldo = { grupo:'', movs:[], carregado:false, erro:'', leitura:null, verAnt:false };
const SALDO_TIPOS = { partida:'Valor de partida', aporte:'Aporte', entrada:'Entrada', saida:'Saída', ajuste:'Ajuste manual' };
async function saldoCarregar(){
  const g = escGrupo();
  const r = await sb.from('fin_saldo_mov').select('*').eq('grupo', g).order('data').order('created_at');
  S.saldo.grupo = g; S.saldo.carregado = true;
  if(r.error){ S.saldo.movs = []; S.saldo.erro = r.error.message; return; }
  S.saldo.movs = r.data || []; S.saldo.erro = '';
}
function saldoPronto(){ return S.saldo.carregado && S.saldo.grupo===escGrupo(); }
function saldoSinal(m){ const v = Number(m.valor)||0; if(m.tipo==='saida') return -Math.abs(v); if(m.tipo==='ajuste') return v; return Math.abs(v); }
function saldoOrd(a,b){ return String(a.data).localeCompare(String(b.data)) || String(a.hora||'').localeCompare(String(b.hora||'')) || String(a.created_at||'').localeCompare(String(b.created_at||'')); }
/* ciclo atual = do último "partida" em diante */
function saldoCiclo(){
  const t = S.saldo.movs.slice().sort(saldoOrd);
  let i0 = -1; t.forEach((m,i)=>{ if(m.tipo==='partida') i0 = i; });
  const atual = i0>=0 ? t.slice(i0) : t, ant = i0>0 ? t.slice(0,i0) : [];
  let s = 0; const comSaldo = atual.map(m=>{ s += saldoSinal(m); return Object.assign({ _saldo:s }, m); });
  const part = atual.filter(m=>m.tipo==='partida').reduce((a,m)=>a+Math.abs(+m.valor||0),0);
  const mais = atual.filter(m=>m.tipo==='aporte'||m.tipo==='entrada'||(m.tipo==='ajuste'&&+m.valor>0)).reduce((a,m)=>a+Math.abs(+m.valor||0),0);
  const menos = atual.filter(m=>m.tipo==='saida'||(m.tipo==='ajuste'&&+m.valor<0)).reduce((a,m)=>a+Math.abs(+m.valor||0),0);
  return { lista:comSaldo, ant, partida:part, mais, menos, saldo:s, inicio: atual[0] ? atual[0].data : null, nSaidas: atual.filter(m=>m.tipo==='saida').length };
}
function saldoCaixa(){
  const pronto = saldoPronto(), c = pronto ? saldoCiclo() : null;
  const desc = !pronto ? 'Valor de partida descontado pelos extratos e comprovantes'
    : !S.saldo.movs.length ? 'Lance o valor de partida e vá descontando pelos comprovantes e extratos'
    : 'Valor de partida descontado pelos extratos e comprovantes · saldo atual <b style="color:'+(c.saldo>=0?'var(--verde)':'var(--vermelho)')+'">'+brl(c.saldo)+'</b>';
  return '<div class="bxs" style="margin-bottom:12px">'+saldoBotao(desc)+'</div>';
}

  return '<button type="button" class="bx" onclick="irPara(\'saldo\')"><div class="ic">💵</div><div><b>Saldo terceirizado</b><small>'+desc+'</small></div><span class="seta">›</span></button>';

  if(!saldoPronto()){ saldoCarregar().then(render).catch(e=>{ S.saldo.carregado=true; S.saldo.grupo=escGrupo(); S.saldo.erro=e.message; render(); }); return '<div class="vazio">Carregando o saldo…</div>'; }
  if(S.saldo.erro) return '<div class="card"><b style="color:var(--vermelho)">Não consegui abrir o saldo.</b><div style="font-size:13px;margin-top:6px;color:var(--fraco)">'+esc(S.saldo.erro)+'</div></div>';
  const c = saldoCiclo(), g = escGrupo();
  let h = '<div class="secao"><b>SALDO TERCEIRIZADO · '+esc(g)+'</b><span>'+(c.inicio?'desde '+dataBR(c.inicio):'ainda sem valor de partida')+'</span></div>';
  if(!S.saldo.movs.length){
    if(!podeEditarSaldo()) return h+'<div class="card"><div class="vazio">Ainda não há valor de partida lançado.</div></div>';
    return h+'<div class="card"><div class="aviso">Comece lançando o <b>valor de partida</b> — pode ser lido do comprovante da transferência recebida ou digitado à mão. Depois, cada comprovante ou extrato de pagamento vai sendo descontado.</div>'+
      '<div class="acoes"><button class="bt" onclick="saldoAbrirLeitura(\'partida\')">📷 Ler comprovante da partida</button><button class="bt g" onclick="saldoAbrirManual(null,\'partida\')">✍️ Digitar valor de partida</button></div></div>';
  }
  const pct = c.partida+c.mais>0 ? Math.max(0, Math.min(100, c.saldo/(c.partida+c.mais)*100)) : 0;
  h += '<div class="card">'+
    '<div class="sl"><span>Valor de partida'+(c.inicio?' · '+dataBR(c.inicio).slice(0,5):'')+'</span><b>'+brl(c.partida)+'</b></div>'+
    (c.mais>0.004 ? '<div class="sl"><span>Aportes e entradas</span><b style="color:var(--verde)">+ '+brl(c.mais)+'</b></div>' : '')+
    '<div class="sl"><span>Descontado ('+c.nSaidas+' comprovante'+(c.nSaidas===1?'':'s')+')</span><b style="color:var(--vermelho)">− '+brl(c.menos)+'</b></div>'+
