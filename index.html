/* ---------- pagamentos no Painel ---------- */
async function escLancarPainel(){
  const vis = escLocaisVis().map(l=>l.id);
  const trab = escDoMes().filter(d=>vis.indexOf(d.local_id)>=0 && escTrabalho(d) && d.anestesista_id && (Number(d.valor)||0)>0);
  const g = {};
  trab.forEach(d=>{ const k = d.anestesista_id+'|'+(d.empresa_id||''); const x = g[k] = g[k] || { anes:d.anestesista_id, emp:d.empresa_id||null, n:0, total:0 }; x.n++; x.total += Number(d.valor)||0; });
  const ks = Object.keys(g); if(!ks.length) return alert('Nenhum dia com anestesista e valor neste mês.');
  if(ks.some(k=>!g[k].emp) && !confirm('Tem dia sem CNPJ definido — esses pagamentos vão para "Apontar depois". Continuar?')) return;
  if(!confirm('Lançar '+ks.length+' pagamento(s) de '+escMesNome(S.mes)+' ('+S.esc.hosp+') no Painel como saídas a pagar?')) return;
  let feitos=0, pulados=0;
  for(const k of ks){
    const x = g[k], a = escAnes(x.anes) || { nome:'?' };
    const desc = 'Escala anestesia '+escMesNome(S.mes)+' — '+S.esc.hosp+' — '+a.nome+' ('+x.n+' dia'+(x.n>1?'s':'')+')';
    if(S.movimentos.some(m=>m.categoria==='Escala anestesia' && m.descricao===desc && (m.empresa_id||null)===x.emp)){ pulados++; continue; }
    const reg = { tipo:'saida', empresa_id:x.emp, valor: Math.round(x.total*100)/100, data_movimento: escUltimoDia(S.mes),
      fornecedor: a.nome, categoria:'Escala anestesia', descricao: desc, pago:false, criado_por: S.user.id };
    const r = await sb.from('movimentos').insert(reg).select().maybeSingle();
    if(r.error) return aviso('Parou num erro: '+r.error.message,'erro');
    S.movimentos.unshift(r.data); feitos++;
  }
  aviso(feitos+' pagamento(s) lançado(s) no Painel'+(pulados?' · '+pulados+' já existia(m)':'')+'.','ok');
}


/* ===== v43: app instalável — service worker (não guarda cache) + botão/aviso de instalar ===== */
var _cpeInstalar = null;
try{ if('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{})); }catch(e){}
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); _cpeInstalar = e; cpeBotaoInstalar(); });
function cpeJaInstalado(){ try{ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }catch(e){ return false; } }
function cpeEhIOS(){ const u = navigator.userAgent||''; return /iPhone|iPad|iPod/i.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints>1); }
function cpeBotaoInstalar(){
  if(cpeJaInstalado()) return;
  let b = document.getElementById('cpe-instalar');
  if(!b){ b = document.createElement('button'); b.id='cpe-instalar'; b.className='bt';
    b.style.cssText='position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:900;box-shadow:0 4px 14px rgba(0,0,0,.25)';
    b.textContent='📲 Instalar o app'; b.onclick=cpeInstalar; document.body.appendChild(b); }
}
async function cpeInstalar(){
  if(_cpeInstalar){ _cpeInstalar.prompt(); try{ await _cpeInstalar.userChoice; }catch(e){} _cpeInstalar=null; const b=document.getElementById('cpe-instalar'); if(b) b.remove(); return; }
  abrirModal('<h2>📲 Instalar o CPE</h2>'+(cpeEhIOS()
    ? '<div class="aviso"><b>No iPhone / iPad (pelo Safari):</b><br>1. Toque no botão <b>Compartilhar</b> (quadrado com a seta para cima ⬆️).<br>2. Role e toque em <b>"Adicionar à Tela de Início"</b>.<br>3. Toque em <b>Adicionar</b>.<br><br>O ícone do CPE aparece na tela do celular e abre como aplicativo, sem a barra do navegador.<br><small>Se estiver no Chrome do iPhone, abra este mesmo link no <b>Safari</b>.</small></div>'
    : '<div class="aviso"><b>No Android (Chrome):</b><br>1. Toque nos <b>três pontinhos ⋮</b> no canto de cima.<br>2. Toque em <b>"Instalar app"</b> ou <b>"Adicionar à tela inicial"</b>.<br>3. Confirme.</div>')+
    '<div style="margin-top:12px"><button class="bt" onclick="fecharModal()">Entendi</button></div>');
}
window.addEventListener('load', ()=>{ if(cpeEhIOS() && !cpeJaInstalado()) cpeBotaoInstalar(); });

/* ===== v44: tela inicial em CAIXAS (como o sistema da RF) =====
   Financeiro: caixa "CNPJs" (abre as empresas) + Apontar depois, Cartões e contas, Nomes.
   Escala: caixa "Escala" → dentro: NAFS (Add plantão) e Escalas. Cadastros: Empresas, Usuários. */
const CPE_TELAS = {
  painel:{t:'CNPJs', pai:'inicio'}, fila:{t:'Apontar depois', pai:'inicio'}, nomes:{t:'Nomes', pai:'inicio'}, origens:{t:'Cartões e contas', pai:'inicio'},
  empresas:{t:'Empresas', pai:'inicio'}, usuarios:{t:'Usuários', pai:'inicio'},
  escalahub:{t:'Escala', pai:'inicio'}, escala:{t:'NAFS · Add plantão', pai:'escalahub'}, escalas:{t:'Escalas', pai:'escalahub'}
};
function cpeTrilha(){
  if(S.tela==='inicio') return '<div style="height:8px"></div>';
  const cam = []; let t = S.tela, g = 0;
  while(t && t!=='inicio' && CPE_TELAS[t] && g++<5){ cam.unshift(t); t = CPE_TELAS[t].pai; }
  const pai = (CPE_TELAS[S.tela]||{}).pai || 'inicio';
  return '<div class="trilha"><button class="bt g" onclick="irPara(\''+pai+'\')">‹ Voltar</button>'+
    '<span class="cam"><a href="#" onclick="irPara(\'inicio\');return false">Início</a>'+
    cam.map((x,i)=>' › '+(i===cam.length-1 ? '<b>'+CPE_TELAS[x].t+'</b>' : '<a href="#" onclick="irPara(\''+x+'\');return false">'+CPE_TELAS[x].t+'</a>')).join('')+'</span></div>';
}
function cpeCaixa(id, ic, titulo, desc, bad){
  return '<button type="button" class="bx" onclick="irPara(\''+id+'\')"><div class="ic">'+ic+'</div>'+(bad?'<span class="bad">'+bad+'</span>':'')+
    '<div><b>'+titulo+'</b><small>'+desc+'</small></div><span class="seta">›</span></button>';
}
function telaInicio(){
  const nf = fila().length, ne = S.empresas.length;
  let h = '<div class="secao"><b>FINANCEIRO</b><span>Entradas, saídas e contas de cada CNPJ</span></div><div class="bxs">'+
    cpeCaixa('painel','🏢','CNPJs', ne+' empresa'+(ne===1?'':'s')+': entradas, saídas, contas a pagar e saldo do mês')+
    cpeCaixa('fila','📌','Apontar depois','Lançamentos que ainda falta dizer de qual CNPJ são', nf||'')+
    cpeCaixa('origens','💳','Cartões e contas','Cartões, contas bancárias e importação de extrato / fatura')+
    cpeCaixa('nomes','🏷️','Nomes','Fornecedores e nomes que o sistema já aprendeu')+
  '</div>';
  h += '<div class="secao"><b>ESCALA</b><span>Anestesistas, plantões e escalas dos hospitais</span></div><div class="bxs">'+
    cpeCaixa('escalahub','🩺','Escala','NAFS (adicionar plantão) e escalas por hospital e por anestesista')+
  '</div>';
  h += '<div class="secao"><b>CADASTROS</b><span>Empresas e quem usa o sistema</span></div><div class="bxs">'+
    cpeCaixa('empresas','🏛️','Empresas','Cadastro dos CNPJs')+
    (podeUsuarios()? cpeCaixa('usuarios','👥','Usuários','Quem acessa e o que cada um pode fazer') : '')+
  '</div>';
  return h;
}
function telaEscalaHub(){
  return '<div class="secao"><b>ESCALA</b><span>'+escMesNome(S.mes)+'</span></div><div class="bxs">'+
    cpeCaixa('escala','💉','NAFS','Adicionar plantão: toque no dia, escolha o hospital e o anestesista')+
    cpeCaixa('escalas','🗓️','Escalas','Calendário preenchido por hospital e por anestesista')+
  '</div>';
}
</script>
